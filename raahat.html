/* ============================== HELPERS ============================== */
function riskFromScore(score){
  if(score<=25) return {label:"Stable", color:"var(--stable)", bg:"#E7F5EC", text:"#166A3D"};
  if(score<=50) return {label:"Low Risk", color:"var(--low)", bg:"#FBF3D6", text:"#8A6D06"};
  if(score<=70) return {label:"Moderate Risk", color:"var(--moderate)", bg:"#FCEBD6", text:"#9A5A0D"};
  if(score<=85) return {label:"High Risk", color:"var(--high)", bg:"#FBDEDE", text:"#A11616"};
  return {label:"Critical", color:"var(--critical)", bg:"#F7D2D2", text:"#7F0F0F"};
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function fmtDate(d){ return d; }
// Session token lives only in memory (not localStorage) — a real login is required each time the
// page loads, which is the point: unlike the old fake login, a stale/no session genuinely can't act.
let AUTH_TOKEN = null;
// Set by AppRoot so the api() helper can end the session centrally when the server says the
// token is gone, instead of every call site silently failing on its own.
let ON_SESSION_EXPIRED = null;

async function api(path, body, method){
  const headers = {"Content-Type":"application/json"};
  if(AUTH_TOKEN) headers.Authorization = "Bearer "+AUTH_TOKEN;
  const opts = {method: method || (body? "POST":"GET"), headers};
  if(body) opts.body = JSON.stringify(body);
  let response;
  try {
    response = await fetch(path, opts);
  } catch {
    const offline = new Error("Could not reach the server. Check your connection and try again.");
    offline.status = 0;
    throw offline;
  }
  if(!response.ok){
    // FastAPI reports the reason in {"detail": ...}; surfacing it means the UI can say
    // "Too many requests, wait 41s" instead of a generic "Request failed".
    let detail = "";
    try {
      const parsed = await response.json();
      detail = typeof parsed?.detail === "string" ? parsed.detail
        : Array.isArray(parsed?.detail) ? (parsed.detail[0]?.msg || "") : "";
    } catch {}
    const err = new Error(detail || `Request failed (${response.status})`);
    err.status = response.status;
    err.detail = detail;
    // 401 means the bearer token is expired or revoked: every subsequent call would fail the
    // same way, so end the session once and send the user back to sign in.
    if(response.status === 401 && AUTH_TOKEN && ON_SESSION_EXPIRED) ON_SESSION_EXPIRED();
    throw err;
  }
  return response.json();
}
async function exportReport(caseId){
  const headers = AUTH_TOKEN? {Authorization:"Bearer "+AUTH_TOKEN} : {};
  const response = await fetch(`/api/cases/${caseId}/report`, {headers});
  if(!response.ok) return;
  const text = await response.text();
  const blob = new Blob([text], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `raahat-case-${caseId}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function shortRisk(band, score){
  if(band==="Critical" || band==="High" || score>=71) return "High";
  if(band==="Moderate" || score>=51) return "Moderate";
  return "Low";
}
function relativeTime(value){
  if(!value) return "Live";
  const diff = Date.now() - new Date(value).getTime();
  if(diff < 90_000) return "now";
  if(diff < 3_600_000) return Math.round(diff/60_000)+"m ago";
  if(diff < 86_400_000) return Math.round(diff/3_600_000)+"h ago";
  return Math.round(diff/86_400_000)+"d ago";
}
function backendCaseRow(c){
  // Age/gender are not columns in the backend schema, so they read as unknown rather than
  // being invented for one particular case id.
  return {id:c.id, age:c.age ?? "—", gender:c.gender ?? "—", district:c.district, risk:shortRisk(c.risk_band,c.score), score:c.score, concern:c.risk_band+" distress assessment", updated:relativeTime(c.updated_at), status:c.risk_band==="Critical"?"Open":"Monitoring"};
}

/* ============================== TOAST ============================== */
const ToastCtx = createContext(null);
function ToastProvider({children}){
  const [items,setItems] = useState([]);
  const push = (msg, kind="default") => {
    const id = Math.random().toString(36).slice(2);
    setItems(list=>[...list,{id,msg,kind}]);
    setTimeout(()=> setItems(list=>list.filter(t=>t.id!==id)), 3200);
  };
  return <ToastCtx.Provider value={push}>
    {children}
    <div className="fixed bottom-5 right-5 z-[200] flex flex-col gap-2 items-end">
      {items.map(t=>(
        <div key={t.id} className={`toast-in px-4 py-3 rounded-xl shadow-lg text-sm font-medium max-w-sm ${t.kind==='error' ? 'bg-red-600 text-white' : t.kind==='success' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-white'}`}>
          {t.msg}
        </div>
      ))}
    </div>
  </ToastCtx.Provider>;
}
function useToast(){ return useContext(ToastCtx); }

/* ============================== CHARTS (hand-built SVG) ============================== */
// A chart needs at least two points to draw a line; with fewer it renders an empty state
// instead of throwing on pts[pts.length-1], which is what a case with no recorded events
// now legitimately produces.
function ChartEmptyState({height, label}){
  return (
    <div className="flex items-center justify-center text-xs text-black/35 border border-dashed border-black/10 rounded-xl"
         style={{height}} role="img" aria-label={label}>
      {label}
    </div>
  );
}

function DistressLineChart({data, width=640, height=230, showZones=true, weekLabels}){
  if(!data || data.length < 2) return <ChartEmptyState height={height} label="No recorded check-ins yet — the trend appears after the first check-in."/>;
  const pad = {l:34,r:14,t:14,b:26};
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const max=100, min=0;
  const pts = data.map((v,i)=>{
    const x = pad.l + (i/(data.length-1))*w;
    const y = pad.t + h - ((v-min)/(max-min))*h;
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?`M ${p[0]},${p[1]}`:`L ${p[0]},${p[1]}`)).join(" ");
  const areaPath = path + ` L ${pts[pts.length-1][0]},${pad.t+h} L ${pts[0][0]},${pad.t+h} Z`;
  const zones = [
    {from:86,to:100,color:"#FBE1E1"},{from:71,to:86,color:"#FCE7DA"},{from:51,to:71,color:"#FEF1D6"},
    {from:26,to:51,color:"#FBF7DE"},{from:0,to:26,color:"#E9F6ED"},
  ];
  const yOf = v => pad.t + h - ((v-min)/(max-min))*h;
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
      {showZones && zones.map((z,i)=>(
        <rect key={i} x={pad.l} y={yOf(z.to)} width={w} height={yOf(z.from)-yOf(z.to)} fill={z.color} />
      ))}
      {[0,25,50,75,100].map(v=>(
        <g key={v}>
          <line x1={pad.l} x2={pad.l+w} y1={yOf(v)} y2={yOf(v)} stroke="#E4E8EE" strokeWidth="1"/>
          <text x={pad.l-8} y={yOf(v)+3} fontSize="9.5" textAnchor="end" fill="#8A93A3">{v}</text>
        </g>
      ))}
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#1E4B8F" stopOpacity="0.18"/>
          <stop offset="100%" stopColor="#1E4B8F" stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={areaPath} fill="url(#areaGrad)"/>
      <path d={path} fill="none" stroke="#1E4B8F" strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=>(
        <circle key={i} cx={p[0]} cy={p[1]} r={i===pts.length-1?4.5:2.6} fill={i===pts.length-1?"#DC2626":"#1E4B8F"} stroke="#fff" strokeWidth={i===pts.length-1?2:1}/>
      ))}
      {weekLabels && weekLabels.map((lb,i)=>(
        <text key={i} x={pts[i][0]} y={height-6} fontSize="9.5" textAnchor="middle" fill="#8A93A3">{lb}</text>
      ))}
    </svg>
  );
}

function BarChartSimple({data, width=360, height=200, barColor}){
  if(!data || !data.length) return <ChartEmptyState height={height} label="No data yet."/>;
  const pad={l:28,r:10,t:14,b:22};
  const w=width-pad.l-pad.r, h=height-pad.t-pad.b;
  const max = Math.max(...data.map(d=>d.value))*1.15;
  const bw = w/data.length*0.55;
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`}>
      {[0,0.5,1].map((f,i)=>(
        <line key={i} x1={pad.l} x2={pad.l+w} y1={pad.t+h*(1-f)} y2={pad.t+h*(1-f)} stroke="#EEF1F5" />
      ))}
      {data.map((d,i)=>{
        const bh = (d.value/max)*h;
        const cx = pad.l + (i+0.5)*(w/data.length);
        return (
          <g key={i}>
            <rect x={cx-bw/2} y={pad.t+h-bh} width={bw} height={bh} rx="4" fill={d.color||barColor}/>
            <text x={cx} y={pad.t+h-bh-6} fontSize="11" fontWeight="700" textAnchor="middle" fill="#374151">{d.value}</text>
            <text x={cx} y={height-5} fontSize="10" textAnchor="middle" fill="#8A93A3">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function LineTrendMini({data,width=420,height=170,color="#2C8C82"}){
  if(!data || data.length < 2) return <ChartEmptyState height={height} label="Not enough data yet."/>;
  const pad={l:24,r:10,t:14,b:20};
  const w=width-pad.l-pad.r,h=height-pad.t-pad.b;
  const max=Math.max(...data.map(d=>d.value))*1.2, min=0;
  const pts=data.map((d,i)=>{
    const x=pad.l+(i/(data.length-1))*w;
    const y=pad.t+h-((d.value-min)/(max-min))*h;
    return [x,y];
  });
  const path=pts.map((p,i)=>(i===0?`M ${p[0]},${p[1]}`:`L ${p[0]},${p[1]}`)).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`}>
      {[0,0.5,1].map((f,i)=>(<line key={i} x1={pad.l} x2={pad.l+w} y1={pad.t+h*(1-f)} y2={pad.t+h*(1-f)} stroke="#EEF1F5"/>))}
      <path d={path} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
      {pts.map((p,i)=>(<circle key={i} cx={p[0]} cy={p[1]} r="3" fill={color}/>))}
      {data.map((d,i)=>(<text key={i} x={pts[i][0]} y={height-4} fontSize="9.5" textAnchor="middle" fill="#8A93A3">{d.label}</text>))}
    </svg>
  );
}

/* ============================== SHARED UI ============================== */
function RiskBadge({level}){
  const map = {
    "High Risk": {bg:"#FBDEDE", text:"#A11616", dot:"var(--high)"},
    "High": {bg:"#FBDEDE", text:"#A11616", dot:"var(--high)"},
    "Moderate Risk": {bg:"#FCEBD6", text:"#9A5A0D", dot:"var(--moderate)"},
    "Moderate": {bg:"#FCEBD6", text:"#9A5A0D", dot:"var(--moderate)"},
    "Low Risk": {bg:"#FBF3D6", text:"#8A6D06", dot:"var(--low)"},
    "Low": {bg:"#FBF3D6", text:"#8A6D06", dot:"var(--low)"},
    "Minimal": {bg:"#E7F5EC", text:"#166A3D", dot:"var(--minimal)"},
    "Stable": {bg:"#E7F5EC", text:"#166A3D", dot:"var(--stable)"},
    "Critical": {bg:"#F7D2D2", text:"#7F0F0F", dot:"var(--critical)"},
  };
  const s = map[level] || map["Moderate"];
  return <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold" style={{background:s.bg,color:s.text}}>
    <span className="w-1.5 h-1.5 rounded-full" style={{background:s.dot}}></span>{level}
  </span>;
}

function StatusPill({status}){
  const map = {
    Open:"bg-blue-100 text-blue-700", "In Progress":"bg-amber-100 text-amber-700",
    Monitoring:"bg-emerald-100 text-emerald-700", Resolved:"bg-slate-200 text-slate-600",
  };
  return <span className={`px-2.5 py-1 rounded-full text-xs font-medium ${map[status]||"bg-slate-100 text-slate-600"}`}>{status}</span>;
}

function Modal({open,onClose,title,children,width="max-w-md"}){
  const panelRef = useRef(null);
  const titleId = useRef("modal-"+Math.random().toString(36).slice(2,9)).current;
  // Keyboard and screen-reader basics: Escape closes, focus moves into the dialog on open and
  // returns to whatever opened it on close, and the dialog announces itself with its title.
  useEffect(()=>{
    if(!open) return;
    const previouslyFocused = document.activeElement;
    const onKey = e => { if(e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    const focusTarget = panelRef.current?.querySelector("input,textarea,select,button");
    focusTarget?.focus();
    return ()=>{
      document.removeEventListener("keydown", onKey);
      if(previouslyFocused instanceof HTMLElement) previouslyFocused.focus();
    };
  },[open,onClose]);
  if(!open) return null;
  return (
    <div className="fixed inset-0 z-[150] flex items-center justify-center p-4" style={{background:"rgba(15,20,30,.45)"}} onMouseDown={onClose}>
      <div ref={panelRef} role="dialog" aria-modal="true" aria-labelledby={titleId}
           className={`bg-white rounded-2xl shadow-2xl w-full ${width} pop-in`} onMouseDown={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h3 id={titleId} className="font-semibold text-slate-800">{title}</h3>
          <button onClick={onClose} aria-label="Close dialog" className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 focus-ring"><Icon name="x" size={18}/></button>
        </div>
        <div className="p-6">{children}</div>
      </div>
    </div>
  );
}

function NewCaseModal({open,onClose,onCreated}){
  const {createCase} = useApp();
  const toast = useToast();
  const [form,setForm] = useState({name:"",district:"",state:"",category:"Witness Intimidation"});
  const [saving,setSaving] = useState(false);
  async function submit(){
    if(!form.name.trim() || !form.district.trim() || !form.state.trim()) return;
    setSaving(true);
    try {
      const created = await createCase(form);
      toast(`Case #${created.id} registered for ${created.name}.`,"success");
      setForm({name:"",district:"",state:"",category:"Witness Intimidation"});
      onClose();
      if(onCreated) onCreated(created);
    } catch { toast("Could not create the case. Please try again.","error"); }
    finally { setSaving(false); }
  }
  return (
    <Modal open={open} onClose={onClose} title="Register new case">
      <div className="space-y-3">
        <div>
          <label className="block text-xs font-semibold text-slate-500 mb-1">Full name</label>
          <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus-ring"/>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1">District</label>
            <input value={form.district} onChange={e=>setForm(f=>({...f,district:e.target.value}))} className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus-ring"/>
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1">State</label>
            <input value={form.state} onChange={e=>setForm(f=>({...f,state:e.target.value}))} className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus-ring"/>
          </div>
        </div>
        <div>
          <label className="block text-xs font-semibold text-slate-500 mb-1">Case category</label>
          <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))} className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm">
            {CASE_CATEGORIES.map(c=>(<option key={c} value={c}>{c}</option>))}

    </Modal>
  );

/* ============================== GLOBAL APP DATA / CONTEXT ============================== */
const AppCtx = createContext(null);
function useApp(){ return useContext(AppCtx); }

function AppRoot(){
  const [screen,setScreen] = useState("landing"); // landing | login | victim | counsellor | admin
  const [loginRole,setLoginRole] = useState("victim");
  const [session,setSession] = useState(null); // {role, name, case_id} once logged in

  const [distressScore,setDistressScore] = useState(0);
  const weekLabels = ["Wk 1","Wk 2","Wk 3","Wk 4","Wk 5","Wk 6"];
  const [alerts,setAlerts] = useState([]);
  // Start empty: these used to hold fictional entries that stayed on screen whenever the
  // backend had nothing for a case, so a brand-new case appeared to have history.
  const [interventionLog,setInterventionLog] = useState([]);
  const [checkins,setCheckins] = useState([]);
  // notes and per-case history live entirely in dashboardData (backend-persisted), refreshed on every action —
  // no local accumulator, so a page reload shows exactly what the server has, not a stale client-side guess.
  const [dashboardData,setDashboardData] = useState({cases:[],alerts:[],events:[],interventions:[],notes:[],metrics:null});
  const [dataError,setDataError] = useState(null);

  // `activeSession` lets a caller pass the session it just received from /api/auth/login:
  // setSession() has not been applied to state yet at that point, so reading `session` here
  // would still be the previous (or null) one.
  async function refreshDashboard(activeSession){
    if(!AUTH_TOKEN) return;
    const active = activeSession || session;
    try {
      const data = await api("/api/me");
      setDashboardData(data);
      const ownCase = active?.case_id
        ? (data.cases||[]).find(c=>c.id===active.case_id)
        : null;
      if(ownCase) setDistressScore(ownCase.score);
      const byCase = Object.fromEntries((data.cases||[]).map(c=>[c.id,c]));
      setAlerts((data.alerts||[]).map(a=>({
        id:"db-"+a.id, caseId:a.case_id, name:(byCase[a.case_id]||{}).name||"Case #"+a.case_id,
        // Unknown district/score render as "—" rather than borrowing a plausible-looking value
        // from the seeded demo case.
        district:(byCase[a.case_id]||{}).district ?? "—", score:(byCase[a.case_id]||{}).score ?? "—",
        reason:a.reason, severity:a.severity, status:a.status
      })));
      // Assign unconditionally: guarding on .length meant an empty server response left the
      // previous (or seeded) client-side list on screen.
      setCheckins((data.events||[]).map(e=>({id:"event-"+e.id,date:relativeTime(e.created_at),summary:`${e.kind}: ${e.content.slice(0,90)}`,caseId:e.case_id})));
      setInterventionLog((data.interventions||[]).map(i=>({id:"int-"+i.id,title:i.title,status:i.status,date:relativeTime(i.created_at),forCase:i.case_id})));
      setDataError(null);
    } catch(err) {
      // Swallowing this used to leave the last-known numbers on screen with no indication that
      // they had stopped updating — the worst possible failure mode for a risk dashboard.
      if(err.status !== 401) setDataError(err.message || "Could not refresh data from the server.");
    }
  }

  async function createCase(payload){
    const created = await api("/api/cases", payload);
    await refreshDashboard();
    return created;
  }
  async function updateAlert(alertId, patch){
    await api(`/api/alerts/${alertId}`, patch, "PATCH");
    await refreshDashboard();
  }
  async function addNote(caseId, text, author){
    await api(`/api/cases/${caseId}/notes`, {text, author: author || "Care team"});
    await refreshDashboard();
  }

  function bumpDistress(delta){
    setDistressScore(prev=>clamp(prev+delta, 0, 100));
  }
  function addAlert(a){
    setAlerts(prev=>[{id:Date.now(), status:"Unresolved", ...a}, ...prev]);
  }
  function applyAssessment(assessment){
    setDistressScore(assessment.score);
    if(["High","Critical"].includes(assessment.risk_band) && session?.case_id){
      addAlert({caseId:session.case_id, name:session.name, reason:assessment.explanations.join("; "), severity:assessment.risk_band});
    }
    refreshDashboard();
  }

  async function login(email, password){
    const result = await api("/api/auth/login", {email, password});
    AUTH_TOKEN = result.token;
    setSession(result);
    setLoginRole(result.role);
    setScreen(result.role);
    refreshDashboard(result);
    return result;
  }
  const DEMO_CREDENTIALS = {
    victim:{email:"victim@demo.in", password:"demo123"},
    counsellor:{email:"counsellor@demo.in", password:"demo123"},
    admin:{email:"admin@demo.in", password:"demo123"},
  };
  async function quickSwitch(role){
    const creds = DEMO_CREDENTIALS[role];
    return login(creds.email, creds.password);
  }
  function logout(){
    AUTH_TOKEN = null;
    setSession(null);
    setDashboardData({cases:[],alerts:[],events:[],interventions:[],notes:[],metrics:null});
    setDataError(null);
    setDistressScore(0);
    setCheckins([]);
    setInterventionLog([]);
    setAlerts([]);
    setScreen("landing");
  }

  // A 401 from any call means the session is gone; drop the user at the login screen once
  // rather than letting every screen fail silently in place.
  useEffect(()=>{
    ON_SESSION_EXPIRED = () => {
      AUTH_TOKEN = null;
      setSession(null);
      setDashboardData({cases:[],alerts:[],events:[],interventions:[],notes:[],metrics:null});
      setDataError("Your session expired. Please sign in again.");
      setScreen("login");
    };
    return ()=>{ ON_SESSION_EXPIRED = null; };
  },[]);

  // Every victim-facing screen reads the case from the session instead of assuming the
  // seeded demo case: signing in as a different participant now shows that participant's data.
  const caseId = session?.case_id || null;
  const ctxValue = {
    screen,setScreen, loginRole,setLoginRole, login, quickSwitch, logout, session, caseId,
    distressScore, weekLabels, bumpDistress, applyAssessment,
    alerts, addAlert, setAlerts,
    dashboardData, refreshDashboard, createCase, updateAlert, addNote, dataError, setDataError,
    interventionLog, setInterventionLog,
    checkins, setCheckins,
  };

  return (
    <ToastProvider>
      <AppCtx.Provider value={ctxValue}>
        {screen==="landing" && <LandingPage/>}
        {screen==="login" && <LoginPage/>}
        {screen==="victim" && <VictimApp/>}
        {screen==="counsellor" && <CounsellorApp/>}
        {screen==="admin" && <AdminApp/>}
        {screen!=="landing" && screen!=="login" && <DemoSwitcher/>}
        <StaleDataBanner/>
        <LiveAlerts/>
      </AppCtx.Provider>
    </ToastProvider>
  );
}

// Shown whenever the last refresh failed, so nobody reads stale risk numbers believing
// they are current.
function StaleDataBanner(){
  const {dataError,setDataError,refreshDashboard} = useApp();
  if(!dataError) return null;
  return (
    <div role="alert" className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 max-w-[92vw] flex items-center gap-3 px-4 py-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-sm shadow-lg">
      <Icon name="alert" size={16}/>
      <span className="font-medium">{dataError}</span>
      <button onClick={()=>{ setDataError(null); refreshDashboard(); }} className="px-2.5 py-1 rounded-lg bg-amber-900 text-white text-xs font-semibold">Retry</button>
      <button onClick={()=>setDataError(null)} aria-label="Dismiss message" className="text-amber-900/60 text-lg leading-none">&times;</button>
    </div>
  );
}

// Live alert push: staff dashboards (counsellor/admin) open a WebSocket so a new
// High/Critical escalation shows up immediately, without waiting for a manual
// refresh or an action-triggered refetch. Victim sessions don't need this — they
// only ever see their own case, which they're already looking at.
function LiveAlerts(){
  const {session, addAlert, refreshDashboard} = useApp();
  const toast = useToast();
  useEffect(()=>{
    if(!["counsellor","admin"].includes(session?.role) || !AUTH_TOKEN) return;
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(`${protocol}//${location.host}/ws/alerts?token=${encodeURIComponent(AUTH_TOKEN)}`);
    socket.onmessage = (event) => {
      try {
        const payload = JSON.parse(event.data);
        if(payload.type !== "alert") return;
        addAlert({caseId:payload.case_id, name:payload.name, severity:payload.severity, reason:payload.reason});
        toast(`${payload.severity} escalation — ${payload.name}: ${payload.reason}`, payload.severity==="Critical" ? "error" : "default");
        refreshDashboard();
      } catch {}
    };
    return () => socket.close();
  }, [session?.role]);
  return null;
}

function DemoSwitcher(){
  const {screen,quickSwitch,logout} = useApp();
  const toast = useToast();
  const roles = [["victim","Victim"],["counsellor","Counsellor"],["admin","Admin"]];
  async function switchTo(role){
    if(role===screen) return;
    try { await quickSwitch(role); }
    catch { toast("Could not switch demo role — sign in again.","error"); }
  }
  return (
    <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[180] bg-white/95 backdrop-blur border border-slate-200 shadow-lg rounded-full px-1.5 py-1.5 flex items-center gap-1 text-xs font-medium">
      <span className="pl-2 pr-1 text-slate-400 hidden sm:inline">Demo view:</span>
      {roles.map(([k,label])=>(
        <button key={k} onClick={()=>switchTo(k)} className={`px-3 py-1.5 rounded-full transition ${screen===k? "bg-slate-900 text-white":"text-slate-600 hover:bg-slate-100"}`}>{label}</button>
      ))}
      <button onClick={logout} aria-label="Log out" className="ml-1 p-1.5 rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-700" title="Log out"><Icon name="logout" size={15}/></button>
    </div>
  );
}

// Below md the sidebars are hidden, which previously left phone users with no navigation at
// all — the victim app could only ever show Home. This renders the same nav entries as a
// scrollable bar (staff) or a fixed bottom tab bar (victim), which is how this app is actually

function MobileNav({nav, current, onSelect, variant="staff", onLogout}){
  const base = "flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap shrink-0";
  if(variant === "victim"){
    return (
      <nav aria-label="Main" className="md:hidden fixed bottom-0 inset-x-0 z-[110] flex gap-1 overflow-x-auto px-2 py-2 border-t border-black/10" style={{background:"var(--v-bg)"}}>
        {nav.map(([id,label,icon])=>(
          <button key={id} onClick={()=>onSelect(id)} aria-current={current===id?"page":undefined}
                  className={`${base} ${current===id? "bg-white shadow-sm":"text-black/50"}`}
                  style={current===id?{color:"var(--v-green-d)"}:{}}>
            <Icon name={icon} size={15}/> {label}
          </button>
        ))}
        {onLogout && <button onClick={onLogout} className={`${base} text-black/50`}><Icon name="logout" size={15}/> Sign out</button>}
      </nav>
    );
  }
  return (
    <nav aria-label="Main" className="md:hidden flex gap-1.5 overflow-x-auto px-4 py-2.5 bg-white border-b border-slate-200">
      {nav.map(([id,label,icon])=>(
        <button key={id} onClick={()=>onSelect(id)} aria-current={current===id?"page":undefined}
                className={`${base} ${current===id? "bg-slate-900 text-white":"bg-slate-100 text-slate-600"}`}>
          <Icon name={icon} size={14}/> {label}
        </button>
      ))}
      {/* Sign out lives in the sidebar, which is hidden below md — without this, a phone user
          could navigate the app but had no way to end their session. */}
      {onLogout && <button onClick={onLogout} className={`${base} bg-slate-100 text-slate-600`}><Icon name="logout" size={14}/> Sign out</button>}
    </nav>
  );
}

function VictimCheckin({go}){
  const {applyAssessment,setCheckins} = useApp();
  const toast = useToast();
  const [step,setStep] = useState(0);
  const [answers,setAnswers] = useState({});
  const steps = [
    {key:"mood", q:"How have you been feeling emotionally?", opts:["Good","Okay","Low","Struggling"]},
    {key:"sleep", q:"How has your sleep been recently?", opts:["Restful","A little disturbed","Poor","Very poor"]},
    {key:"unsafe", q:"Have you felt unsafe or threatened recently?", opts:["No","A little","Yes"]},
    {key:"anxiety", q:"Have you experienced increased anxiety, fear or stress?", opts:["Not really","Somewhat","Yes, noticeably"]},
    {key:"case", q:"Has anything related to your case, court hearings or investigation been worrying you?", opts:["No","A little","Yes, a lot"]},
    {key:"support", q:"Do you need any support right now?", opts:["Counselling","Medical Support","Witness Protection","Legal Assistance","Financial Assistance","Relocation Support","Rehabilitation Support","I'm okay for now"], multi:true},
  ];
  const done = step>=steps.length;

  function choose(val){
    const key = steps[step].key;
    setAnswers(a=>{
      if(steps[step].multi){
        const cur = a[key]||[];
        const nextArr = cur.includes(val)? cur.filter(x=>x!==val): [...cur,val];
        return {...a,[key]:nextArr};
      }
      return {...a,[key]:val};
    });
  }
  function next(){
    if(step<steps.length-1) setStep(step+1);
    else finish();
  }
  async function finish(){
    const maps = {mood:{"Good":0,"Okay":1,"Low":2,"Struggling":3},sleep:{"Restful":0,"A little disturbed":1,"Poor":2,"Very poor":3},unsafe:{"No":0,"A little":1,"Yes":2},anxiety:{"Not really":0,"Somewhat":1,"Yes, noticeably":2},case:{"No":0,"A little":1,"Yes, a lot":3}};
    try {
      const assessment = await api("/api/checkins", {mood:maps.mood[answers.mood],sleep:maps.sleep[answers.sleep],safety:maps.unsafe[answers.unsafe],anxiety:maps.anxiety[answers.anxiety],case_pressure:maps.case[answers.case],support:answers.support||[]});
      applyAssessment(assessment);
      setCheckins(c=>[{id:Date.now(),date:"Today",summary:`Guided check-in completed · ${assessment.risk_band} assessment.`},...c]);
      setStep(steps.length);
    } catch { toast("Unable to save your check-in. Please try again.","error"); }
  }

  if(done){
    return (
      <div className="max-w-lg mx-auto text-center py-20 fade-in">
        <div className="w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-5" style={{background:"#EAF3EA",color:"var(--v-green)"}}><Icon name="check" size={28}/></div>
        <h2 className="text-2xl font-bold mb-2" style={{color:"var(--v-ink)"}}>Thank you for checking in.</h2>
        <p className="text-black/55 mb-8">Your wellbeing update has been securely recorded and shared with your care team.</p>
        <button onClick={()=>go("home")} className="px-5 py-3 rounded-xl text-white font-semibold" style={{background:"var(--v-green)"}}>Back to Home</button>
      </div>
    );
  }

  const s = steps[step];
  const selected = answers[s.key];
  return (
    <div className="max-w-xl mx-auto fade-in">
      <div className="mb-6">
        <div className="flex items-center gap-1.5 mb-2">
          {steps.map((_,i)=>(<div key={i} className="h-1.5 flex-1 rounded-full" style={{background: i<=step? "var(--v-green)":"#E7E2D6"}}></div>))}
        </div>
        <div className="text-xs text-black/40">Step {step+1} of {steps.length}</div>
      </div>
      <Card className="p-7">
        <h2 className="text-xl font-semibold mb-6" style={{color:"var(--v-ink)"}}>{s.q}</h2>
        <div className="flex flex-col gap-2.5 mb-6">
          {s.opts.map(o=>{
            const isSel = s.multi? (selected||[]).includes(o) : selected===o;
            return (
              <button key={o} onClick={()=>choose(o)} className={`text-left px-4 py-3 rounded-xl border transition font-medium text-sm ${isSel? "border-transparent text-white":"border-black/10 text-black/65 hover:bg-black/[0.03]"}`} style={isSel?{background:"var(--v-green)"}:{}}>
                {o}
              </button>
            );
          })}
        </div>
        <div className="flex justify-between">
          <button disabled={step===0} onClick={()=>setStep(step-1)} className="px-4 py-2 text-sm font-medium text-black/40 disabled:opacity-30">Back</button>
          <button onClick={next} disabled={!selected || (s.multi && selected.length===0)} className="px-5 py-2.5 rounded-xl text-white font-semibold disabled:opacity-30" style={{background:"var(--v-green)"}}>{step===steps.length-1? "Submit":"Next"}</button>
        </div>
      </Card>
    </div>
  );
}

/* ============================== CHATBOT WIDGET ============================== */
function ChatbotWidget(){
  const [open,setOpen] = useState(false);
  const {applyAssessment} = useApp();
  const toast = useToast();
  const [messages,setMessages] = useState([
    {from:"bot",text:"Hi Asha. I'm here to check in with you. How have you been feeling lately?"},
  ]);
  const [input,setInput] = useState("");
  const [emergency,setEmergency] = useState(false);
  const [sending,setSending] = useState(false);
  const [recording,setRecording] = useState(false);
  const scrollRef = useRef(null);
  const recorderRef = useRef(null), streamRef = useRef(null), recordingTimer = useRef(null);

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; },[messages,emergency,open]);
  // recorderRef is null until the user actually records something, so this cleanup threw on
  // unmount for every session that never used a voice note — taking the whole app down to a
  // white screen on sign-out, because an error thrown during unmount unmounts the React tree.
  useEffect(()=>()=>{ clearTimeout(recordingTimer.current); if(recorderRef.current) recorderRef.current.onstop=null; streamRef.current?.getTracks().forEach(track=>track.stop()); },[]);

  const quick = ["I feel okay","I feel anxious","I feel unsafe","I feel very low","I need someone to talk to","Something else"];

  async function rateMessage(messageId, rating){
    try {
      await api("/api/chat/feedback", {message_id:messageId, rating});
      setMessages(m=>m.map(item=>item.messageId===messageId? {...item,feedback:rating}:item));
    } catch { toast("Feedback could not be saved. Please try again.","error"); }
  }

  function speak(message){
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(message.text);
    utterance.lang = message.language==="hinglish" || message.language==="hindi" ? "hi-IN" : "en-IN";
    window.speechSynthesis.speak(utterance);
  }

  async function sendVoiceNote(audio){
    if(audio.size > 5*1024*1024){ toast("Voice note is too large. Please keep it under 5 MB.","error"); return; }
    setMessages(m=>[...m,{from:"user",text:"Voice note: transcribing..."}]); setSending(true);
    try {
      const headers = {"Content-Type":audio.type||"audio/webm","X-Voice-Consent":"yes"};
      if(AUTH_TOKEN) headers.Authorization = "Bearer "+AUTH_TOKEN;
      const response = await fetch("/api/voice",{method:"POST",headers,body:audio});
      const payload = await response.json(); if(!response.ok) throw new Error(payload.detail||"Voice transcription failed");
      setMessages(m=>[...m.slice(0,-1),{from:"user",text:"Voice note: "+payload.transcript},{from:"bot",text:payload.assistant,messageId:payload.message_id,language:payload.language}]);
      applyAssessment(payload.assessment);
      if(payload.urgent){ setEmergency(true); toast("Urgent support guidance is displayed below.","error"); }
    } catch(error) { setMessages(m=>m.map((item,i)=>i===m.length-1? {...item,text:"Voice note could not be transcribed. Please type your message."}:item)); }
    finally { setSending(false); }
  }

  async function startRecording(){
    if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ toast("Voice notes are not supported by this browser.","error"); return; }
    if(!window.confirm("Your voice note will be sent to Gemini for transcription. The recording is not stored; its transcript is saved in this chat.")) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const mimeType = ["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(MediaRecorder.isTypeSupported);
      const chunks = [], recorder = mimeType ? new MediaRecorder(stream,{mimeType}) : new MediaRecorder(stream);
      streamRef.current=stream; recorderRef.current=recorder;
      recorder.ondataavailable=e=>{if(e.data.size) chunks.push(e.data);};
      recorder.onstop=()=>{ clearTimeout(recordingTimer.current); stream.getTracks().forEach(track=>track.stop()); setRecording(false); sendVoiceNote(new Blob(chunks,{type:recorder.mimeType||"audio/webm"})); };
      recorder.start(); setRecording(true);
      recordingTimer.current=setTimeout(()=>{if(recorder.state==="recording") recorder.stop();},45000);
    } catch { toast("Microphone access could not be started.","error"); }
  }

  function toggleRecording(){
    if(recording){ clearTimeout(recordingTimer.current); recorderRef.current?.stop(); }
    else startRecording();
  }

  async function send(text){
    if(!text.trim() || sending) return;
    setMessages(m=>[...m,{from:"user",text}]);
    setInput("");
    setSending(true);
    try {
      const headers = {"Content-Type":"application/json"};
      if(AUTH_TOKEN) headers.Authorization = "Bearer "+AUTH_TOKEN;
      const response = await fetch("/api/chat/stream", {method:"POST", headers, body:JSON.stringify({message:text})});
      if(!response.ok || !response.body) throw new Error("Streaming request failed");
      setMessages(m=>[...m,{from:"bot",text:"",streaming:true}]);
      const reader = response.body.getReader(), decoder = new TextDecoder();
      let buffer = "", fullText = "";
      while(true){
        const {done,value} = await reader.read();
        if(done) break;
        buffer += decoder.decode(value,{stream:true});
        const frames = buffer.split("\n\n"); buffer = frames.pop();
        frames.forEach(frame=>{
          const event = (frame.match(/^event: (.+)$/m)||[,"message"])[1];
          const data = (frame.match(/^data: (.+)$/m)||[,""])[1];
          if(!data) return;
          const payload = JSON.parse(data);
          if(event==="meta"){
            setMessages(m=>m.map((item,i)=>i===m.length-1? {...item,streaming:false,messageId:payload.message_id,language:payload.language}:item));
            applyAssessment(payload.assessment);
            if(payload.urgent){ setEmergency(true); toast("Urgent support guidance is displayed below.","error"); }
          } else if(payload.delta){
            fullText += payload.delta;
            setMessages(m=>m.map((item,i)=>i===m.length-1? {...item,text:fullText}:item));
          }
        });
      }
    } catch { setMessages(m=>[...m,{from:"bot",text:"I could not reach the support service. If you are in immediate danger, contact local emergency services now."}]); }
    finally { setSending(false); }
  }

  return (
    <>
      <button onClick={()=>setOpen(o=>!o)} className="fixed bottom-6 right-6 z-[120] w-16 h-16 rounded-full text-white shadow-2xl flex items-center justify-center pulse focus-ring" style={{background:"var(--v-green)"}} aria-label="Open support assistant">
        {open? <Icon name="x" size={24}/> : <Icon name="message" size={24}/>}
      </button>
      {open && (
        <div className="fixed bottom-28 right-6 z-[119] w-[380px] max-w-[92vw] h-[560px] max-h-[75vh] bg-white rounded-2xl shadow-2xl border border-black/5 flex flex-col slide-in-right overflow-hidden">
          <div className="px-4 py-3.5 text-white flex items-center gap-3" style={{background:"var(--v-green)"}}>
            <div className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center"><Icon name="leaf" size={17}/></div>
            <div>
              <div className="font-semibold text-sm">Raahat Support Assistant</div>
              <div className="text-[11px] text-white/80">Stored for approved care-team review</div>
            </div>
          </div>
          <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-4 space-y-3 bg-[#FAF6EF]">
            {messages.map((m,i)=>(
              <div key={m.id ?? `msg-${i}`} className={`flex flex-col ${m.from==="user"?"items-end":"items-start"}`}>
                <div className={`max-w-[80%] px-3.5 py-2.5 rounded-2xl text-sm leading-relaxed ${m.from==="user"? "bg-slate-800 text-white rounded-br-sm":"bg-white border border-black/5 text-black/70 rounded-bl-sm"}`}>{m.text}{m.streaming && <span className="animate-pulse">|</span>}</div>
                {m.from==="bot" && m.messageId && !m.streaming && <div className="flex gap-1 mt-1">
                  <button onClick={()=>speak(m)} aria-label="Listen to reply" title="Listen to reply" className="text-xs px-1.5 py-0.5 rounded hover:bg-black/5"><Icon name="volume" size={13}/></button>
                  <button onClick={()=>rateMessage(m.messageId,"helpful")} aria-label="Helpful" title="Helpful" className={`text-xs px-1.5 py-0.5 rounded ${m.feedback==="helpful"?"bg-emerald-100":"hover:bg-black/5"}`}>👍</button>
                  <button onClick={()=>rateMessage(m.messageId,"not_helpful")} aria-label="Not helpful" title="Not helpful" className={`text-xs px-1.5 py-0.5 rounded ${m.feedback==="not_helpful"?"bg-rose-100":"hover:bg-black/5"}`}>👎</button>
                </div>}
              </div>
            ))}
            {emergency && <EmergencyCard/>}
          </div>
          {!emergency && (
            <div className="border-t border-black/5 px-3 py-2.5 bg-white">
              <div className="flex flex-wrap gap-1.5 mb-2">
                {quick.map(q=>(<button key={q} disabled={sending} onClick={()=>send(q)} className="text-xs px-2.5 py-1.5 rounded-full border border-black/10 text-black/60 hover:bg-black/[0.03] disabled:opacity-40">{q}</button>))}
              </div>
              <div className="flex items-center gap-2">
                <input disabled={sending} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") send(input);}} placeholder="You can type here…" className="flex-1 px-3.5 py-2 rounded-full border border-black/10 text-sm focus-ring"/>
                <button disabled={sending} onClick={toggleRecording} aria-label={recording?"Stop voice note":"Record voice note"} title={recording?"Stop voice note":"Record voice note"} className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 border border-black/10 ${recording?"text-white bg-red-600":"text-black/60"}`}><Icon name={recording?"x":"mic"} size={15}/></button>
                <button disabled={sending} onClick={()=>send(input)} className="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-white disabled:opacity-40" style={{background:"var(--v-green)"}}><Icon name="send" size={15}/></button>
              </div>
            </div>
          )}
        </div>
      )}
    </>
  );
}

                  <button onClick={()=>setNewCaseOpen(true)} className="text-xs font-semibold text-emerald-700 flex items-center gap-1"><Icon name="plus" size={12}/> New case</button>
                  <button onClick={()=>setNavSel("all")} className="text-xs font-semibold text-blue-700">View all</button>
                </div>
              </div>
              <NewCaseModal open={newCaseOpen} onClose={()=>setNewCaseOpen(false)} onCreated={(created)=>{setSelected(created.id); setTab("overview");}}/>
              <div className="space-y-1">
                {(navSel==="priority"? priorityCases.filter(c=>c.risk==="High"||c.risk==="Moderate") : priorityCases).map(c=>(
                  <button key={c.id} onClick={()=>{setSelected(c.id); setTab("overview");}} className={`w-full text-left px-3 py-3 rounded-xl border transition ${selected===c.id? "border-transparent bg-slate-900 text-white":"border-transparent hover:bg-slate-50"}`}>
                    <div className="flex items-center justify-between">
                      <span className={`font-semibold text-sm ${selected===c.id?"text-white":"text-slate-800"}`}>{c.name}</span>
                      <span className={`text-[11px] ${selected===c.id?"text-white/60":"text-slate-400"}`}>{c.time}</span>
                    </div>
                    <div className={`text-xs mt-0.5 flex items-center gap-1.5 ${selected===c.id?"text-white/80":c.risk==="High"?"text-red-600":"text-amber-600"}`}>
                      <span className="w-1.5 h-1.5 rounded-full" style={{background:c.risk==="High"?"var(--high)":"var(--moderate)"}}></span>
                      {c.risk} risk · {c.reason}
                    </div>
                  </button>
                ))}
              </div>
            </div>

            <CaseDetailPanel caseId={selected} tab={tab} setTab={setTab}/>
          </div>
          </>)}

          {navSel==="all" && (
            <CounsellorAllCases
              dashboardData={dashboardData}
              onOpen={(id)=>{setSelected(id); setTab("overview"); setNavSel("dashboard");}}
            />
          )}
          {navSel==="interventions" && <CounsellorInterventions dashboardData={dashboardData}/>} 
          {navSel==="handoffs" && <HandoffQueue dashboardData={dashboardData}/>} 
          {navSel==="quality" && <FeedbackAnalytics feedback={dashboardData.feedback}/>} 
          {navSel==="reports" && <ReportsPage/>}
          {navSel==="messages" && <PlaceholderPage title="Messages" body="Direct messaging between counsellors and cases is not available in this demo."/>}
          {navSel==="resources" && <PlaceholderPage title="Resources" body="A shared library of coping tools, legal guides and referral contacts for counsellors."/>}
          {navSel==="settings" && <PlaceholderPage title="Settings" body="Manage your notification preferences and profile details."/>}
        </div>
      </main>
    </div>
  );
}

function HandoffQueue({dashboardData}){
  const cases = Object.fromEntries((dashboardData.cases||[]).map(c=>[c.id,c]));
  const alerts = (dashboardData.alerts||[]).filter(a=>a.status!=="Resolved");
  const followups = dashboardData.followups||[];
  return <div className="fade-in max-w-4xl"><h1 className="text-2xl font-bold text-slate-900 mb-1">Handoff queue</h1><p className="text-slate-500 mb-5">Open safety escalations and scheduled care-team follow-ups.</p><div className="space-y-3">
    {alerts.length===0 && followups.length===0 && <div className="text-sm text-slate-400 py-8 text-center">No active handoffs.</div>}
    {alerts.map(a=><div key={"alert"+a.id} className="bg-white border-l-4 border-red-500 p-4 rounded-lg"><div className="flex justify-between"><span className="font-semibold text-slate-800">{(cases[a.case_id]||{}).name||"Case #"+a.case_id}</span><StatusPill status={a.status==="Unresolved"?"Open":a.status}/></div><div className="text-sm text-slate-500 mt-1">{a.reason}</div><div className="text-xs text-slate-400 mt-2">{a.severity} · {a.assigned_to||"Unassigned"}</div></div>)}
    {followups.map(f=><div key={"follow"+f.id} className="bg-white border border-slate-200 p-4 rounded-lg"><div className="flex justify-between"><span className="font-semibold text-slate-800">{f.title}</span><StatusPill status={f.status}/></div><div className="text-sm text-slate-500 mt-1">Case #{f.case_id} · Assigned to {f.assigned_to||"Care team"}</div><div className="text-xs text-slate-400 mt-2">Due {f.due_at}</div></div>)}
  </div></div>;
}

function FeedbackAnalytics({feedback}){
  const data = feedback||{total:0,helpful:0,not_helpful:0,helpful_rate:0,by_intent:[]};
  return <div className="fade-in max-w-4xl"><h1 className="text-2xl font-bold text-slate-900 mb-1">Chat quality</h1><p className="text-slate-500 mb-5">Participant feedback collected for future human review and RLHF dataset curation.</p><div className="grid sm:grid-cols-3 gap-4 mb-6">{[[data.total,"Ratings"],[data.helpful_rate+"%","Helpful rate"],[data.not_helpful,"Needs review"]].map(([value,label])=><MetricMini key={label} value={String(value)} label={label} sub="Chat feedback" color="#1E4B8F" icon="chart"/>)}</div><div className="bg-white rounded-xl border border-slate-200 p-5"><div className="font-semibold text-slate-800 mb-3">Feedback by intent</div>{data.by_intent.length===0?<div className="text-sm text-slate-400">No feedback collected yet.</div>:<div className="space-y-2">{data.by_intent.map((r,i)=><div key={i} className="flex justify-between text-sm border-b border-slate-50 pb-2"><span className="text-slate-600 capitalize">{r.topic||"general"} · {r.rating.replace("_"," ")}</span><span className="font-semibold text-slate-800">{r.count}</span></div>)}</div>}</div></div>;
}

function CounsellorAllCases({dashboardData,onOpen}){
  const live = (dashboardData.cases||[]).map(c=>({id:c.id, name:c.name, risk:shortRisk(c.risk_band,c.score), score:c.score, district:c.district, updated:relativeTime(c.updated_at)}));
  const rows = live;
  return (
    <div className="fade-in">
      <h1 className="text-2xl font-bold text-slate-900 mb-1">All cases</h1>
      <p className="text-slate-500 mb-5">Every case currently assigned to your caseload.</p>
      <div className="bg-white rounded-2xl border border-slate-200 p-5 overflow-x-auto">
        <table className="w-full text-sm min-w-[560px]">
          <thead><tr className="text-left text-xs text-slate-400 border-b border-slate-100">{["Case","District","Risk","Score","Updated",""].map(h=>(<th key={h} className="pb-2.5 font-medium pr-4">{h}</th>))}</tr></thead>
          <tbody>
            {rows.map(c=>(
              <tr key={c.id} className="border-b border-slate-50 hover:bg-slate-50/70">
                <td className="py-2.5 pr-4 font-medium text-slate-700">{c.name}</td>
                <td className="py-2.5 pr-4 text-slate-500">{c.district}</td>
                <td className="py-2.5 pr-4"><RiskBadge level={c.risk}/></td>
                <td className="py-2.5 pr-4 text-slate-500">{c.score}</td>
                <td className="py-2.5 pr-4 text-slate-400">{c.updated}</td>
                <td className="py-2.5 pr-4"><button onClick={()=>onOpen(c.id)} className="text-blue-700 font-semibold text-xs">Open</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function CounsellorInterventions({dashboardData}){
  const casesById = Object.fromEntries((dashboardData.cases||[]).map(c=>[c.id,c]));
  const rows = (dashboardData.interventions||[]).map(i=>({...i, caseName:(casesById[i.case_id]||{}).name || "Case #"+i.case_id}));
  return (
    <div className="fade-in max-w-4xl">
      <h1 className="text-2xl font-bold text-slate-900 mb-1">Interventions</h1>
      <p className="text-slate-500 mb-5">Every intervention recommended or recorded across your caseload.</p>
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        {rows.length===0 && <div className="text-sm text-slate-400 py-8 text-center">No interventions recorded yet.</div>}
        <div className="space-y-2">
          {rows.map(i=>(
            <div key={i.id} className="flex items-center justify-between px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-100 text-sm">
              <span className="font-medium text-slate-700">{i.title} <span className="text-slate-400 font-normal">· {i.caseName}</span></span>
              <span className="flex items-center gap-3"><span className="text-xs text-slate-400">{relativeTime(i.created_at)}</span><StatusPill status={i.status==="Completed"?"Resolved":i.status==="Active"?"In Progress":"Monitoring"}/></span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function MetricMini({value,label,sub,color,icon}){
  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-4 flex items-center justify-between hover:shadow-md transition">
      <div>
        <div className="text-2xl font-bold" style={{color}}>{value}</div>
        <div className="text-sm font-medium text-slate-700">{label}</div>
        <div className="text-xs text-slate-400">{sub}</div>
      </div>
      <div className="w-10 h-10 rounded-full flex items-center justify-center" style={{background:color+"22", color}}><Icon name={icon} size={17}/></div>
    </div>
  );
}

function CaseDetailPanel({caseId,tab,setTab}){
  const {distressScore,weekLabels,interventionLog,setInterventionLog,checkins,dashboardData,refreshDashboard,addNote} = useApp();
  const toast = useToast();
  const liveCase = (dashboardData.cases||[]).find(c=>c.id===caseId);
  // Every field comes from the backend row. Anything the schema does not store (age, gender,
  // assigned counsellor) reads as unknown instead of being filled in with plausible fiction.
  const info = liveCase? {
    id:liveCase.id, name:liveCase.name, age:liveCase.age ?? "—", gender:liveCase.gender ?? "—",
    district:liveCase.district, state:liveCase.state, category:liveCase.category||"Other",
    registered: liveCase.created_at? new Date(liveCase.created_at).toLocaleDateString():"—", counsellor:"Unassigned",
  } : {id:caseId,name:"Case #"+caseId,age:"—",gender:"—",district:"—",state:"—",category:"—",registered:"—",counsellor:"—"};
  const score = liveCase? liveCase.score : 0;
  const risk = riskFromScore(score);
  const caseEvents = (dashboardData.events||[]).filter(e=>e.case_id===caseId);
  const eventScores = [...caseEvents].reverse().map(e=>e.assessment.score);
  // History is always derived from real backend events (for any live case, Asha included) — never a
  // client-side accumulator, so a page reload shows the server's actual record, not a stale guess.
  // A case with no recorded events gets an empty chart with an honest empty state, not an
  // invented downward trend.
  const caseHistory = eventScores.length>=2 ? eventScores : eventScores.length===1 ? [eventScores[0],eventScores[0]] : [];
  const backendInterventions = (dashboardData.interventions||[]).filter(i=>i.case_id===caseId).map(i=>({id:"int-"+i.id,title:i.title,status:i.status,date:relativeTime(i.created_at)}));
  const localInterventions = interventionLog.filter(i=>i.forCase===info.id);
  const displayedInterventions = liveCase? [...localInterventions.filter(i=>i.forCase===info.id), ...backendInterventions] : localInterventions;
  const displayedNotes = (dashboardData.notes||[]).filter(n=>n.case_id===info.id);
  const displayedCheckins = checkins.filter(c=>c.caseId===info.id);
  const [filter,setFilter] = useState("30D");
  const [modal,setModal] = useState(null);
  const [note,setNote] = useState("");
  const [noteSaving,setNoteSaving] = useState(false);
  const [overrideOpen,setOverrideOpen] = useState(false);
  const [overrideForm,setOverrideForm] = useState({score,risk_band:risk.label.replace(" Risk",""),note:""});
  const [overrideSaving,setOverrideSaving] = useState(false);

  async function submitNote(){
    if(!note.trim()) return;
    setNoteSaving(true);
    try {
      await addNote(info.id, note.trim());
      setNote("");
      toast("Case note added.","success");
    } catch { toast("Could not save the note. Please try again.","error"); }
    finally { setNoteSaving(false); }
  }

  async function submitOverride(){
    setOverrideSaving(true);
    try {
      await api(`/api/cases/${info.id}/override`, {score:Number(overrideForm.score), risk_band:overrideForm.risk_band, note:overrideForm.note}, "PATCH");
      toast("Assessment overridden and logged for this case.","success");
      setOverrideOpen(false);
      await refreshDashboard();
    } catch { toast("Could not save the override. Please try again.","error"); }
    finally { setOverrideSaving(false); }
  }

  async function createFollowup(){
    try {
      await api(`/api/cases/${info.id}/followups`, {title:"Counsellor follow-up", due_at:new Date(Date.now()+86400000).toISOString(), assigned_to:info.counsellor||"Care team"});
      await refreshDashboard(); toast("Follow-up task added to the handoff queue.","success");
    } catch { toast("Could not create the follow-up task.","error"); }
  }

  // These used to be a fixed array ("Voice Stress: Elevated", "Threat Indicator: Reported")
  // rendered identically for every case, including one with no assessment at all — signals the
  // system never computes, presented to a counsellor as if measured. They are now read from
  // this case's most recent assessment factors, and absent when there is no assessment.
  // Real per-assessment explanation: pulled from the latest backend event for this case, not a
  // fixed illustrative array — a case with no events yet (a brand-new case) shows an empty state
  // instead of numbers that were never actually computed for it.
  const latestAssessment = caseEvents.length ? caseEvents[0].assessment : null;
  const factors = (latestAssessment?.factors || []).map(f=>({label:f.label, val:f.weight, suffix:"% relative weight"}));
  const confidence = latestAssessment?.confidence;
  const INDICATOR_SCALES = {mood:3, sleep:3, safety:2, anxiety:2, case_pressure:3, missed_checkins:10, engagement:4, text_risk:4};
  const indicators = (latestAssessment?.factors || []).map(f=>{
    const max = INDICATOR_SCALES[f.key] || 1;
    // engagement is protective: a high raw value is a good sign, every other factor is the reverse
    const severe = f.key === "engagement" ? f.value <= max/2 : f.value >= max/2;
    return {k:f.label, v:`${f.value} / ${max}`, up:severe};
  });

  function runIntervention(title){
    setModal(title);
  }
  function confirmIntervention(){
    setInterventionLog(l=>[{id:Date.now(), title:modal, status:"Scheduled", date:"Today", forCase:info.id},...l]);
    toast(`${modal} — action completed successfully.`,"success");
    setModal(null);
  }

  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-5">
      <div className="flex items-start justify-between mb-4">
        <div className="flex items-center gap-3">
          <div className="w-14 h-14 rounded-full bg-slate-200"></div>
          <div>
            <div className="flex items-center gap-2"><span className="font-bold text-lg text-slate-900">{info.name}</span><RiskBadge level={risk.label}/></div>
            <div className="text-xs text-slate-400">Case ID #{info.id} · {info.gender!=="—"? (info.age+" yrs"):"—"} · {info.district}, {info.state}</div>
          </div>
        </div>
        <div className="text-right">
          <div className="text-xs text-slate-400">
            Last update<br/><span className="text-slate-600 font-medium">{liveCase? relativeTime(liveCase.updated_at) : "2h ago"}</span>
            {liveCase && <><br/>Last check-in<br/><span className="text-slate-600 font-medium">{liveCase.last_checkin_at? relativeTime(liveCase.last_checkin_at) : "No check-in yet"}</span></>}
          </div>
          {liveCase && <button onClick={()=>exportReport(info.id)} className="mt-2 text-xs font-semibold text-blue-700 flex items-center gap-1 ml-auto"><Icon name="download" size={12}/> Export report</button>}
        </div>
      </div>

      <div className="flex gap-5 border-b border-slate-100 mb-5 text-sm font-medium overflow-x-auto">
        {["overview","notes","risk","interventions","history"].map(t=>(
          <button key={t} onClick={()=>setTab(t)} className={`pb-2.5 border-b-2 capitalize whitespace-nowrap ${tab===t?"border-emerald-600 text-emerald-700":"border-transparent text-slate-400 hover:text-slate-600"}`}>
            {t==="risk"?"Risk indicators":t}
          </button>
        ))}
      </div>

      {tab==="overview" && (
        <div className="grid lg:grid-cols-[1fr_320px] gap-6">
          <div>
            <div className="text-sm font-semibold text-slate-700 mb-1.5">Current situation</div>
            <p className="text-sm text-slate-500 leading-relaxed mb-5">Latest backend assessments, check-ins and chat events are synced here for human review. Close follow-up is recommended when the score or alerts increase.</p>
            <div className="text-sm font-semibold text-slate-700 mb-2">Key indicators</div>
            <div className="grid grid-cols-2 gap-x-6 gap-y-2 mb-5">
              {indicators.length===0 && <div className="col-span-2 text-sm text-slate-400">No assessment recorded for this case yet.</div>}
              {indicators.map(k=>(
                <div key={k.k} className="flex items-center justify-between text-sm py-1 border-b border-slate-50">
                  <span className="text-slate-500">{k.k}</span>
                  <span className={`font-medium flex items-center gap-1 ${k.up?"text-red-600":"text-amber-600"}`}>{k.v} <Icon name="trend" size={13}/></span>
                </div>
              ))}
            </div>
            <ExplainableAICard score={score} factors={factors} confidence={confidence}/>
          </div>
          <div>
            <div className="flex items-center justify-between mb-2">
              <div className="text-sm font-semibold text-slate-700">Distress trend</div>
              <select value={filter} onChange={e=>setFilter(e.target.value)} className="text-xs border border-slate-200 rounded-lg px-2 py-1 text-slate-500">
                <option>30D</option><option>3M</option><option>6M</option><option>Entire Case</option>
              </select>
            </div>
            <DistressLineChart data={caseHistory} weekLabels={weekLabels.slice(-caseHistory.length)} height={190}/>
            <div className="mt-4 space-y-2">
              <button onClick={createFollowup} className="w-full py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold flex items-center justify-center gap-2"><Icon name="phone" size={14}/> Prepare follow-up</button>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={()=>runIntervention("Schedule Counselling")} className="py-2 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 flex items-center justify-center gap-1"><Icon name="calendar" size={13}/> Schedule check-in</button>
                <button onClick={()=>runIntervention("Add Case Note")} className="py-2 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 flex items-center justify-center gap-1"><Icon name="file" size={13}/> Add case note</button>
              </div>
              {liveCase && (
                <button onClick={()=>{setOverrideForm({score,risk_band:risk.label.replace(" Risk",""),note:""}); setOverrideOpen(true);}} className="w-full py-2 rounded-lg border border-amber-200 bg-amber-50 text-xs font-semibold text-amber-800 flex items-center justify-center gap-1"><Icon name="gear" size={13}/> Override AI assessment</button>
              )}
            </div>
            <div className="mt-3 text-xs bg-emerald-50 text-emerald-800 rounded-lg p-3">A timely conversation can change the trajectory. Thank you for being here.</div>
          </div>
        </div>
      )}

      {tab==="notes" && (
        <div>
          {liveCase ? (
            <div className="flex gap-2 mb-4">
              <input value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") submitNote();}} placeholder="Add a case note…" className="flex-1 px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus-ring"/>
              <button disabled={noteSaving} onClick={submitNote} className="px-4 py-2.5 rounded-lg bg-slate-900 text-white text-sm font-semibold disabled:opacity-50">{noteSaving? "Saving…":"Add"}</button>
            </div>
          ) : (
            <div className="text-xs text-slate-400 mb-4">Notes can only be added to a registered case (this demo entry has no backend record).</div>
          )}
          <div className="space-y-3">
            {displayedNotes.length===0 && <div className="text-sm text-slate-400 py-6 text-center">No notes yet for this case.</div>}
            {displayedNotes.map(n=>(
              <div key={n.id} className="p-4 rounded-xl bg-slate-50 border border-slate-100">
                <div className="flex justify-between text-xs text-slate-400 mb-1"><span className="font-semibold text-slate-600">{n.author}</span><span>{relativeTime(n.created_at)}</span></div>
                <div className="text-sm text-slate-600">{n.text}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab==="risk" && (
        <div className="space-y-4 max-w-xl">
          {[
            {label:"Sentiment (text)", value:78, color:"var(--high)"}, {label:"Voice stress", value:70, color:"var(--moderate)"},
            {label:"Engagement decline", value:55, color:"var(--moderate)"}, {label:"Sleep disruption", value:64, color:"var(--moderate)"},
            {label:"Threat / safety signal", value:88, color:"var(--critical)"}, {label:"Court-related stress", value:60, color:"var(--moderate)"},
          ].map((f,i)=>(
            <div key={i}>
              <div className="flex justify-between text-sm mb-1"><span className="text-slate-600 font-medium">{f.label}</span><span className="text-slate-400">{f.value}/100</span></div>
              <div className="h-2 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full" style={{width:f.value+"%", background:f.color}}></div></div>
            </div>
          ))}
        </div>
      )}

      {tab==="interventions" && (
        <div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2.5 mb-6">
            {["Contact Victim","Schedule Counselling","Medical Referral","Notify District Authority","Request Witness Protection","Relocation Support","Financial Assistance","Legal Aid","Rehabilitation Support","Resolve Alert"].map(a=>(
              <button key={a} onClick={()=>runIntervention(a)} className="px-3 py-2.5 rounded-xl border border-slate-200 text-sm font-medium text-slate-600 hover:border-emerald-400 hover:bg-emerald-50 hover:text-emerald-800 transition text-left">{a}</button>
            ))}
          </div>
          <div className="text-sm font-semibold text-slate-700 mb-2">Intervention history</div>
          <div className="space-y-2">
            {displayedInterventions.length===0 && <div className="text-sm text-slate-400 py-6 text-center">No interventions recorded yet for this case.</div>}
            {displayedInterventions.map(i=>(
              <div key={i.id} className="flex items-center justify-between px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-100 text-sm">
                <span className="font-medium text-slate-700">{i.title}</span>
                <span className="flex items-center gap-3"><span className="text-xs text-slate-400">{i.date}</span><StatusPill status={i.status==="Completed"?"Resolved":i.status==="Active"?"In Progress":i.status==="Scheduled"?"Open":"Monitoring"}/></span>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab==="history" && (
        <div className="relative pl-6">
          <div className="absolute left-2 top-1 bottom-1 w-px bg-slate-200"></div>
          {displayedCheckins.length===0 && <div className="text-sm text-slate-400 -ml-4">No recorded activity for this case yet.</div>}
          {displayedCheckins.map(c=>({id:c.id, t:c.summary, d:c.date})).map(e=>(
            <div key={e.id} className="relative mb-5">
              <div className="absolute -left-[22px] top-1 w-2.5 h-2.5 rounded-full bg-emerald-600"></div>
              <div className="text-sm font-semibold text-slate-700">{e.t}</div>
              <div className="text-xs text-slate-400">{e.d}</div>
            </div>
          ))}
        </div>
      )}

      <Modal open={!!modal} onClose={()=>setModal(null)} title={modal||""}>
        <p className="text-sm text-slate-500 mb-5">Confirm this demo action for <span className="font-semibold text-slate-700">{info.name}</span>. This logs the action locally for the case review flow.</p>
        <div className="flex gap-2">
          <button onClick={()=>setModal(null)} className="flex-1 py-2.5 rounded-lg border border-slate-200 text-sm font-semibold text-slate-500">Cancel</button>
          <button onClick={confirmIntervention} className="flex-1 py-2.5 rounded-lg bg-emerald-700 text-white text-sm font-semibold">Confirm</button>
        </div>
      </Modal>

      <Modal open={overrideOpen} onClose={()=>setOverrideOpen(false)} title="Override AI assessment">
        <p className="text-xs text-slate-500 mb-4">Use this when your professional judgement differs from the model's output for <span className="font-semibold text-slate-700">{info.name}</span>. The override is logged with your note for audit.</p>
        <div className="space-y-3">
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1">Distress score (0–100)</label>
            <input type="number" min="0" max="100" value={overrideForm.score} onChange={e=>setOverrideForm(f=>({...f,score:e.target.value}))} className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus-ring"/>
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1">Risk band</label>
            <select value={overrideForm.risk_band} onChange={e=>setOverrideForm(f=>({...f,risk_band:e.target.value}))} className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm">
              {["Stable","Low","Moderate","High","Critical"].map(b=>(<option key={b} value={b}>{b}</option>))}
            </select>
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1">Reason for override</label>
            <textarea value={overrideForm.note} onChange={e=>setOverrideForm(f=>({...f,note:e.target.value}))} rows={3} className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm focus-ring" placeholder="e.g. Spoke with the case in person; situation has stabilized since the last check-in."/>
          </div>
          <button disabled={overrideSaving} onClick={submitOverride} className="w-full py-2.5 rounded-lg bg-amber-600 text-white font-semibold disabled:opacity-50">{overrideSaving? "Saving…":"Save override"}</button>
        </div>
      </Modal>
    </div>
  );
}

function ExplainableAICard({score,factors,confidence}){
  return (
    <div className="rounded-xl border border-slate-200 p-4">
      <div className="flex items-center justify-between mb-1">
        <div className="font-semibold text-sm text-slate-800 flex items-center gap-2"><Icon name="sparkle" size={15}/> Why is this case {riskFromScore(score).label}?</div>
        {confidence!=null && <span className="text-xs font-semibold text-slate-400">Model confidence {confidence}%</span>}
      </div>
      <div className="text-2xl font-bold text-slate-900 mb-3">{score} <span className="text-sm font-normal text-slate-400">/ 100 Dynamic Distress Score</span></div>
      {factors.length>0 ? (
        <div className="space-y-2.5 mb-3">
          {factors.map((f,i)=>(
            <div key={i}>
              <div className="flex justify-between text-xs text-slate-500 mb-1"><span>{f.label}</span><span className="font-medium text-slate-700">{f.val}{f.suffix}</span></div>
              <div className="h-1.5 rounded-full bg-slate-100"><div className="h-full rounded-full bg-blue-700" style={{width:Math.min(f.val,100)+"%"}}></div></div>
            </div>
          ))}
        </div>
      ) : (
        <div className="text-xs text-slate-400 mb-3">No assessment recorded for this case yet — factors will appear after the first check-in or chat message.</div>
      )}
      <div className="text-[11px] text-slate-400 leading-relaxed border-t border-slate-100 pt-2">Factor weights are relative to each other for this specific assessment (from the trained model's feature importances and this case's actual answers), not raw percentages. This highlights contributing signals and does not replace professional judgement.</div>
    </div>
  );
}

function FilterSelect({label,value,onChange,options,display}){
  return (
    <div className="text-xs">
      <div className="text-slate-400 mb-1 font-medium">{label}</div>
      <select value={value} onChange={e=>onChange(e.target.value)} className="border border-slate-200 rounded-lg px-3 py-2 text-slate-700 text-sm bg-white min-w-[130px]">
        {options.map(o=>(<option key={o} value={o}>{display?display[o]:o}</option>))}
      </select>
    </div>
  );
}

function riskColorFor(avg){
  if(avg>=70) return "var(--high)"; if(avg>=50) return "var(--moderate)"; if(avg>=30) return "var(--low)"; return "var(--minimal)";
}

function AbstractMap({level,states,selState,stateObj,onSelectState,onSelectDistrict}){
  const [hover,setHover] = useState(null);
  if(level==="national"){
    const cols = 4;
    return (
      <div>

            return (
              <button key={s.name} onMouseEnter={()=>setHover(s)} onMouseLeave={()=>setHover(null)} onClick={()=>onSelectState(s.name)}
                className="aspect-square rounded-xl flex items-center justify-center text-center p-1.5 text-[10px] font-semibold text-white/95 hover:scale-105 transition"
                style={{background:riskColorFor(avg)}}>
                {s.name}
              </button>
            );
          })}
        </div>
        {hover && <div className="mt-3 text-xs bg-slate-50 rounded-lg p-3 border border-slate-100">
          <div className="font-semibold text-slate-700">{hover.name}</div>
          <div className="text-slate-500">Victims monitored: {hover.districts.reduce((a,d)=>a+d.total,0).toLocaleString()} · High risk: {hover.districts.reduce((a,d)=>a+d.high,0)} · Avg distress: {Math.round(hover.districts.reduce((a,d)=>a+d.avg,0)/hover.districts.length)}</div>
        </div>}
      </div>
    );
  }
  if(level==="state"){
    return (
      <div>
        <div className="grid grid-cols-3 gap-2.5">
          {stateObj.districts.map(d=>(
            <button key={d.name} onMouseEnter={()=>setHover(d)} onMouseLeave={()=>setHover(null)} onClick={()=>onSelectDistrict(d.name)}
              className="rounded-xl p-3 text-left text-white text-xs font-semibold hover:scale-105 transition h-24 flex flex-col justify-between"
              style={{background:riskColorFor(d.avg)}}>
              <span>{d.name}</span>
              <span className="text-[10px] font-normal opacity-90">Avg {d.avg} · {d.high} high risk</span>
            </button>
          ))}
        </div>
        {hover && <div className="mt-3 text-xs bg-slate-50 rounded-lg p-3 border border-slate-100">
          <div className="font-semibold text-slate-700">{hover.name}</div>
          <div className="text-slate-500">Cases: {hover.total} · High risk: {hover.high} · Open alerts: {hover.alerts} · Avg distress: {hover.avg}</div>
        </div>}
      </div>
    );
  }
  // district level: show ward-style breakdown (synthetic)
  const wards = ["Ward A","Ward B","Ward C","Ward D","Ward E","Ward F"];
  return (
    <div className="grid grid-cols-3 gap-2.5">
      {wards.map((w,i)=>(
        <div key={w} className="rounded-xl p-3 text-white text-xs font-semibold h-20 flex items-end" style={{background:riskColorFor(30+i*11)}}>{w}</div>
      ))}
    </div>
  );
}

function AlertsPage(){
  const {dashboardData,updateAlert} = useApp();
  const toast = useToast();
  const [busy,setBusy] = useState(null);
  const casesById = Object.fromEntries((dashboardData.cases||[]).map(c=>[c.id,c]));
  const live = (dashboardData.alerts||[]).map(a=>{
    const c = casesById[a.case_id] || {};
    return {
      id:a.id, real:true, caseId:"Case #"+a.case_id, name:c.name, district:c.district||"—", score:c.score ?? "—",
      reason:(a.reason||"").split("; ").filter(Boolean), severity:a.severity, status:a.status, assignedTo:a.assigned_to,
    };
  });
  const seeded = [
    {id:"s1", real:false, caseId:"DW-2026-0142", district:"South Delhi", score:86, reason:["Threat reported","Negative sentiment spike","Voice stress elevated"], severity:"Critical", status:"Unresolved"},
    {id:"s2", real:false, caseId:"DW-2026-0098", district:"Pune", score:74, reason:["Missed two check-ins","Sentiment decline"], severity:"High", status:"Unresolved"},
    {id:"s3", real:false, caseId:"DW-2026-0071", district:"Lucknow", score:66, reason:["Sleep disruption","Court hearing upcoming"], severity:"Moderate", status:"Unresolved"},
  ];
  const all = [...live, ...seeded];

  async function act(alertId, patch, label){
    setBusy(alertId);
    try { await updateAlert(alertId, patch); toast(label,"success"); }
    catch { toast("Could not update the alert. Please try again.","error"); }
    finally { setBusy(null); }
  }

  return (
    <div className="fade-in max-w-4xl">
      <h1 className="text-2xl font-bold text-slate-900 mb-1">Alerts</h1>
      <p className="text-slate-500 mb-6">Real-time escalation alerts across all monitored cases.</p>
      <div className="space-y-4">
        {all.length===0 && <div className="text-sm text-slate-400 py-8 text-center">No alerts right now.</div>}
        {all.map(a=>(
          <div key={a.id} className="bg-white rounded-2xl border-l-4 p-5" style={{borderColor: a.severity==="Critical"?"var(--critical)":a.severity==="High"?"var(--high)":"var(--moderate)"}}>
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-2 font-bold text-sm" style={{color: a.severity==="Critical"?"var(--critical)":a.severity==="High"?"var(--high)":"var(--moderate)"}}>
                <Icon name="alert" size={16}/> {a.severity.toUpperCase()} {a.severity==="Critical" && "ESCALATION"}
              </div>
              <StatusPill status={a.status==="Unresolved"?"Open":a.status}/>
            </div>
            <div className="text-sm text-slate-700 font-semibold mb-1">{a.caseId}{a.name? " · "+a.name : ""} · {a.district}</div>
            <div className="text-sm text-slate-500 mb-2">Distress score: <span className="font-semibold text-slate-700">{a.score} / 100</span></div>
            {a.assignedTo && <div className="text-xs text-slate-500 mb-2">Assigned to <span className="font-semibold text-slate-700">{a.assignedTo}</span></div>}
            <ul className="text-xs text-slate-500 list-disc list-inside mb-3">{a.reason.map((r,i)=>(<li key={i}>{r}</li>))}</ul>
            <div className="flex gap-2 flex-wrap">
              {a.real ? (
                <>
                  <button disabled={busy===a.id || a.status==="Resolved"} onClick={()=>act(a.id,{status:"Resolved"},"Alert marked resolved.")} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-700 text-white disabled:opacity-40">Mark Resolved</button>
                  <button disabled={busy===a.id || a.status==="In Progress"} onClick={()=>act(a.id,{status:"In Progress"},"Alert marked in progress.")} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white disabled:opacity-40">In Progress</button>
                  <button disabled={busy===a.id} onClick={()=>act(a.id,{assigned_to:"Dr. Meera Sharma"},"Counsellor assigned.")} className="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-200 text-slate-600 disabled:opacity-40">Assign Counsellor</button>
                </>
              ) : (
                <>
                  <button onClick={()=>toast("Opening case detail…")} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white">View Case</button>
                  <button onClick={()=>toast("Counsellor assigned.","success")} className="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-200 text-slate-600">Assign Counsellor</button>
                  <button onClick={()=>toast("District authority notified.","success")} className="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-200 text-slate-600">Notify District Authority</button>
                </>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function LiveDatabasePage(){
  const [db,setDb] = useState(null);
  const [selected,setSelected] = useState("cases");
  const [loading,setLoading] = useState(false);
  const toast = useToast();

  async function load(){
    setLoading(true);
    try {
      const data = await api("/api/db");
      setDb(data);
      if(!data.tables[selected]) setSelected(Object.keys(data.tables)[0] || "cases");
    } catch {
      toast("Could not load database view.","error");
    } finally {
      setLoading(false);
    }
  }

  useEffect(()=>{ load(); },[]);
  const tables = db?.tables || {};
  const names = Object.keys(tables);
  const current = tables[selected] || {columns:[], rows:[], count:0};
  const cell = value => {
    const text = typeof value === "string" ? value : JSON.stringify(value);
    return text && text.length > 120 ? text.slice(0,117)+"..." : (text ?? "");
  };

  return (
    <div className="fade-in">
      <div className="flex items-start justify-between gap-4 mb-5">
        <div>
          <h1 className="text-2xl font-bold text-slate-900 mb-1">Live Database</h1>
          <p className="text-slate-500 text-sm">Read-only MySQL view for demo verification. Latest 50 rows per table are shown.</p>
        </div>
        <button onClick={load} disabled={loading} className="px-3 py-2 rounded-lg bg-slate-900 text-white text-xs font-semibold disabled:opacity-50">{loading?"Refreshing...":"Refresh"}</button>
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        {names.map(name=>(
          <button key={name} onClick={()=>setSelected(name)} className={`px-3 py-2 rounded-lg text-xs font-semibold border ${selected===name?"bg-blue-50 border-blue-200 text-blue-800":"bg-white border-slate-200 text-slate-500"}`}>
            {name} <span className="ml-1 text-slate-400">{tables[name].count}</span>
          </button>
        ))}
      </div>
      <div className="bg-white rounded-2xl border border-slate-200 p-5 overflow-x-auto">
        <div className="font-semibold text-slate-800 mb-3">{selected} table</div>
        <table className="w-full text-xs min-w-[760px]">
          <thead>
            <tr className="text-left text-slate-400 border-b border-slate-100">
              {current.columns.map(col=><th key={col} className="pb-2.5 pr-4 font-medium">{col}</th>)}
            </tr>
          </thead>
          <tbody>
            {current.rows.map((row,i)=>(
              <tr key={row.id ?? row.token ?? i} className="border-b border-slate-50 align-top">
                {current.columns.map(col=><td key={col} className="py-2.5 pr-4 text-slate-600 max-w-[260px]">{cell(row[col])}</td>)}
              </tr>
            ))}
            {current.rows.length===0 && <tr><td className="py-8 text-center text-slate-400" colSpan={Math.max(current.columns.length,1)}>No rows yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

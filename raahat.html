<!DOCTYPE html>
<html lang="en">

<style>
  :root{
    --v-bg:#FAF6EF; --v-card:#FFFFFF; --v-green:#6E8F71; --v-green-d:#4F6E53; --v-terracotta:#C1694F; --v-blue:#7FA0C2; --v-ink:#33342E;
    --navy:#152238; --navy-2:#1B2A45; --admin-blue:#1E4B8F; --teal:#2C8C82; --slate:#5B6474;
    --critical:#B91C1C; --high:#DC2626; --moderate:#EA8C1E; --low:#D4B106; --minimal:#1F9254; --stable:#1F9254;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; background:#F3F5F8; color:#1c2431; -webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d7dce3;border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .focus-ring:focus-visible{outline:2px solid #2C8C82; outline-offset:2px;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .fade-in{animation:fadeIn .28s ease-out both;}
  @keyframes pulseBeat{0%,100%{transform:scale(1);}15%{transform:scale(1.25);}30%{transform:scale(1);}}
  .pulse-beat{animation:pulseBeat 1s ease-in-out infinite; transform-origin:center; color:#C1694F;}
  @keyframes popIn{from{opacity:0; transform:scale(.96) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}
  .pop-in{animation:popIn .22s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(220,38,38,.45);}70%{box-shadow:0 0 0 10px rgba(220,38,38,0);}100%{box-shadow:0 0 0 0 rgba(220,38,38,0);}}
  .pulse{animation:pulse-ring 2s infinite;}
  @keyframes wave{0%,100%{transform:scaleY(.3);}50%{transform:scaleY(1);}}
  .wave-bar{animation:wave .9s ease-in-out infinite;}
  .slide-in-right{animation:slideInRight .28s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes slideInRight{from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);}}
  .chip-row{display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none; -ms-overflow-style:none;
    padding-right:14px; -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent); mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{scroll-snap-align:start; flex:0 0 auto; white-space:nowrap; font-size:12.5px; line-height:1; padding:8px 13px; border-radius:999px;
    border:1px solid rgba(110,143,113,.22); background:rgba(110,143,113,.07); color:var(--v-green-d); font-weight:500;
    transition:background .15s ease, border-color .15s ease, transform .12s ease;}
  .chip:hover:not(:disabled){background:rgba(110,143,113,.15); border-color:rgba(110,143,113,.4);}
  .chip:active:not(:disabled){transform:scale(.96);}
  .chip:disabled{opacity:.45;}
  .toast-in{animation:toastIn .25s ease-out both;}
  @keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Landing page ---------- */
  .lp{--cream:#FBF7F1; --forest:#2F5D50; --sage:#6E8F71; --ink:#22302A; --muted:#5B6862; --lav:#BDB2EA; --peach:#F6C6A6; --sky:#A9CDEB; --coral:#E08A74; --mood:#A8D5B0;
    /* clip, not hidden: overflow-x:hidden makes this a scroll container and breaks the sticky nav. */
    background:var(--cream); color:var(--ink); overflow-x:hidden; overflow-x:clip; position:relative;
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;}
  .lp-progress{position:fixed; top:0; left:0; right:0; height:3px; transform-origin:0 50%; transform:scaleX(0); z-index:70;
    background:linear-gradient(90deg,var(--sage),var(--lav),var(--peach));}
  .lp-aurora{position:absolute; left:-10%; right:-10%; top:-120px; height:980px; pointer-events:none; z-index:0; filter:blur(70px); opacity:.7;}
  .lp-aurora span{position:absolute; border-radius:50%; animation:lpDrift 18s ease-in-out infinite alternate;}
  .lp-aurora .a1{width:560px; height:560px; left:2%; top:12%; background:var(--mood); transition:background-color 1.2s ease;}
  .lp-aurora .a2{width:480px; height:480px; right:6%; top:0; background:var(--lav); animation-delay:-6s;}
  .lp-aurora .a3{width:400px; height:400px; left:42%; top:38%; background:var(--peach); opacity:.75; animation-delay:-12s;}
  @keyframes lpDrift{0%{transform:translate(0,0) scale(1);} 50%{transform:translate(50px,-30px) scale(1.08);} 100%{transform:translate(-30px,40px) scale(.94);}}
  .lp-glass{background:rgba(255,255,255,.62); -webkit-backdrop-filter:blur(16px) saturate(1.4); backdrop-filter:blur(16px) saturate(1.4); border:1px solid rgba(255,255,255,.75);}
  .lp-nav{transition:box-shadow .3s ease, background-color .3s ease;}
  .lp-nav.is-scrolled{box-shadow:0 10px 30px -18px rgba(34,48,42,.35); background:rgba(251,247,241,.82);}
  .lp-link{position:relative; color:var(--muted); transition:color .2s;}
  .lp-link::after{content:""; position:absolute; left:0; right:0; bottom:-4px; height:2px; border-radius:2px; background:var(--sage); transform:scaleX(0); transition:transform .25s ease;}
  .lp-link:hover{color:var(--ink);} .lp-link:hover::after{transform:scaleX(1);}
  .lp-reveal{opacity:0; transform:translateY(28px); transition:opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); transition-delay:var(--d,0ms);}
  .lp-reveal.is-in{opacity:1; transform:none;}
  .lp-grad{background:linear-gradient(100deg,#2F5D50 0%,#6E8F71 30%,#8C7BD6 65%,#D98B6A 100%); background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent; animation:lpShine 9s linear infinite;}
  @keyframes lpShine{to{background-position:200% center;}}
  .lp-eyebrow{display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--sage);}
  .lp-eyebrow::before{content:""; width:18px; height:2px; border-radius:2px; background:currentColor;}
  .lp-btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; font-weight:700; transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease;}
  .lp-btn:active{transform:scale(.97);}
  .lp-btn-primary{position:relative; overflow:hidden; background:var(--forest); color:#fff; box-shadow:0 12px 30px -12px rgba(47,93,80,.7);}
  .lp-btn-primary:hover{transform:translateY(-2px); box-shadow:0 18px 38px -14px rgba(47,93,80,.8);}
  .lp-btn-primary::after{content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%); transform:translateX(-100%); animation:lpSheen 4s ease-in-out infinite;}
  @keyframes lpSheen{55%,100%{transform:translateX(100%);}}
  .lp-btn-ghost{background:rgba(255,255,255,.72); border:1px solid rgba(34,48,42,.12); color:var(--ink);}
  .lp-btn-ghost:hover{background:#fff; transform:translateY(-2px); box-shadow:0 12px 26px -16px rgba(34,48,42,.4);}
  .lp-focus:focus-visible{outline:3px solid #8C7BD6; outline-offset:3px;}

  /* Saathi, the companion */
  .lp-companion{position:relative; width:min(360px,74vw); aspect-ratio:1/1; margin:0 auto;}
  .lp-ring{position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--mood); opacity:0; animation:lpRipple 6s ease-out infinite; transition:border-color 1s ease;}
  .lp-ring:nth-child(2){animation-delay:2s;} .lp-ring:nth-child(3){animation-delay:4s;}
  @keyframes lpRipple{0%{transform:scale(.62); opacity:.6;} 100%{transform:scale(1.22); opacity:0;}}
  .lp-blob{position:absolute; inset:15%; background-color:var(--mood);
    background-image:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95),rgba(255,255,255,0) 46%),radial-gradient(circle at 75% 85%,rgba(47,93,80,.18),rgba(47,93,80,0) 55%);
    border-radius:42% 58% 55% 45% / 48% 42% 58% 52%; box-shadow:0 36px 70px -26px rgba(47,93,80,.55), inset 0 -10px 30px rgba(255,255,255,.3);
    animation:lpMorph 10s ease-in-out infinite, lpBreathe 6s ease-in-out infinite; transition:background-color 1s ease;}
  @keyframes lpMorph{0%,100%{border-radius:42% 58% 55% 45% / 48% 42% 58% 52%;} 33%{border-radius:55% 45% 42% 58% / 55% 58% 42% 45%;} 66%{border-radius:48% 52% 60% 40% / 42% 55% 45% 58%;}}
  @keyframes lpBreathe{0%,100%{transform:scale(.96);} 50%{transform:scale(1.04);}}
  .lp-face{position:absolute; inset:0; width:100%; height:100%;}
  .lp-eyes{transition:transform .25s ease-out;}
  .lp-eye{transform-box:fill-box; transform-origin:center; animation:lpBlink 5.5s infinite;}
  @keyframes lpBlink{0%,93%,100%{transform:scaleY(1);} 96%{transform:scaleY(.12);}}
  .lp-mouth{transition:d .6s ease;}
  .lp-float{animation:lpFloat 6s ease-in-out infinite;}
  @keyframes lpFloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);}}
  .lp-mood{transition:transform .25s cubic-bezier(.2,.8,.2,1), background-color .25s, box-shadow .25s;}
  .lp-mood:hover{transform:translateY(-3px);}
  .lp-mood[aria-pressed="true"]{transform:translateY(-4px) scale(1.06); background:#fff; box-shadow:0 12px 24px -14px rgba(34,48,42,.5);}
  .lp-swap{animation:fadeIn .45s ease-out both;}

  .lp-card{position:relative; overflow:hidden; background:rgba(255,255,255,.78); border:1px solid rgba(34,48,42,.08); border-radius:28px;
    transition:transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .4s ease;}
  .lp-card:hover{transform:translateY(-6px); box-shadow:0 28px 56px -30px rgba(47,93,80,.45);}
  .lp-card::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .3s;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(189,178,234,.32),transparent 42%);}
  .lp-card:hover::before{opacity:1;}


  .lp-line{stroke-dasharray:1400; stroke-dashoffset:1400; transition:stroke-dashoffset 2.8s cubic-bezier(.4,0,.2,1);}
  .lp-line.l2{transition-delay:.5s;}
  .is-in .lp-line{stroke-dashoffset:0;}
  .lp-dot{opacity:0; transform:scale(0); transform-box:fill-box; transform-origin:center; transition:opacity .5s ease, transform .5s cubic-bezier(.3,1.6,.5,1); transition-delay:var(--d,0ms);}
  .is-in .lp-dot{opacity:1; transform:scale(1);}
  .lp-ping{transform-box:fill-box; transform-origin:center; opacity:0;}
  .is-in .lp-ping{animation:lpPing 2.4s ease-out infinite; animation-delay:var(--d,0ms);}
  @keyframes lpPing{0%{transform:scale(1); opacity:.55;} 100%{transform:scale(3); opacity:0;}}
  .lp-connector{transform:scaleX(0); transform-origin:0 50%; transition:transform 1.6s cubic-bezier(.4,0,.2,1) .2s;}
  .is-in .lp-connector{transform:scaleX(1);}
  .lp-step-num{transition:transform .5s cubic-bezier(.3,1.6,.5,1), background-color .4s; transition-delay:var(--d,0ms); transform:scale(.4);}
  .is-in .lp-step-num{transform:scale(1);}

  .lp-gauge-arc{transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1), stroke .6s ease;}
  .lp-needle{transform-origin:100px 100px; transition:transform 1.3s cubic-bezier(.2,.8,.2,1);}
  .lp-breath{transition-property:transform; transition-timing-function:ease-in-out;}
  .lp-bar{transform-origin:bottom; animation:lpBar 2.8s ease-in-out infinite alternate;}
  @keyframes lpBar{from{transform:scaleY(.45);} to{transform:scaleY(1);}}

  /* Participant app: Saathi, inner weather, garden, jar, confetti */
  .v-saathi{animation:lpBreathe 6s ease-in-out infinite, lpFloat 7s ease-in-out infinite; filter:drop-shadow(0 10px 16px rgba(47,93,80,.22));}
  .v-mood{transition:transform .2s cubic-bezier(.2,.8,.2,1);} .v-mood:hover{transform:translateY(-2px);} .v-mood[aria-pressed="true"]{transform:translateY(-3px) scale(1.04);}
  .v-sun.v-anim{animation:vSpin 30s linear infinite;} @keyframes vSpin{to{transform:rotate(360deg);}}
  .v-drift.v-anim{animation:vDrift 7s ease-in-out infinite alternate;} .v-drift2.v-anim{animation:vDrift 9s ease-in-out infinite alternate-reverse;}
  @keyframes vDrift{from{translate:-3px 0;} to{translate:4px 0;}}
  .v-drop.v-anim{animation:vDrop 1.1s linear infinite;} @keyframes vDrop{0%{opacity:0; translate:0 -6px;} 30%{opacity:1;} 100%{opacity:0; translate:-3px 10px;}}
  .v-flash.v-anim{animation:vFlash 4s ease-in-out infinite;} @keyframes vFlash{0%,86%,100%{opacity:0;} 88%,92%{opacity:1;}}
  .v-grow{transform-origin:bottom center; animation:vGrow .9s cubic-bezier(.3,1.4,.5,1) both;} @keyframes vGrow{from{transform:scaleY(0); opacity:0;} to{transform:none; opacity:1;}}
  .v-star{animation:vTwinkle 3s ease-in-out infinite;} @keyframes vTwinkle{0%,100%{opacity:.75;} 50%{opacity:1;}}
  .v-jar-shine{animation:vShine .9s ease;} @keyframes vShine{30%{transform:scale(1.06) rotate(-3deg); filter:drop-shadow(0 0 10px #F7C65A);} 100%{transform:none;}}
  .v-confetti{position:absolute; top:-12px; border-radius:2px; animation:vFall 1.6s ease-in both;}
  @keyframes vFall{to{translate:0 260px; rotate:540deg; opacity:0;}}
  .v-eq{animation:vEq .9s ease-in-out infinite alternate; transform-origin:bottom;} @keyframes vEq{from{transform:scaleY(.35);} to{transform:scaleY(1);}}
  @media (prefers-reduced-motion: reduce){
    .v-saathi,.v-anim,.v-grow,.v-star,.v-jar-shine,.v-eq{animation:none !important;}
  }

  /* Login mascot (covers its eyes while a password is typed) */
  .rh-bob{transform-box:fill-box; transform-origin:center; animation:rhBob var(--t,7s) ease-in-out infinite; animation-delay:var(--d,0s);}
  @keyframes rhBob{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-14px) rotate(var(--r,3deg));}}
  .rh-petspin{transform-origin:250px 320px; animation:rhSpin 120s linear infinite;}
  @keyframes rhSpin{to{transform:rotate(360deg);}}
  .rh-mascot{transform-box:fill-box; transform-origin:center; animation:rhMascot 4.5s ease-in-out infinite;}
  @keyframes rhMascot{0%,100%{transform:scale(1);} 50%{transform:scale(1.035);}}
  .rh-blink{transform-box:fill-box; transform-origin:center; animation:rhBlink 5.5s infinite;}
  @keyframes rhBlink{0%,93%,100%{transform:scaleY(1);} 96%{transform:scaleY(.08);}}
  .rh-twinkle{transform-box:fill-box; transform-origin:center; animation:rhTw 3.2s ease-in-out infinite; animation-delay:var(--d,0s);}
  @keyframes rhTw{0%,100%{opacity:.15; transform:scale(.6);} 50%{opacity:1; transform:scale(1.1);}}
  .rh-caption{animation:rhCap .5s ease both;}
  @keyframes rhCap{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .rh-tabs-ind{transition:transform .35s cubic-bezier(.3,.9,.3,1), background-color .35s;}
  .rh-card-in{animation:rhCardIn .7s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes rhCardIn{from{opacity:0; transform:translateY(28px) scale(.97);} to{opacity:1; transform:none;}}
  .lg-input{width:100%; padding:.8rem 1rem; border-radius:.9rem; font-size:.95rem; color:var(--ink);
    background:rgba(255,255,255,.85); border:1px solid rgba(34,48,42,.14); transition:border-color .2s, box-shadow .2s;}
  .lg-input::placeholder{color:rgba(34,48,42,.35);}
  .lg-input:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 4px rgba(140,123,214,.18);}

  @media (prefers-reduced-motion: reduce){
    .lp *, .lp *::before, .lp *::after{animation:none !important; transition:none !important;}
    .lp-reveal{opacity:1; transform:none;}
    .pulse-beat{animation:none;}
  }
</style>
</head>

function riskFromScore(score){
  if(score<=25) return {label:"Stable", color:"var(--stable)", bg:"#E7F5EC", text:"#166A3D"};
  if(score<=50) return {label:"Low Risk", color:"var(--low)", bg:"#FBF3D6", text:"#8A6D06"};
  if(score<=70) return {label:"Moderate Risk", color:"var(--moderate)", bg:"#FCEBD6", text:"#9A5A0D"};
  if(score<=85) return {label:"High Risk", color:"var(--high)", bg:"#FBDEDE", text:"#A11616"};
  return {label:"Critical", color:"var(--critical)", bg:"#F7D2D2", text:"#7F0F0F"};
}
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function fmtDate(d){ return d; }
// Session token lives only in memory (not localStorage) — a real login is required each time the
// page loads, which is the point: unlike the old fake login, a stale/no session genuinely can't act.
let AUTH_TOKEN = null;
// Set by AppRoot so the api() helper can end the session centrally when the server says the
// token is gone, instead of every call site silently failing on its own.
let ON_SESSION_EXPIRED = null;

async function api(path, body, method){
  const headers = {"Content-Type":"application/json"};
  if(AUTH_TOKEN) headers.Authorization = "Bearer "+AUTH_TOKEN;
  const opts = {method: method || (body? "POST":"GET"), headers};
  if(body) opts.body = JSON.stringify(body);
  let response;
  try {
    response = await fetch(path, opts);
  } catch {
    const offline = new Error("Could not reach the server. Check your connection and try again.");
    offline.status = 0;
    throw offline;
  }
  if(!response.ok){
    // FastAPI reports the reason in {"detail": ...}; surfacing it means the UI can say
    // "Too many requests, wait 41s" instead of a generic "Request failed".
    let detail = "";
    try {
      const parsed = await response.json();
      detail = typeof parsed?.detail === "string" ? parsed.detail
        : Array.isArray(parsed?.detail) ? (parsed.detail[0]?.msg || "") : "";
    } catch {}
    const err = new Error(detail || `Request failed (${response.status})`);
    err.status = response.status;
    err.detail = detail;
    // 401 means the bearer token is expired or revoked: every subsequent call would fail the
    // same way, so end the session once and send the user back to sign in.
    if(response.status === 401 && AUTH_TOKEN && ON_SESSION_EXPIRED) ON_SESSION_EXPIRED();
    throw err;
  }
  return response.json();
}
async function exportReport(caseId){
  const headers = AUTH_TOKEN? {Authorization:"Bearer "+AUTH_TOKEN} : {};
  const response = await fetch(`/api/cases/${caseId}/report`, {headers});
  if(!response.ok) return;
  const text = await response.text();
  const blob = new Blob([text], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `raahat-case-${caseId}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function shortRisk(band, score){
  if(band==="Critical" || band==="High" || score>=71) return "High";
  if(band==="Moderate" || score>=51) return "Moderate";
  return "Low";
}
function relativeTime(value){
  if(!value) return "Live";
  const diff = Date.now() - new Date(value).getTime();
  if(diff < 90_000) return "now";
  if(diff < 3_600_000) return Math.round(diff/60_000)+"m ago";
  if(diff < 86_400_000) return Math.round(diff/3_600_000)+"h ago";
  return Math.round(diff/86_400_000)+"d ago";
}
function backendCaseRow(c){
  // Age/gender are not columns in the backend schema, so they read as unknown rather than
  // being invented for one particular case id.
  return {id:c.id, age:c.age ?? "—", gender:c.gender ?? "—", district:c.district, risk:shortRisk(c.risk_band,c.score), score:c.score, concern:c.risk_band+" distress assessment", updated:relativeTime(c.updated_at), status:c.risk_band==="Critical"?"Open":"Monitoring"};
}

function ChartEmptyState({height, label}){
  return (
    <div className="flex items-center justify-center text-xs text-black/35 border border-dashed border-black/10 rounded-xl"

function DistressLineChart({data, width=640, height=230, showZones=true, weekLabels}){
  if(!data || data.length < 2) return <ChartEmptyState height={height} label="No recorded check-ins yet — the trend appears after the first check-in."/>;
  const pad = {l:34,r:14,t:14,b:26};
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const max=100, min=0;
  const pts = data.map((v,i)=>{
    const x = pad.l + (i/(data.length-1))*w;
    const y = pad.t + h - ((v-min)/(max-min))*h;
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?`M ${p[0]},${p[1]}`:`L ${p[0]},${p[1]}`)).join(" ");
  const areaPath = path + ` L ${pts[pts.length-1][0]},${pad.t+h} L ${pts[0][0]},${pad.t+h} Z`;
  const zones = [
    {from:86,to:100,color:"#FBE1E1"},{from:71,to:86,color:"#FCE7DA"},{from:51,to:71,color:"#FEF1D6"},
    {from:26,to:51,color:"#FBF7DE"},{from:0,to:26,color:"#E9F6ED"},
  ];
  const yOf = v => pad.t + h - ((v-min)/(max-min))*h;
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} className="overflow-visible">
      {showZones && zones.map((z,i)=>(
        <rect key={i} x={pad.l} y={yOf(z.to)} width={w} height={yOf(z.from)-yOf(z.to)} fill={z.color} />
      ))}
      {[0,25,50,75,100].map(v=>(
        <g key={v}>
          <line x1={pad.l} x2={pad.l+w} y1={yOf(v)} y2={yOf(v)} stroke="#E4E8EE" strokeWidth="1"/>
          <text x={pad.l-8} y={yOf(v)+3} fontSize="9.5" textAnchor="end" fill="#8A93A3">{v}</text>
        </g>
      ))}
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#1E4B8F" stopOpacity="0.18"/>
          <stop offset="100%" stopColor="#1E4B8F" stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={areaPath} fill="url(#areaGrad)"/>
      <path d={path} fill="none" stroke="#1E4B8F" strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=>(
        <circle key={i} cx={p[0]} cy={p[1]} r={i===pts.length-1?4.5:2.6} fill={i===pts.length-1?"#DC2626":"#1E4B8F"} stroke="#fff" strokeWidth={i===pts.length-1?2:1}/>
      ))}
      {weekLabels && weekLabels.map((lb,i)=>(
        <text key={i} x={pts[i][0]} y={height-6} fontSize="9.5" textAnchor="middle" fill="#8A93A3">{lb}</text>
      ))}
    </svg>
  );
}

function BarChartSimple({data, width=360, height=200, barColor}){
  if(!data || !data.length) return <ChartEmptyState height={height} label="No data yet."/>;
  const pad={l:28,r:10,t:14,b:22};
  const w=width-pad.l-pad.r, h=height-pad.t-pad.b;
  const max = Math.max(...data.map(d=>d.value))*1.15;
  const bw = w/data.length*0.55;
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`}>
      {[0,0.5,1].map((f,i)=>(
        <line key={i} x1={pad.l} x2={pad.l+w} y1={pad.t+h*(1-f)} y2={pad.t+h*(1-f)} stroke="#EEF1F5" />
      ))}
      {data.map((d,i)=>{
        const bh = (d.value/max)*h;
        const cx = pad.l + (i+0.5)*(w/data.length);
        return (
          <g key={i}>
            <rect x={cx-bw/2} y={pad.t+h-bh} width={bw} height={bh} rx="4" fill={d.color||barColor}/>
            <text x={cx} y={pad.t+h-bh-6} fontSize="11" fontWeight="700" textAnchor="middle" fill="#374151">{d.value}</text>
            <text x={cx} y={height-5} fontSize="10" textAnchor="middle" fill="#8A93A3">{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function Modal({open,onClose,title,children,width="max-w-md"}){
  const panelRef = useRef(null);
  const titleId = useRef("modal-"+Math.random().toString(36).slice(2,9)).current;
  // Keyboard and screen-reader basics: Escape closes, focus moves into the dialog on open and
  // returns to whatever opened it on close, and the dialog announces itself with its title.
  useEffect(()=>{
    if(!open) return;
    const previouslyFocused = document.activeElement;
    const onKey = e => { if(e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    const focusTarget = panelRef.current?.querySelector("input,textarea,select,button");
    focusTarget?.focus();
    return ()=>{
      document.removeEventListener("keydown", onKey);
      if(previouslyFocused instanceof HTMLElement) previouslyFocused.focus();
    };
  },[open,onClose]);
  if(!open) return null;
  return (
    <div className="fixed inset-0 z-[150] flex items-center justify-center p-4" style={{background:"rgba(15,20,30,.45)"}} onMouseDown={onClose}>
      <div ref={panelRef} role="dialog" aria-modal="true" aria-labelledby={titleId}
           className={`bg-white rounded-2xl shadow-2xl w-full ${width} pop-in`} onMouseDown={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h3 id={titleId} className="font-semibold text-slate-800">{title}</h3>
          <button onClick={onClose} aria-label="Close dialog" className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 focus-ring"><Icon name="x" size={18}/></button>
        </div>
        <div className="p-6">{children}</div>
      </div>
    </div>
  );
}

const AppCtx = createContext(null);
function useApp(){ return useContext(AppCtx); }

function AppRoot(){
  const [screen,setScreen] = useState("landing"); // landing | login | victim | counsellor | admin
  const [loginRole,setLoginRole] = useState("victim");
  const [session,setSession] = useState(null); // {role, name, case_id} once logged in

  const [distressScore,setDistressScore] = useState(0);
  const weekLabels = ["Wk 1","Wk 2","Wk 3","Wk 4","Wk 5","Wk 6"];
  const [alerts,setAlerts] = useState([]);
  // Start empty: these used to hold fictional entries that stayed on screen whenever the
  // backend had nothing for a case, so a brand-new case appeared to have history.
  const [interventionLog,setInterventionLog] = useState([]);
  const [checkins,setCheckins] = useState([]);
  // notes and per-case history live entirely in dashboardData (backend-persisted), refreshed on every action —
  // no local accumulator, so a page reload shows exactly what the server has, not a stale client-side guess.
  const [dashboardData,setDashboardData] = useState({cases:[],alerts:[],events:[],interventions:[],notes:[],metrics:null});
  const [dataError,setDataError] = useState(null);

  // `activeSession` lets a caller pass the session it just received from /api/auth/login:
  // setSession() has not been applied to state yet at that point, so reading `session` here
  // would still be the previous (or null) one.
  async function refreshDashboard(activeSession){
    if(!AUTH_TOKEN) return;
    const active = activeSession || session;
    try {
      const data = await api("/api/me");
      setDashboardData(data);
      const ownCase = active?.case_id
        ? (data.cases||[]).find(c=>c.id===active.case_id)
        : null;
      if(ownCase) setDistressScore(ownCase.score);
      const byCase = Object.fromEntries((data.cases||[]).map(c=>[c.id,c]));
      setAlerts((data.alerts||[]).map(a=>({
        id:"db-"+a.id, caseId:a.case_id, name:(byCase[a.case_id]||{}).name||"Case #"+a.case_id,
        // Unknown district/score render as "—" rather than borrowing a plausible-looking value
        // from the seeded demo case.
        district:(byCase[a.case_id]||{}).district ?? "—", score:(byCase[a.case_id]||{}).score ?? "—",
        reason:a.reason, severity:a.severity, status:a.status
      })));
      // Assign unconditionally: guarding on .length meant an empty server response left the
      // previous (or seeded) client-side list on screen.
      setCheckins((data.events||[]).map(e=>({id:"event-"+e.id,date:relativeTime(e.created_at),summary:`${e.kind}: ${e.content.slice(0,90)}`,caseId:e.case_id})));
      setInterventionLog((data.interventions||[]).map(i=>({id:"int-"+i.id,title:i.title,status:i.status,date:relativeTime(i.created_at),forCase:i.case_id})));
      setDataError(null);
    } catch(err) {
      // Swallowing this used to leave the last-known numbers on screen with no indication that
      // they had stopped updating — the worst possible failure mode for a risk dashboard.
      if(err.status !== 401) setDataError(err.message || "Could not refresh data from the server.");
    }
  }

  async function createCase(payload){
    const created = await api("/api/cases", payload);
    await refreshDashboard();
    return created;
  }
  async function updateAlert(alertId, patch){
    await api(`/api/alerts/${alertId}`, patch, "PATCH");
    await refreshDashboard();
  }
  async function addNote(caseId, text, author, share=false){
    await api(`/api/cases/${caseId}/notes`, {text, author: author || "Care team", share});
    await refreshDashboard();
  }

  function bumpDistress(delta){
    setDistressScore(prev=>clamp(prev+delta, 0, 100));
  }
  function addAlert(a){
    setAlerts(prev=>[{id:Date.now(), status:"Unresolved", ...a}, ...prev]);
  }
  function applyAssessment(assessment){
    setDistressScore(assessment.score);
    if(["High","Critical"].includes(assessment.risk_band) && session?.case_id){
      addAlert({caseId:session.case_id, name:session.name, reason:assessment.explanations.join("; "), severity:assessment.risk_band});
    }
    refreshDashboard();
  }

  async function login(email, password){
    const result = await api("/api/auth/login", {email, password});
    AUTH_TOKEN = result.token;
    setSession(result);
    setLoginRole(result.role);
    setScreen(result.role);
    refreshDashboard(result);
    return result;
  }
  const DEMO_CREDENTIALS = {
    victim:{email:"victim@demo.in", password:"demo123"},
    counsellor:{email:"counsellor@demo.in", password:"demo123"},
    admin:{email:"admin@demo.in", password:"demo123"},
  };
  async function quickSwitch(role){
    const creds = DEMO_CREDENTIALS[role];
    return login(creds.email, creds.password);
  }
  function logout(){
    AUTH_TOKEN = null;
    setSession(null);
    setDashboardData({cases:[],alerts:[],events:[],interventions:[],notes:[],metrics:null});
    setDataError(null);
    setDistressScore(0);
    setCheckins([]);
    setInterventionLog([]);
    setAlerts([]);
    setScreen("landing");
  }

  // A 401 from any call means the session is gone; drop the user at the login screen once
  // rather than letting every screen fail silently in place.
  useEffect(()=>{
    ON_SESSION_EXPIRED = () => {
      AUTH_TOKEN = null;
      setSession(null);
      setDashboardData({cases:[],alerts:[],events:[],interventions:[],notes:[],metrics:null});
      setDataError("Your session expired. Please sign in again.");
      setScreen("login");
    };
    return ()=>{ ON_SESSION_EXPIRED = null; };
  },[]);

  // A new screen starts at the top, not at the scroll position the previous one was left at.
  useEffect(()=>{ window.scrollTo(0,0); },[screen]);

  // Every victim-facing screen reads the case from the session instead of assuming the
  // seeded demo case: signing in as a different participant now shows that participant's data.
  const caseId = session?.case_id || null;
  const ctxValue = {
    screen,setScreen, loginRole,setLoginRole, login, quickSwitch, logout, session, caseId,
    distressScore, weekLabels, bumpDistress, applyAssessment,
    alerts, addAlert, setAlerts,
    dashboardData, refreshDashboard, createCase, updateAlert, addNote, dataError, setDataError,
    interventionLog, setInterventionLog,
    checkins, setCheckins,
  };

  return (
    <ToastProvider>
      <AppCtx.Provider value={ctxValue}>
        {screen==="landing" && <LandingPage/>}
        {screen==="login" && <LoginPage/>}
        {screen==="victim" && <VictimApp/>}
        {screen==="counsellor" && <CounsellorApp/>}
        {screen==="admin" && <AdminApp/>}
        {screen!=="landing" && screen!=="login" && <DemoSwitcher/>}
        <StaleDataBanner/>
        <LiveAlerts/>
      </AppCtx.Provider>
    </ToastProvider>
  );
}

// Shown whenever the last refresh failed, so nobody reads stale risk numbers believing
// they are current.
function StaleDataBanner(){
  const {dataError,setDataError,refreshDashboard} = useApp();
  if(!dataError) return null;
  return (
    <div role="alert" className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 max-w-[92vw] flex items-center gap-3 px-4 py-3 rounded-xl bg-amber-50 border border-amber-300 text-amber-900 text-sm shadow-lg">
      <Icon name="alert" size={16}/>
      <span className="font-medium">{dataError}</span>
      <button onClick={()=>{ setDataError(null); refreshDashboard(); }} className="px-2.5 py-1 rounded-lg bg-amber-900 text-white text-xs font-semibold">Retry</button>
      <button onClick={()=>setDataError(null)} aria-label="Dismiss message" className="text-amber-900/60 text-lg leading-none">&times;</button>
    </div>
  );
}

// Live alert push: staff dashboards (counsellor/admin) open a WebSocket so a new
// High/Critical escalation shows up immediately, without waiting for a manual
// refresh or an action-triggered refetch. Victim sessions don't need this — they
// only ever see their own case, which they're already looking at.
function LiveAlerts(){
  const {session, addAlert, refreshDashboard} = useApp();
  const toast = useToast();
  useEffect(()=>{
    if(!["counsellor","admin"].includes(session?.role) || !AUTH_TOKEN) return;
    let socket = null, closed = false, retry = null, attempt = 0;

    // A browser WebSocket can't send an Authorization header, so the connection is
    // authenticated with a single-use ticket fetched over normal HTTP. The session token
    // itself never goes in a URL, where it would be captured by proxy logs and history.
    async function connect(){
      if(closed) return;
      let ticket;
      try {
        const response = await api("/api/ws-ticket", null, "POST");
        ticket = response.ticket;
      } catch { return schedule(); }
      if(closed) return;
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(`${protocol}//${location.host}/ws/alerts?ticket=${encodeURIComponent(ticket)}`);
      socket.onopen = () => { attempt = 0; };
      socket.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          if(payload.type !== "alert") return;
          addAlert({caseId:payload.case_id, name:payload.name, severity:payload.severity, reason:payload.reason, alertId:payload.alert_id});
          toast(`${payload.severity} escalation — ${payload.name}: ${payload.reason}`, payload.severity==="Critical" ? "error" : "default");
          refreshDashboard();
        } catch {}
      };
      // A dropped socket used to stay dropped: the dashboard kept looking live while
      // silently receiving nothing. Reconnect with backoff instead.
      socket.onclose = () => { if(!closed) schedule(); };
    }
    function schedule(){
      if(closed) return;
      const delay = Math.min(30000, 1000 * Math.pow(2, attempt++));
      retry = setTimeout(connect, delay);
    }

    connect();
    return () => { closed = true; clearTimeout(retry); if(socket) socket.close(); };
  }, [session?.role]);
  return null;
}

function DemoSwitcher(){
  const {screen,quickSwitch,logout} = useApp();
  const toast = useToast();
  const roles = [["victim","Victim"],["counsellor","Counsellor"],["admin","Admin"]];
  async function switchTo(role){
    if(role===screen) return;
    try { await quickSwitch(role); }
    catch { toast("Could not switch demo role — sign in again.","error"); }
  }
  return (
    <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[180] bg-white/95 backdrop-blur border border-slate-200 shadow-lg rounded-full px-1.5 py-1.5 flex items-center gap-1 text-xs font-medium">
      <span className="pl-2 pr-1 text-slate-400 hidden sm:inline">Demo view:</span>
      {roles.map(([k,label])=>(
        <button key={k} onClick={()=>switchTo(k)} className={`px-3 py-1.5 rounded-full transition ${screen===k? "bg-slate-900 text-white":"text-slate-600 hover:bg-slate-100"}`}>{label}</button>
      ))}
      <button onClick={logout} aria-label="Log out" className="ml-1 p-1.5 rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-700" title="Log out"><Icon name="logout" size={15}/></button>
    </div>
  );
}

// Offline fallback for the landing demo: a keyword sketch used only when /api/demo/assess
// cannot be reached, and labelled on the page as not being the model.
const DEMO_SIGNALS = [
  {re:/hopeless|give up|no point|can'?t go on|end it|उम्मीद नहीं|ख़त्म|खत्म/i, w:34, label:{en:"Hopelessness", hi:"निराशा"}},
  {re:/scared|afraid|fear|threat|called again|following me|डर|धमकी|फिर फ़ोन|फिर फोन/i, w:30, label:{en:"Fear / threat", hi:"डर / धमकी"}},
  {re:/alone|lonely|nobody|अकेल|कोई नहीं/i, w:22, label:{en:"Isolation", hi:"अकेलापन"}},
  {re:/tired|exhausted|can'?t sleep|no sleep|थक|नींद नहीं/i, w:12, label:{en:"Exhaustion", hi:"थकान"}},
  {re:/postponed|delay|again|hearing|court|टल|सुनवाई|फिर/i, w:10, label:{en:"Case stress", hi:"केस का तनाव"}},
  {re:/slept well|better|talked to|sister|brother|family|friend|calm|अच्छी|बहन|भाई|परिवार|दोस्त|बात की/i, w:-12, label:{en:"Support present", hi:"सहारा मौजूद"}},
];
function demoAssess(text){
  const hits = DEMO_SIGNALS.filter(s=>s.re.test(text));
  const score = clamp(12 + hits.reduce((sum,s)=>sum+s.w,0), 3, 97);
  return {score, hits};
}

// Adds .is-in to every .lp-reveal inside `root` once its top edge has entered the viewport.
// A position check on scroll rather than an IntersectionObserver: a jump (End key, anchor,
// scrollbar drag) carries elements from below the fold to above it without ever
// "intersecting", and an observer would leave them invisible.
function useReveal(root){
  useEffect(()=>{
    let pending = Array.from(root.current ? root.current.querySelectorAll(".lp-reveal") : []);
    let raf = 0;
    function check(){
      raf = 0;
      const limit = window.innerHeight - 40;
      pending = pending.filter(n=>{
        if(n.getBoundingClientRect().top < limit){ n.classList.add("is-in"); return false; }
        return true;
      });
      if(!pending.length) detach();
    }
    const schedule = ()=>{ if(!raf) raf = requestAnimationFrame(check); };
    function detach(){ window.removeEventListener("scroll", schedule); window.removeEventListener("resize", schedule); }
    window.addEventListener("scroll", schedule, {passive:true});
    window.addEventListener("resize", schedule);
    schedule();
    return ()=>{ detach(); cancelAnimationFrame(raf); };
  },[]);
}

// Moves the hover spotlight on .lp-card to follow the pointer.
function spotlight(e){
  const r = e.currentTarget.getBoundingClientRect();
  e.currentTarget.style.setProperty("--mx", `${e.clientX-r.left}px`);
  e.currentTarget.style.setProperty("--my", `${e.clientY-r.top}px`);
}

function CountUp({to, suffix=""}){
  const ref = useRef(null);
  const [n,setN] = useState(0);
  useEffect(()=>{
    const el = ref.current;
    if(!el || window.matchMedia("(prefers-reduced-motion: reduce)").matches){ setN(to); return; }
    let raf = 0;
    // Same position check as useReveal, so a jump past the stats still lands on the final value.
    function check(){
      if(el.getBoundingClientRect().top > window.innerHeight - 40) return;
      window.removeEventListener("scroll", check);
      const t0 = performance.now();
      const tick = (t)=>{
        const p = Math.min(1,(t-t0)/1400);
        setN(Math.round(to*(1-Math.pow(1-p,3))));
        if(p<1) raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    }
    window.addEventListener("scroll", check, {passive:true});
    check();
    return ()=>{ window.removeEventListener("scroll", check); cancelAnimationFrame(raf); };
  },[to]);
  return <span ref={ref}>{n.toLocaleString("en-IN")}{suffix}</span>;
}

// Saathi: a breathing, blinking blob whose eyes follow the pointer and whose colour and
// expression follow the mood the visitor picks.
function Saathi({mood}){
  const eyes = useRef(null);
  const m = MOODS[mood] || MOODS.idle;
  useEffect(()=>{
    let raf = 0;
    function onMove(e){
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(()=>{
        const el = eyes.current; if(!el) return;
        const r = el.ownerSVGElement.getBoundingClientRect();
        const dx = e.clientX-(r.left+r.width/2), dy = e.clientY-(r.top+r.height/2);
        const d = Math.hypot(dx,dy) || 1, k = Math.min(1, d/400);
        el.style.transform = `translate(${(dx/d)*6*k}px, ${(dy/d)*5*k}px)`;
      });
    }
    window.addEventListener("pointermove", onMove, {passive:true});
    return ()=>{ window.removeEventListener("pointermove", onMove); cancelAnimationFrame(raf); };
  },[]);
  return (
    <div className="lp-companion" aria-hidden="true">
      <div className="lp-ring"/><div className="lp-ring"/><div className="lp-ring"/>
      <div className="lp-blob">
        <svg className="lp-face" viewBox="0 0 200 200">
          <g ref={eyes} className="lp-eyes">
            <ellipse className="lp-eye" cx="78" cy="94" rx="8" ry="11" fill="#22302A"/>
            <ellipse className="lp-eye" cx="122" cy="94" rx="8" ry="11" fill="#22302A"/>
            <circle cx="81" cy="90" r="2.6" fill="#fff"/><circle cx="125" cy="90" r="2.6" fill="#fff"/>
          </g>
          <ellipse cx="62" cy="116" rx="10" ry="6" fill="#F28B82" opacity={m.cheek} style={{transition:"opacity .6s"}}/>
          <ellipse cx="138" cy="116" rx="10" ry="6" fill="#F28B82" opacity={m.cheek} style={{transition:"opacity .6s"}}/>
          <path className="lp-mouth" d={m.mouth} style={{d:`path("${m.mouth}")`}} fill="none" stroke="#22302A" strokeWidth="5" strokeLinecap="round"/>
        </svg>
      </div>
    </div>
  );
}

// The landing demo asks the real model (POST /api/demo/assess — no login, nothing stored).
// If the server cannot be reached it falls back to the keyword sketch above and says so.
function ListenDemo({t, lang}){
  const [text,setText] = useState("");
  const [result,setResult] = useState(null);
  const [loading,setLoading] = useState(false);
  const [shown,setShown] = useState(0);
  const latest = useRef(0);
  async function run(value){
    const v = (value ?? text).trim();
    if(!v || loading) return;
    setText(v);
    setLoading(true);
    const ticket = ++latest.current;
    let next;
    try {
      const r = await api("/api/demo/assess", {message:v.slice(0,500)});
      next = {source:"live", score:r.score, band:r.risk_band, textBand:r.text_band, escalation:r.escalation_probability,
        confidence:r.confidence, urgent:r.urgent, topic:r.topic, wouldAlert:r.would_alert, interventions:r.interventions||[]};
    } catch {
      const sketch = demoAssess(v);
      next = {source:"offline", score:sketch.score, band:riskFromScore(sketch.score).label.replace(" Risk",""), hits:sketch.hits,
        wouldAlert:sketch.score>70};
    }
    if(ticket!==latest.current) return;
    setResult(next);
    setLoading(false);
  }
  // Count the number up alongside the gauge sweep.
  useEffect(()=>{
    if(!result) return;
    let raf; const from = shown, t0 = performance.now();
    const tick = (now)=>{
      const p = Math.min(1,(now-t0)/1300);
      setShown(Math.round(from+(result.score-from)*(1-Math.pow(1-p,3))));
      if(p<1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(raf);
  },[result]);
  const score = result ? result.score : 0;
  const style = BAND_STYLE[result?.band] || BAND_STYLE.Moderate;
  const ARC = Math.PI*80;
  const next = !result ? "" : result.urgent ? t.nextUrgent : result.wouldAlert ? t.nextHigh : score>=50 ? t.nextMid : t.nextLow;
  const topic = result?.topic && TOPIC_LABEL[result.topic];
  return (
    <div className="grid lg:grid-cols-[1.1fr_.9fr] gap-6">
      <div className="lp-card p-6 sm:p-8" onPointerMove={spotlight}>
        <label htmlFor="lp-demo" className="sr-only">{t.placeholder}</label>
        <textarea id="lp-demo" value={text} onChange={e=>setText(e.target.value)} maxLength={500} rows={4} placeholder={t.placeholder}
          onKeyDown={e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); run(); } }}
          className="lp-focus w-full resize-none rounded-2xl border border-black/10 bg-white/80 p-4 text-[15px] leading-relaxed outline-none focus:border-[#6E8F71]"/>
        <div className="mt-4 text-xs font-semibold text-[color:var(--muted)]">{t.samplesLabel}</div>
        <div className="mt-2 flex flex-col gap-2">
          {t.samples.map((s,i)=>(
            <button key={i} onClick={()=>run(s)} className="lp-focus text-left text-sm rounded-xl px-3.5 py-2.5 bg-white/70 border border-black/5 hover:bg-white hover:border-[#6E8F71]/40 transition">
              “{s}”
            </button>
          ))}
        </div>
        <button onClick={()=>run()} disabled={!text.trim() || loading} className="lp-btn lp-btn-primary lp-focus mt-5 px-6 py-3 disabled:opacity-40">
          <Icon name="sparkle" size={16}/> {loading ? t.listening : t.listen}
        </button>
      </div>
      <div className="lp-card p-6 sm:p-8 flex flex-col items-center text-center" onPointerMove={spotlight} aria-live="polite" aria-busy={loading}>
        <div className="text-xs font-bold uppercase tracking-[.12em] text-[color:var(--muted)]">{t.score}</div>
        <svg viewBox="0 0 200 116" className={`w-full max-w-[280px] mt-2 transition-opacity ${loading?"opacity-50 animate-pulse":""}`}>
          <defs>
            <linearGradient id="lpGauge" x1="0" x2="1"><stop offset="0" stopColor="#1F9254"/><stop offset=".5" stopColor="#EA8C1E"/><stop offset="1" stopColor="#B91C1C"/></linearGradient>
          </defs>
          <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#EDE7DD" strokeWidth="16" strokeLinecap="round"/>
          <path className="lp-gauge-arc" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#lpGauge)" strokeWidth="16" strokeLinecap="round"
            strokeDasharray={ARC} strokeDashoffset={ARC*(1-score/100)}/>
          <g className="lp-needle" style={{transform:`rotate(${-90+score*1.8}deg)`}}>
            <line x1="100" y1="100" x2="100" y2="36" stroke="#22302A" strokeWidth="3" strokeLinecap="round"/>
          </g>
          <circle cx="100" cy="100" r="7" fill="#22302A"/>
        </svg>
        <div className="text-5xl font-extrabold tabular-nums -mt-1">{result ? shown : "—"}</div>
        {result && (
          <div key={text+score} className="lp-swap w-full">
            <span className="inline-block mt-2 px-3 py-1 rounded-full text-sm font-bold" style={{background:style.bg, color:style.text}}>{t.bands[result.band] || result.band}</span>
            {result.source==="live" ? (
              <>
                <div className="mt-5 grid grid-cols-3 gap-2 text-left">
                  {[[t.textModel, t.bands[result.textBand] || result.textBand],[t.escalation, result.urgent ? t.rule : `${result.escalation}%`],[t.confidence, `${result.confidence}%`]].map(([k,v],i)=>(
                    <div key={i} className="rounded-xl bg-[#F6F2EA] px-3 py-2" style={{animation:`popIn .35s ${i*90}ms both`}}>
                      <div className="text-[10px] font-bold uppercase tracking-wider text-[color:var(--muted)]">{k}</div>
                      <div className="text-sm font-extrabold mt-0.5">{v}</div>
                    </div>
                  ))}
                </div>
                {topic && (
                  <div className="mt-3 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border border-[#F3D3C8] bg-[#FDF1EC] text-[#9A3D26]">
                    <Icon name="shield" size={12}/> {t.safety}: {topic[lang]}
                  </div>
                )}
                {result.interventions.length>0 && (
                  <div className="mt-3 text-xs text-[color:var(--muted)]"><b>{t.suggested}:</b> {result.interventions.join(" · ")}</div>
                )}
              </>
            ) : (
              <div className="mt-4 flex flex-wrap justify-center gap-2">
                {result.hits.length ? result.hits.map((h,i)=>(
                  <span key={i} className="px-3 py-1 rounded-full text-xs font-semibold border" style={{animation:`popIn .35s ${i*90}ms both`, borderColor:h.w<0?"#BFE3C8":"#F3D3C8", background:h.w<0?"#EEF8F0":"#FDF1EC", color:h.w<0?"#1F6B3A":"#9A3D26"}}>
                    {h.label[lang]}
                  </span>
                )) : <span className="text-sm text-[color:var(--muted)]">{t.noSignals}</span>}
              </div>
            )}
            <div className="mt-4 flex items-center justify-center gap-2 text-sm font-semibold">
              <Icon name={result.urgent||result.wouldAlert?"bell":score>=50?"calendar":"heart"} size={16}/> {next}
            </div>
          </div>
        )}
        <p className="mt-auto pt-6 text-[11px] leading-relaxed text-[color:var(--muted)] inline-flex items-start gap-1.5">
          {(!result || result.source==="live") && <span className="mt-[3px] w-2 h-2 rounded-full bg-[#1F9254] shrink-0 animate-pulse"/>}
          {result && result.source==="offline" ? t.illustrative : t.live}
        </p>
      </div>
    </div>

}

function BreathingCircle({t}){
  const PHASES = [{key:"in",secs:4,scale:1},{key:"hold",secs:4,scale:1},{key:"out",secs:6,scale:.55}];
  const [running,setRunning] = useState(false);
  const [phase,setPhase] = useState(0);
  const [left,setLeft] = useState(4);
  useEffect(()=>{
    if(!running) return;
    let p = 0, remaining = PHASES[0].secs;
    setPhase(0); setLeft(remaining);
    const id = setInterval(()=>{
      remaining -= 1;
      if(remaining<=0){ p = (p+1)%PHASES.length; remaining = PHASES[p].secs; setPhase(p); }
      setLeft(remaining);
    },1000);
    return ()=>clearInterval(id);
  },[running]);
  const cur = PHASES[phase];
  const scale = running ? cur.scale : .7;
  return (
    <div className="flex flex-col items-center">
      <div className="relative w-[260px] h-[260px] sm:w-[300px] sm:h-[300px] flex items-center justify-center">
        <div className="absolute inset-0 rounded-full border-2 border-dashed border-[#6E8F71]/25"/>
        <div className="lp-breath absolute inset-[6%] rounded-full"
          style={{transform:`scale(${scale})`, transitionDuration:`${running?cur.secs:.8}s`,
            background:"radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,0) 50%),linear-gradient(135deg,#A8D5B0,#BDB2EA 60%,#F6C6A6)",
            boxShadow:"0 30px 60px -25px rgba(47,93,80,.55)"}}/>
        <div className="relative text-center" aria-live="polite">
          <div className="text-xl font-bold">{running ? t.phases[cur.key] : t.ready}</div>
          {running && <div className="text-4xl font-extrabold tabular-nums mt-1">{left}</div>}
        </div>
      </div>
      <button onClick={()=>setRunning(r=>!r)} className="lp-btn lp-btn-ghost lp-focus mt-6 px-6 py-3">
        <Icon name={running?"x":"leaf"} size={16}/> {running ? t.pause : t.start}
      </button>
    </div>
  );
}

function Sparkle({x,y,s=1,d=0}){
  return <path className="rh-twinkle" style={{"--d":d+"s"}} transform={`translate(${x} ${y}) scale(${s})`} d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2Z" fill="#8C7BD6"/>;
}
// Specular highlight painted on top of a sphere (what makes it read as glossy 3D)
function Spec({cx,cy,r}){
  return <ellipse cx={cx-r*.34} cy={cy-r*.42} rx={r*.34} ry={r*.18} transform={`rotate(-35 ${cx-r*.34} ${cy-r*.42})`} fill="url(#lgSpec)"/>;
}
 
// `closed` = the mascot covers its eyes (while a password is being typed). Eyes also follow the cursor,
// and shapes drift with a small parallax, so the panel feels alive without any library.
function LoginScene({closed}){
  const ref = useRef(null);
  const [p,setP] = useState({x:0,y:0});
  useEffect(()=>{
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let raf;
    const onMove = e => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(()=>{
        const r = ref.current && ref.current.getBoundingClientRect();
        if(!r) return;
        setP({x:clamp((e.clientX-(r.left+r.width/2))/(r.width/2),-1,1), y:clamp((e.clientY-(r.top+r.height/2))/(r.height/2),-1,1)});
      });
    };
    window.addEventListener("mousemove",onMove);
    return ()=>{ window.removeEventListener("mousemove",onMove); cancelAnimationFrame(raf); };
  },[]);
  const par = d => ({transform:`translate(${p.x*d}px,${p.y*d}px)`, transition:"transform .3s ease-out"});
  const eye = (cx) => (
    <g transform={`translate(${cx} 312)`}>
      <g style={{transformBox:"fill-box", transformOrigin:"center", transform:`scaleY(${closed?0.08:1})`, transition:"transform .3s cubic-bezier(.3,.9,.3,1)"}}>
        <g style={{transform:`translate(${p.x*4}px,${p.y*3}px)`, transition:"transform .15s ease-out"}}>
          <ellipse className="rh-blink" rx="9.5" ry="13" fill="#15102f"/>
          <circle cx="-2.5" cy="-5" r="3.4" fill="#fff"/><circle cx="3" cy="4" r="1.6" fill="#fff" fillOpacity=".7"/>
        </g>
      </g>
    </g>
  );
  return (
    <svg ref={ref} viewBox="0 0 500 640" preserveAspectRatio="xMidYMid slice" className="absolute inset-0 w-full h-full" aria-hidden="true">
      <defs>
        {/* every ball uses an off-centre radial gradient: light spot top-left, dark rim bottom-right */}
        <radialGradient id="lgBlue" cx=".5" cy=".5" r=".55" fx=".32" fy=".28"><stop offset="0" stopColor="#c4ceff"/><stop offset=".45" stopColor="#6f7dff"/><stop offset="1" stopColor="#3440d0"/></radialGradient>
        <radialGradient id="lgPurple" cx=".5" cy=".5" r=".55" fx=".32" fy=".28"><stop offset="0" stopColor="#dccbff"/><stop offset=".5" stopColor="#8a66ff"/><stop offset="1" stopColor="#4a30cc"/></radialGradient>
        <radialGradient id="lgGold" cx=".5" cy=".5" r=".6" fx=".3" fy=".25"><stop offset="0" stopColor="#fff4b8"/><stop offset=".5" stopColor="#ffd23f"/><stop offset="1" stopColor="#d08f00"/></radialGradient>
        <radialGradient id="lgSilver" cx=".5" cy=".5" r=".55" fx=".32" fy=".28"><stop offset="0" stopColor="#fff"/><stop offset=".5" stopColor="#c6cbe0"/><stop offset="1" stopColor="#737a99"/></radialGradient>
        <radialGradient id="lgPetal" cx=".5" cy=".5" r=".6" fx=".35" fy=".3"><stop offset="0" stopColor="#cdb9ff"/><stop offset=".55" stopColor="#8c68ff"/><stop offset="1" stopColor="#5434d6"/></radialGradient>
        <radialGradient id="lgPetal2" cx=".5" cy=".5" r=".6" fx=".35" fy=".3"><stop offset="0" stopColor="#e2d6ff"/><stop offset=".6" stopColor="#a98cff"/><stop offset="1" stopColor="#7650ee"/></radialGradient>
        <radialGradient id="lgFace" cx=".5" cy=".42" r=".6"><stop offset="0" stopColor="#d9caff"/><stop offset="1" stopColor="#8d6aff"/></radialGradient>
        <radialGradient id="lgShade" cx=".5" cy=".5" r=".6" fx=".3" fy=".25"><stop offset="0" stopColor="#fff" stopOpacity=".5"/><stop offset=".3" stopColor="#fff" stopOpacity="0"/><stop offset=".75" stopColor="#000" stopOpacity=".15"/><stop offset="1" stopColor="#000" stopOpacity=".5"/></radialGradient>
        <radialGradient id="lgSpec"><stop offset="0" stopColor="#fff" stopOpacity=".95"/><stop offset="1" stopColor="#fff" stopOpacity="0"/></radialGradient>
        <radialGradient id="lgGlass" cx=".5" cy=".5" r=".5"><stop offset=".55" stopColor="#fff" stopOpacity=".03"/><stop offset="1" stopColor="#bcd0ff" stopOpacity=".3"/></radialGradient>
        <linearGradient id="lgTorus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#a1acff"/><stop offset="1" stopColor="#3440d0"/></linearGradient>
        <clipPath id="lgClipS"><circle cx="105" cy="115" r="92"/></clipPath>
      </defs>
 
      {/* ----- background twinkles ----- */}
      <Sparkle x={190} y={150} s={1.2} d={0}/><Sparkle x={330} y={235} s={.8} d={1}/><Sparkle x={45} y={405} s={1} d={2}/>
      <Sparkle x={470} y={470} s={1.1} d={.6}/><Sparkle x={300} y={590} s={.9} d={1.6}/>
 
      {/* ----- striped gold sphere (top-left) ----- */}
      <g style={par(10)}><g className="rh-bob" style={{"--t":"8s","--d":"0s","--r":"4deg"}}>
        <g clipPath="url(#lgClipS)">
          <circle cx="105" cy="115" r="92" fill="#fff3cf"/>
          <g transform="rotate(-35 105 115)">{[0,1,2,3,4,5,6].map(i=>(<rect key={i} x={10+i*44} y="-60" width="22" height="360" fill="#f7b500"/>))}</g>
          <circle cx="105" cy="115" r="92" fill="url(#lgShade)"/>
        </g>
        <Spec cx={105} cy={115} r={92}/>
      </g></g>
 
      {/* ----- big periwinkle sphere (top-right) ----- */}
      <g style={par(14)}><g className="rh-bob" style={{"--t":"9s","--d":"1.2s","--r":"-3deg"}}>
        <circle cx="400" cy="120" r="85" fill="url(#lgBlue)"/><Spec cx={400} cy={120} r={85}/>
      </g></g>
 
      {/* ----- glass bubbles ----- */}
      <g style={par(18)}><g className="rh-bob" style={{"--t":"6s","--d":".4s"}}>
        <circle cx="255" cy="48" r="34" fill="url(#lgGlass)" stroke="#fff" strokeOpacity=".4" strokeWidth="1.5"/>
        <path d="M236,34 A24,24 0 0 1 256,22" fill="none" stroke="#fff" strokeOpacity=".85" strokeWidth="3.5" strokeLinecap="round"/>
      </g></g>
      <g style={par(22)}><g className="rh-bob" style={{"--t":"7.5s","--d":"2s"}}>
        <circle cx="385" cy="455" r="44" fill="url(#lgGlass)" stroke="#fff" strokeOpacity=".4" strokeWidth="1.5"/>
        <path d="M360,436 A32,32 0 0 1 386,418" fill="none" stroke="#fff" strokeOpacity=".85" strokeWidth="4" strokeLinecap="round"/>
        <circle cx="405" cy="480" r="4" fill="#fff" fillOpacity=".5"/>
      </g></g>
 
      {/* ----- silver sphere (left) ----- */}
      <g style={par(16)}><g className="rh-bob" style={{"--t":"6.5s","--d":".8s"}}>
        <circle cx="38" cy="300" r="30" fill="url(#lgSilver)"/><Spec cx={38} cy={300} r={30}/>
      </g></g>
 
      {/* ----- purple sphere (right) ----- */}
      <g style={par(20)}><g className="rh-bob" style={{"--t":"7s","--d":"1.6s","--r":"-4deg"}}>
        <circle cx="448" cy="320" r="52" fill="url(#lgPurple)"/><Spec cx={448} cy={320} r={52}/>
      </g></g>
 
      {/* ----- blue torus (bottom-left) ----- */}
      <g style={par(18)}><g className="rh-bob" style={{"--t":"8.5s","--d":"1s","--r":"6deg"}}>
        <g transform="translate(62 470) rotate(-14)">
          <ellipse rx="25" ry="44" fill="none" stroke="url(#lgTorus)" strokeWidth="28"/>
          <ellipse rx="25" ry="44" fill="none" stroke="#fff" strokeOpacity=".3" strokeWidth="5" transform="translate(-7 -5)"/>
        </g>
      </g></g>
 
      {/* ----- yellow bean (bottom) ----- */}
      <g style={par(14)}><g className="rh-bob" style={{"--t":"7s","--d":"2.4s","--r":"-5deg"}}>
        <g transform="translate(118 520)">
          <path d="M0,40 C-12,-10 40,-42 72,-20 C104,2 82,62 42,72 C12,80 4,62 0,40Z" fill="url(#lgGold)"/>
          <ellipse cx="30" cy="8" rx="17" ry="8" transform="rotate(-30 30 8)" fill="url(#lgSpec)"/>
        </g>
      </g></g>
 
      {/* ----- blue gem cube (bottom-right) ----- */}
      <g style={par(20)}><g className="rh-bob" style={{"--t":"9s","--d":".2s","--r":"5deg"}}>
        <g transform="translate(398 565) scale(1.15)">
          <polygon points="0,-40 35,-20 0,0 -35,-20" fill="#a3afff"/>
          <polygon points="-35,-20 0,0 0,42 -35,22" fill="#4f5cea"/>
          <polygon points="0,0 35,-20 35,22 0,42" fill="#2c37b8"/>
          <polyline points="-30,-20 0,-36" fill="none" stroke="#fff" strokeOpacity=".7" strokeWidth="2.5" strokeLinecap="round"/>
        </g>
      </g></g>
 
      {/* ================= MASCOT ================= */}
      <g style={par(6)}><g className="rh-bob" style={{"--t":"6s","--d":"0s","--r":"1.5deg"}}><g className="rh-mascot">
        {/* fluffy petals: two rings, the outer one turns very slowly */}
        <g className="rh-petspin">
          {Array.from({length:16},(_,i)=>(<ellipse key={i} cx="250" cy="228" rx="25" ry="46" fill="url(#lgPetal)" transform={`rotate(${i*22.5} 250 320)`}/>))}
        </g>
        {Array.from({length:16},(_,i)=>(<ellipse key={i} cx="250" cy="238" rx="21" ry="38" fill="url(#lgPetal2)" transform={`rotate(${i*22.5+11.25} 250 320)`}/>))}
        <circle cx="250" cy="320" r="76" fill="url(#lgFace)"/>
        <ellipse cx="222" cy="278" rx="30" ry="12" transform="rotate(-25 222 278)" fill="url(#lgSpec)" opacity=".7"/>
 
        {/* face moves slightly toward the cursor */}
        <g style={{transform:`translate(${p.x*7}px,${p.y*5}px)`, transition:"transform .15s ease-out"}}>
          <ellipse cx="204" cy="338" rx="15" ry="9" fill="#ff8fb4" fillOpacity=".4"/>
          <ellipse cx="296" cy="338" rx="15" ry="9" fill="#ff8fb4" fillOpacity=".4"/>
          {eye(222)}{eye(278)}
          <path d="M241,336 Q250,346 259,336" fill="none" stroke="#15102f" strokeWidth="3.2" strokeLinecap="round" style={{opacity:closed?0:1, transition:"opacity .2s"}}/>
          <ellipse cx="250" cy="340" rx="5" ry="4.5" fill="#15102f" style={{opacity:closed?1:0, transition:"opacity .2s"}}/>
        </g>
 
        {/* little hands rise to cover the eyes while a password is typed */}
        {[222,278].map(x=>(
          <g key={x} style={{transform:`translate(${x}px,${closed?316:392}px)`, opacity:closed?1:0, transition:"transform .4s cubic-bezier(.3,1.3,.5,1), opacity .25s"}}>
            <circle r="21" fill="url(#lgPetal)"/><ellipse cx="-6" cy="-9" rx="9" ry="5" transform="rotate(-30 -6 -9)" fill="url(#lgSpec)"/>
          </g>
        ))}
      </g></g></g>
    </svg>
  );
}

// Same light, calm look as the landing page, with the mascot that covers its eyes while the
// password is being typed. Follows the language picked on the landing page.
function LoginPage(){
  const {loginRole,setLoginRole,login,setScreen} = useApp();
  const toast = useToast();
  const [email,setEmail] = useState("");
  const [pwd,setPwd] = useState("");
  const [showPwd,setShowPwd] = useState(false);
  const [pwdFocus,setPwdFocus] = useState(false);
  const [submitting,setSubmitting] = useState(false);
  const lang = (()=>{ try { return localStorage.getItem("raahat.lang")==="hi" ? "hi" : "en"; } catch { return "en"; } })();
  const t = LOGIN_COPY[lang];
  const creds = {
    victim:{email:"victim@demo.in"}, counsellor:{email:"counsellor@demo.in"}, admin:{email:"admin@demo.in"},
  };
  useEffect(()=>{ setEmail(creds[loginRole].email); setPwd("demo123"); },[loginRole]);

  const roles = ["victim","counsellor","admin"];
  const icons = {victim:"heart", counsellor:"message", admin:"shield"};
  const accents = {victim:"#2F5D50", counsellor:"#4F5CEA", admin:"#2C8C82"};
  const acc = accents[loginRole];
  const idx = roles.indexOf(loginRole);
  const closed = pwdFocus && !showPwd;
  const caption = submitting ? t.signingCap : closed ? t.privateCap : t.hello;

  async function submit(useEmail, usePwd){
    if(submitting) return;
    setSubmitting(true);
    try { await login(useEmail, usePwd); }
    catch { toast(t.invalid,"error"); }
    finally { setSubmitting(false); }
  }

  return (
    <div className="lp min-h-screen flex lg:p-6 lg:gap-6" style={{"--acc":acc}}>
      <div className="lp-aurora" aria-hidden="true"><span className="a1"/><span className="a2"/><span className="a3"/></div>

      <aside className="hidden lg:block relative z-10 flex-1 rounded-[32px] overflow-hidden border border-white/70"
        style={{background:"linear-gradient(155deg,#E6E0FA 0%,#F3EEE6 55%,#E2F0E5 100%)", boxShadow:"0 40px 80px -40px rgba(47,93,80,.45)", minHeight:"calc(100vh - 48px)"}}>
        <LoginScene closed={closed}/>
        <div className="absolute top-7 left-8 flex items-center gap-3">
          <Logo size={42}/>
          <div className="font-extrabold text-lg tracking-tight">{lang==="hi" ? "राहत" : "Raahat"}</div>
        </div>
        <div className="absolute bottom-7 left-8 right-8 flex flex-col items-start gap-3">
          <div key={caption} className="rh-caption lp-glass rounded-2xl px-4 py-2.5 text-sm font-semibold shadow-sm">{caption}</div>
          <div className="text-xs text-[color:var(--muted)]">{t.ministry}</div>
        </div>
      </aside>

      <main className="relative z-10 flex-1 lg:max-w-[520px] w-full flex flex-col items-center justify-center p-5 sm:p-8">
        <div className="lg:hidden flex items-center gap-2.5 mb-6">
          <Logo size={48}/>
          <div className="font-extrabold text-lg">{lang==="hi" ? "राहत" : "Raahat"}</div>
        </div>

        <div className="rh-card-in lp-glass w-full max-w-md rounded-[28px] p-6 sm:p-8 shadow-[0_30px_60px_-30px_rgba(34,48,42,.45)]">
          <div role="tablist" aria-label="Sign in as" className="relative grid grid-cols-3 p-1 rounded-2xl bg-white/70 border border-black/5 mb-7">
            <div className="rh-tabs-ind absolute top-1 bottom-1 left-1 rounded-xl" aria-hidden="true"
              style={{width:"calc((100% - 8px) / 3)", transform:`translateX(${idx*100}%)`, background:acc}}/>
            {roles.map(r=>(
              <button key={r} role="tab" aria-selected={loginRole===r} onClick={()=>setLoginRole(r)}
                className={`lp-focus relative z-10 flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-[13px] font-bold transition-colors ${loginRole===r ? "text-white" : "text-[color:var(--muted)] hover:text-[color:var(--ink)]"}`}>
                <Icon name={icons[r]} size={14}/><span className="truncate">{t.roles[r]}</span>
              </button>
            ))}
          </div>

          <h1 key={loginRole+lang} className="lp-swap text-2xl sm:text-3xl font-extrabold tracking-tight">{t.titles[loginRole]}</h1>
          <p className="text-sm text-[color:var(--muted)] mt-1 mb-6">{t.subs[loginRole]}</p>

          <form onSubmit={e=>{ e.preventDefault(); submit(email,pwd); }}>
            <label htmlFor="lg-email" className="block text-xs font-bold text-[color:var(--muted)] mb-1.5">{t.email}</label>
            <input id="lg-email" type="email" autoComplete="username" value={email} onChange={e=>setEmail(e.target.value)} className="lg-input mb-4" placeholder="you@example.in"/>
            <label htmlFor="lg-pwd" className="block text-xs font-bold text-[color:var(--muted)] mb-1.5">{t.password}</label>
            <div className="relative mb-6">
              <input id="lg-pwd" type={showPwd?"text":"password"} autoComplete="current-password" value={pwd}
                onChange={e=>setPwd(e.target.value)} onFocus={()=>setPwdFocus(true)} onBlur={()=>setPwdFocus(false)}
                className="lg-input pr-20"/>
              <button type="button" onClick={()=>setShowPwd(v=>!v)} aria-pressed={showPwd}
                className="lp-focus absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-[color:var(--muted)] hover:text-[color:var(--ink)]">{showPwd ? t.hide : t.show}</button>
            </div>
            <button type="submit" disabled={submitting} className="lp-btn lp-btn-primary lp-focus w-full py-3.5 mb-3 disabled:opacity-50" style={{background:acc}}>
              {submitting ? t.signingIn : t.signIn}
            </button>
            <button type="button" disabled={submitting} onClick={()=>submit(creds[loginRole].email,"demo123")} className="lp-btn lp-btn-ghost lp-focus w-full py-3.5 disabled:opacity-50">
              {t.enter(t.roles[loginRole])}
            </button>
          </form>

          <div className="mt-5 flex items-center justify-center gap-2 text-xs text-[color:var(--muted)]">
            <Icon name="lock" size={12}/> {t.demoPwd} <span className="font-mono font-bold">demo123</span>
          </div>
        </div>

        <button onClick={()=>setScreen("landing")} className="lp-focus mt-6 flex items-center gap-1.5 text-sm font-semibold text-[color:var(--muted)] hover:text-[color:var(--ink)]"><Icon name="back" size={15}/> {t.back}</button>
      </main>
    </div>
  );
}

// Below md the sidebar is hidden. Eight tabs in a scrolling strip were hard to use on a phone,

    <>

            </div>

        </div>
      )}
      <nav aria-label="Main" className="md:hidden fixed bottom-0 inset-x-0 z-[116] flex gap-1 px-2 pt-1.5 border-t border-black/10"
        style={{background:"var(--v-bg)", paddingBottom:"calc(.4rem + env(safe-area-inset-bottom))"}}>
        {nav.filter(([id])=>primary.includes(id)).map(([id,label,icon])=>(
          <button key={id} onClick={()=>{ setMore(false); onSelect(id); }} aria-current={current===id?"page":undefined}

// Help is never more than one tap away, on every participant screen, instead of a small card
// at the bottom of Home.
function SosBar(){
  const {caseId,refreshDashboard} = useApp();
  const toast = useToast();
  const [sending,setSending] = useState(false);
  const [sent,setSent] = useState(false);
  async function sendSos(){
    if(sending) return;
    setSending(true);
    try {
      await api(`/api/cases/${caseId}/sos`, {note:"Emergency button pressed by the participant"});
      await refreshDashboard();
      setSent(true);
      toast("Your care team has been alerted immediately.","error");
    } catch { toast("Could not reach the support service. If you are in immediate danger, contact local emergency services now.","error"); }
    finally { setSending(false); }
  }
  return (
    // Top padding leaves room for the fixed demo-role switcher that sits over every signed-in screen.
    <div className="border-b border-black/5 pt-[52px]" style={{background:"#F3EEE4"}}>
      <div className="max-w-5xl mx-auto px-4 sm:px-6 py-2 flex flex-wrap items-center gap-x-4 gap-y-1.5 text-[12.5px]">
        <span className="font-semibold" style={{color:"var(--v-ink)"}}>Need help right now?</span>
        {[["Tele-MANAS","14416"],["Atrocity helpline","14566"],["Emergency","112"]].map(([l,n])=>(
          <a key={n} href={`tel:${n}`} className="inline-flex items-center gap-1 text-black/60 hover:text-black"><Icon name="phone" size={12}/><span className="hidden sm:inline">{l}</span> <b>{n}</b></a>
        ))}
        <button disabled={sending} onClick={sendSos} className="ml-auto px-3.5 py-1.5 rounded-full text-white font-semibold disabled:opacity-50 shadow-sm" style={{background:"var(--high)"}}>
          {sending ? "Alerting your care team…" : "I need help right now"}
        </button>
      </div>
      {sent && (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 pb-3">
          <div className="bg-white border-2 rounded-2xl p-4 fade-in" style={{borderColor:"var(--high)"}}>
            <div className="flex items-center gap-2 mb-1" style={{color:"var(--high)"}}><Icon name="alert" size={17}/><span className="font-semibold text-sm">Your care team has been alerted immediately.</span>
              <button onClick={()=>setSent(false)} aria-label="Dismiss" className="ml-auto text-black/40 text-sm">✕</button></div>
            <p className="text-xs text-black/55">This demo cannot call or dispatch anyone. If you are in immediate danger, call 112 or go to a trusted person near you right now.</p>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- Mood weather: the score, shown as weather rather than a number ---------- */
// The 0-100 score and its risk band are for the care team. A frightened person reading
// "54 / 100 · Moderate Risk" about themselves can feel worse, so the participant sees the same
// signal as gentle weather, with a sentence built from their own recent check-ins.
const WEATHER = [
  {max:25, key:"clear", name:"Clear skies", line:"Things have felt lighter lately."},
  {max:50, key:"sunny", name:"Mostly bright", line:"Mostly okay, with a few clouds."},
  {max:70, key:"cloudy", name:"Cloudy", line:"It's been a heavier stretch. That's okay to notice."},
  {max:85, key:"rain", name:"Rainy", line:"These days have been hard. You don't have to face them alone."},
  {max:101, key:"storm", name:"Stormy", line:"It's very heavy right now. Please reach out — your care team is here."},
];
const weatherFor = score => WEATHER.find(w=>score<w.max) || WEATHER[WEATHER.length-1];

function WeatherArt({kind, size=96, still=false}){
  const anim = still ? "" : " v-anim";
  const sun = (cx,cy,r)=>(
    <g className={"v-sun"+anim} style={{transformOrigin:`${cx}px ${cy}px`}}>
      {Array.from({length:8},(_,i)=><line key={i} x1={cx} y1={cy-r-6} x2={cx} y2={cy-r-13} stroke="#F2B544" strokeWidth="4" strokeLinecap="round" transform={`rotate(${i*45} ${cx} ${cy})`}/>)}
      <circle cx={cx} cy={cy} r={r} fill="#F7C65A"/>
    </g>
  );
  const cloud = (x,y,s,fill,cls="")=>(
    <g className={cls+anim} transform={`translate(${x} ${y}) scale(${s})`}>
      <path d="M10 40 Q0 40 0 30 Q0 20 12 20 Q14 6 30 6 Q44 6 48 18 Q62 16 64 30 Q66 40 54 40 Z" fill={fill}/>
    </g>
  );
  return (
    <svg viewBox="0 0 100 100" width={size} height={size} aria-hidden="true" style={{overflow:"visible"}}>
      {kind==="clear" && sun(50,48,20)}
      {kind==="sunny" && <>{sun(40,40,17)}{cloud(34,46,0.9,"#E9EEF3","v-drift")}</>}
      {kind==="cloudy" && <>{cloud(8,22,0.95,"#D9E0E8","v-drift")}{cloud(30,40,1.05,"#C8D1DC","v-drift2")}</>}
      {(kind==="rain"||kind==="storm") && <>
        {cloud(14,18,1.1,kind==="storm"?"#9AA6B6":"#B9C3CF","v-drift")}
        {[24,38,52,66].map((x,i)=><line key={x} className={"v-drop"+anim} style={{animationDelay:`${i*.25}s`}} x1={x} y1="66" x2={x-4} y2="78" stroke="#7FA0C2" strokeWidth="3.5" strokeLinecap="round"/>)}
        {kind==="storm" && <path className={"v-flash"+anim} d="M52 58 L44 74 L52 74 L46 90 L62 70 L54 70 L60 58 Z" fill="#F7C65A"/>}
      </>}
    </svg>
  );
}

function MoodWeather({score, events, onCheckin, className=""}){
  const w = weatherFor(score);
  const recent = events.slice(-6);
  let trend = null;
  if(recent.length>=2){
    const a = recent[recent.length-2].assessment.score, b = recent[recent.length-1].assessment.score;
    trend = b > a+4 ? "A little heavier than your last check-in." : b < a-4 ? "A little lighter than your last check-in." : "About the same as your last check-in.";
  }
  return (
    <Card className={`p-5 ${className}`}>
      <div className="text-sm font-semibold text-black/60">Your inner weather</div>
      {events.length ? (
        <>
          <div className="mt-2 flex items-center gap-4">
            <WeatherArt kind={w.key}/>
            <div className="min-w-0">
              <div className="text-2xl font-bold" style={{color:"var(--v-ink)"}}>{w.name}</div>
              <p className="text-sm text-black/60 mt-0.5">{w.line}</p>
              {trend && <p className="text-xs text-black/45 mt-1">{trend}</p>}
            </div>
          </div>
          {recent.length>1 && (
            <div className="mt-4">
              <div className="text-xs text-black/40 mb-1.5">Your last {recent.length} check-ins</div>
              <div className="flex gap-1.5 sm:gap-3 flex-wrap">
                {recent.map(e=>(
                  <div key={e.id} className="flex flex-col items-center rounded-xl bg-[#F6F3EC] px-1.5 py-1" title={weatherFor(e.assessment.score).name}>
                    <WeatherArt kind={weatherFor(e.assessment.score).key} size={34} still/>
                    <span className="text-[10px] text-black/45">{relativeTime(e.created_at)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      ) : (
        <div className="mt-3 flex items-center gap-4">
          <WeatherArt kind="sunny" size={72}/>
          <div>
            <p className="text-sm text-black/60">Check in once and your weather will appear here.</p>
            <button onClick={onCheckin} className="mt-2 text-sm font-semibold" style={{color:"var(--v-green-d)"}}>Start a check-in →</button>
          </div>
        </div>
      )}
    </Card>
  );
}

/* ---------- Small on-device stores ---------- */
// The joy jar and tiny wins are personal and stay on this device: nothing here is sent to the
// server or seen by staff. Storage can be unavailable (private mode), so every access is guarded.
function readLocal(key, fallback){ try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function writeLocal(key, value){ try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
function todayKey(){ const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }

function Confetti({show}){
  if(!show || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return null;
  const colors = ["#A8D5B0","#BDB2EA","#F6C6A6","#F7C65A","#A9CDEB","#EBB0A6"];
  return (
    <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
      {Array.from({length:26},(_,i)=>(
        <span key={i} className="v-confetti" style={{left:`${(i*37)%100}%`, background:colors[i%colors.length],
          animationDelay:`${(i%9)*0.06}s`, transform:`rotate(${i*29}deg)`, width:i%3?7:10, height:i%2?10:6}}/>
      ))}
    </div>
  );
}

/* ---------- Tiny win: one small, doable step a day ---------- */
const TINY_WINS = [
  "Drink a full glass of water", "Step outside or open a window for two minutes", "Stretch your arms and shoulders slowly",
  "Send a message to someone you trust", "Wash your face with cool water", "Eat something small and nourishing",
  "Listen to one song you like", "Write down one thing you managed today", "Tidy one small corner",
  "Take five slow breaths", "Look at the sky for one minute", "Press your feet into the floor and notice them",
  "Make yourself a cup of tea", "Say one kind thing to yourself",
];
function TinyWin({className=""}){
  const dayIndex = Math.floor(Date.now()/86400000);
  const [offset,setOffset] = useState(0);
  const [done,setDone] = useState(()=>readLocal("raahat.win."+todayKey(), null));
  const [party,setParty] = useState(false);
  const task = TINY_WINS[(dayIndex+offset) % TINY_WINS.length];
  function complete(){
    writeLocal("raahat.win."+todayKey(), task);
    setDone(task); setParty(true); setTimeout(()=>setParty(false), 1800);
  }
  return (
    <Card className={`p-5 relative overflow-hidden ${className}`}>
      <Confetti show={party}/>
      <div className="text-sm font-semibold text-black/60">Today's tiny win</div>
      {done ? (
        <div className="mt-3 flex items-center gap-3 fade-in">
          <SaathiAvatar mood="great" size={56}/>
          <div>
            <div className="font-bold" style={{color:"var(--v-ink)"}}>You did it.</div>
            <p className="text-sm text-black/55">“{done}”. Small steps count. See you tomorrow.</p>
          </div>
        </div>
      ) : (
        <>
          <p key={task} className="mt-3 text-lg font-semibold leading-snug fade-in" style={{color:"var(--v-ink)"}}>{task}</p>
          <p className="text-xs text-black/45 mt-1">About two minutes. Only if it feels okay.</p>
          <div className="mt-4 flex flex-wrap gap-2">
            <button onClick={complete} className="px-4 py-2 rounded-xl text-white text-sm font-semibold" style={{background:"var(--v-green)"}}>I did it</button>

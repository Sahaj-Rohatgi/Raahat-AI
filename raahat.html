/* ---------- Soothing sounds, synthesised with Web Audio (no audio files) ---------- */
function noiseBuffer(ctx, color){
  const length = ctx.sampleRate * 4, buffer = ctx.createBuffer(1, length, ctx.sampleRate), data = buffer.getChannelData(0);
  let last = 0, b0=0, b1=0, b2=0;
  for(let i=0;i<length;i++){
    const white = Math.random()*2-1;
    if(color==="brown"){ last = (last + 0.02*white)/1.02; data[i] = last*3.5; }
    else { b0 = 0.99765*b0 + white*0.0990460; b1 = 0.96300*b1 + white*0.2965164; b2 = 0.57000*b2 + white*1.0526913; data[i] = (b0+b1+b2+white*0.1848)*0.11; }
  }
  return buffer;
}
const SOUNDS = [
  {k:"rain", label:"Rain", hint:"Soft, steady rainfall"},
  {k:"sea", label:"Sea", hint:"Slow waves rolling in"},
  {k:"forest", label:"Forest", hint:"Light wind and birdsong"},
];
function SoundMixer(){
  const ctxRef = useRef(null), nodes = useRef({});
  const [playing,setPlaying] = useState({});
  const [vol,setVol] = useState({rain:.6, sea:.6, forest:.5});
  useEffect(()=>()=>{ Object.keys(nodes.current).forEach(stop); if(ctxRef.current) ctxRef.current.close(); },[]);
  function ctx(){ if(!ctxRef.current) ctxRef.current = new (window.AudioContext||window.webkitAudioContext)(); return ctxRef.current; }
  function start(k){
    const c = ctx(); c.resume();
    const out = c.createGain(); out.gain.value = vol[k]*0.6; out.connect(c.destination);
    const src = c.createBufferSource(); src.buffer = noiseBuffer(c, k==="rain"?"pink":"brown"); src.loop = true;
    const parts = {out, src, timers:[]};
    if(k==="rain"){
      const hp = c.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=500;
      const lp = c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=7000;
      src.connect(hp); hp.connect(lp); lp.connect(out);
    } else if(k==="sea"){
      const lp = c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=700;
      const swell = c.createGain(); swell.gain.value = .5;
      const lfo = c.createOscillator(); lfo.frequency.value = .09; const depth = c.createGain(); depth.gain.value = .45;
      lfo.connect(depth); depth.connect(swell.gain); lfo.start(); parts.lfo = lfo;
      src.connect(lp); lp.connect(swell); swell.connect(out);
    } else {
      const lp = c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=400;
      const wind = c.createGain(); wind.gain.value = .35; src.connect(lp); lp.connect(wind); wind.connect(out);
      const chirp = () => {
        const t = c.currentTime, n = 2 + Math.floor(Math.random()*3), base = 2600 + Math.random()*1400;
        for(let i=0;i<n;i++){
          const o = c.createOscillator(), g = c.createGain(), at = t + i*0.13;
          o.type = "sine"; o.frequency.setValueAtTime(base, at); o.frequency.exponentialRampToValueAtTime(base*1.4, at+0.08);
          g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.12, at+0.02); g.gain.exponentialRampToValueAtTime(0.0001, at+0.1);
          o.connect(g); g.connect(out); o.start(at); o.stop(at+0.12);
        }
        parts.timers.push(setTimeout(chirp, 1800 + Math.random()*4200));
      };
      parts.timers.push(setTimeout(chirp, 600));
    }
    src.start();
    nodes.current[k] = parts;
  }
  function stop(k){
    const p = nodes.current[k]; if(!p) return;
    p.timers.forEach(clearTimeout);
    try { p.src.stop(); p.lfo && p.lfo.stop(); p.out.disconnect(); } catch {}
    delete nodes.current[k];
  }
  function toggle(k){
    if(playing[k]) stop(k); else start(k);
    setPlaying(p=>({...p,[k]:!p[k]}));
  }
  function changeVol(k,v){
    setVol(o=>({...o,[k]:v}));
    const p = nodes.current[k]; if(p) p.out.gain.value = v*0.6;
  }
  return (
    <Card className="p-5 fade-in">
      <div className="font-bold" style={{color:"var(--v-ink)"}}>Soothing sounds</div>
      <p className="text-sm text-black/55">Mix as many as you like. Use headphones if others are nearby.</p>
      <div className="mt-4 grid sm:grid-cols-3 gap-3">
        {SOUNDS.map(s=>(
          <div key={s.k} className={`rounded-2xl p-4 border ${playing[s.k]?"border-[#6E8F71] bg-[#EEF5EF]":"border-black/5 bg-[#F8F6F1]"}`}>
            <div className="flex items-center justify-between gap-2">
              <div>
                <div className="font-semibold" style={{color:"var(--v-ink)"}}>{s.label}</div>
                <div className="text-xs text-black/45">{s.hint}</div>
              </div>
              <button onClick={()=>toggle(s.k)} aria-pressed={!!playing[s.k]} aria-label={(playing[s.k]?"Stop ":"Play ")+s.label}
                className="w-11 h-11 rounded-full flex items-center justify-center text-white shrink-0" style={{background:"var(--v-green)"}}>
                {playing[s.k] ? <span className="flex gap-[3px]"><span className="w-[3px] h-3.5 bg-white rounded v-eq"/><span className="w-[3px] h-3.5 bg-white rounded v-eq" style={{animationDelay:".2s"}}/><span className="w-[3px] h-3.5 bg-white rounded v-eq" style={{animationDelay:".4s"}}/></span> : <Icon name="volume" size={17}/>}
              </button>
            </div>
            <label htmlFor={"vol-"+s.k} className="sr-only">{s.label} volume</label>
            <input id={"vol-"+s.k} type="range" min="0" max="1" step="0.05" value={vol[s.k]} onChange={e=>changeVol(s.k, +e.target.value)} className="mt-3 w-full accent-[#6E8F71]"/>
          </div>
        ))}
      </div>
    </Card>
  );
}

// Below md the sidebars are hidden, which previously left phone users with no navigation at

        {nav.map(([id,label,icon])=>(
          <button key={id} onClick={()=>onSelect(id)} aria-current={current===id?"page":undefined}
                  className={`${base} ${current===id? "bg-white shadow-sm":"text-black/50"}`}
                  style={current===id?{color:"var(--v-green-d)"}:{}}>
            <Icon name={icon} size={15}/> {label}

        ))}
        {onLogout && <button onClick={onLogout} className={`${base} text-black/50`}><Icon name="logout" size={15}/> Sign out</button>}

  }
  return (
    <nav aria-label="Main" className="md:hidden flex gap-1.5 overflow-x-auto px-4 py-2.5 bg-white border-b border-slate-200">
      {nav.map(([id,label,icon])=>(

          <Icon name={icon} size={14}/> {label}

    </nav>
  );
}

  const [answers,setAnswers] = useState(prefillMood ? {mood:prefillMood} : {});
  const steps = [
    {key:"mood", q:"How have you been feeling emotionally?", opts:["Good","Okay","Low","Struggling"]},
    {key:"sleep", q:"How has your sleep been recently?", opts:["Restful","A little disturbed","Poor","Very poor"]},
    {key:"unsafe", q:"Have you felt unsafe or threatened recently?", opts:["No","A little","Yes"]},
    {key:"anxiety", q:"Have you experienced increased anxiety, fear or stress?", opts:["Not really","Somewhat","Yes, noticeably"]},
    {key:"case", q:"Has anything related to your case, court hearings or investigation been worrying you?", opts:["No","A little","Yes, a lot"]},
    {key:"support", q:"Do you need any support right now?", opts:["Counselling","Medical Support","Witness Protection","Legal Assistance","Financial Assistance","Relocation Support","Rehabilitation Support","I'm okay for now"], multi:true},
  ];
  const done = step>=steps.length;

  function choose(val){
    const key = steps[step].key;
    setAnswers(a=>{
      if(steps[step].multi){
        const cur = a[key]||[];
        const nextArr = cur.includes(val)? cur.filter(x=>x!==val): [...cur,val];
        return {...a,[key]:nextArr};
      }
      return {...a,[key]:val};
    });
  }
  function next(){
    if(step<steps.length-1) setStep(step+1);
    else finish();
  }
  async function finish(){
    const maps = {mood:{"Good":0,"Okay":1,"Low":2,"Struggling":3},sleep:{"Restful":0,"A little disturbed":1,"Poor":2,"Very poor":3},unsafe:{"No":0,"A little":1,"Yes":2},anxiety:{"Not really":0,"Somewhat":1,"Yes, noticeably":2},case:{"No":0,"A little":1,"Yes, a lot":3}};
    try {
      const assessment = await api("/api/checkins", {mood:maps.mood[answers.mood],sleep:maps.sleep[answers.sleep],safety:maps.unsafe[answers.unsafe],anxiety:maps.anxiety[answers.anxiety],case_pressure:maps.case[answers.case],support:answers.support||[]});
      applyAssessment(assessment);
      setCheckins(c=>[{id:Date.now(),date:"Today",summary:`Guided check-in completed · ${assessment.risk_band} assessment.`},...c]);
      setStep(steps.length);
    } catch { toast("Unable to save your check-in. Please try again.","error"); }
  }

  if(done){
    return (
      <div className="max-w-lg mx-auto text-center py-20 fade-in">
        <div className="w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-5" style={{background:"#EAF3EA",color:"var(--v-green)"}}><Icon name="check" size={28}/></div>
        <h2 className="text-2xl font-bold mb-2" style={{color:"var(--v-ink)"}}>Thank you for checking in.</h2>
        <p className="text-black/55 mb-8">Your wellbeing update has been securely recorded and shared with your care team.</p>
        <button onClick={()=>go("home")} className="px-5 py-3 rounded-xl text-white font-semibold" style={{background:"var(--v-green)"}}>Back to Home</button>
      </div>
    );
  }

  const s = steps[step];
  const selected = answers[s.key];
  return (
    <div className="max-w-xl mx-auto fade-in">
      <div className="mb-6">
        <div className="flex items-center gap-1.5 mb-2">
          {steps.map((_,i)=>(<div key={i} className="h-1.5 flex-1 rounded-full" style={{background: i<=step? "var(--v-green)":"#E7E2D6"}}></div>))}
        </div>
        <div className="text-xs text-black/40">Step {step+1} of {steps.length}</div>
      </div>
      <Card className="p-7">
        <h2 className="text-xl font-semibold mb-6" style={{color:"var(--v-ink)"}}>{s.q}</h2>
        <div className="flex flex-col gap-2.5 mb-6">
          {s.opts.map(o=>{
            const isSel = s.multi? (selected||[]).includes(o) : selected===o;
            return (
              <button key={o} onClick={()=>choose(o)} className={`text-left px-4 py-3 rounded-xl border transition font-medium text-sm ${isSel? "border-transparent text-white":"border-black/10 text-black/65 hover:bg-black/[0.03]"}`} style={isSel?{background:"var(--v-green)"}:{}}>
                {o}
              </button>
            );
          })}
        </div>
        <div className="flex justify-between">
          <button disabled={step===0} onClick={()=>setStep(step-1)} className="px-4 py-2 text-sm font-medium text-black/40 disabled:opacity-30">Back</button>
          <button onClick={next} disabled={!selected || (s.multi && selected.length===0)} className="px-5 py-2.5 rounded-xl text-white font-semibold disabled:opacity-30" style={{background:"var(--v-green)"}}>{step===steps.length-1? "Submit":"Next"}</button>
        </div>
      </Card>
    </div>
  );
}

function ChatbotWidget(){
  const [open,setOpen] = useState(false);
  const {applyAssessment, distressScore} = useApp();
  // Read-aloud is opt-in: a reply spoken through the speaker by default could be overheard by
  // the very person someone is afraid of. Refs mirror the state for the async send paths.
  const [autoVoice,setAutoVoice] = useState(false);
  const [voiceGender,setVoiceGender] = useState("female");
  const [showCalm,setShowCalm] = useState(false);
  const [calmBannerDismissed,setCalmBannerDismissed] = useState(false);
  const autoVoiceRef = useRef(false), voiceGenderRef = useRef("female");
  const toast = useToast();
  const [messages,setMessages] = useState([
    {from:"bot",text:"Hi Asha. I'm here to check in with you. How have you been feeling lately?"},
  ]);
  const [input,setInput] = useState("");
  const [emergency,setEmergency] = useState(false);
  const [sending,setSending] = useState(false);
  const [recording,setRecording] = useState(false);
  const scrollRef = useRef(null);
  const recorderRef = useRef(null), streamRef = useRef(null), recordingTimer = useRef(null);

  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; },[messages,emergency,open]);
  // recorderRef is null until the user actually records something, so this cleanup threw on
  // unmount for every session that never used a voice note — taking the whole app down to a
  // white screen on sign-out, because an error thrown during unmount unmounts the React tree.
  useEffect(()=>()=>{ clearTimeout(recordingTimer.current); if(recorderRef.current) recorderRef.current.onstop=null; streamRef.current?.getTracks().forEach(track=>track.stop()); },[]);
  useEffect(()=>{
    const openChat = () => setOpen(true);
    window.addEventListener("raahat:open-chat", openChat);
    return ()=>window.removeEventListener("raahat:open-chat", openChat);
  },[]);
  // Browsers load their voice list asynchronously; ask early so the first reply can pick one.
  useEffect(()=>{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    return ()=>{ window.speechSynthesis.onvoiceschanged = null; window.speechSynthesis.cancel(); };
  },[]);

  // Short labels so all six fit one scrollable strip; the full sentence is what gets sent,
  // because the risk classifier scores the message text, not the chip the user tapped.
  const quick = [
    ["Okay", "I feel okay"],
    ["Anxious", "I feel anxious"],
    ["Unsafe", "I feel unsafe"],
    ["Very low", "I feel very low"],
    ["Need to talk", "I need someone to talk to"],
    ["Something else", "Something else"],
  ];

  async function rateMessage(messageId, rating){
    try {
      await api("/api/chat/feedback", {message_id:messageId, rating});
      setMessages(m=>m.map(item=>item.messageId===messageId? {...item,feedback:rating}:item));
    } catch { toast("Feedback could not be saved. Please try again.","error"); }
  }

  // Speaks with the browser's own voices, preferring an Indian-English or Hindi voice of the
  // chosen gender when the device has one.
  function speak(message, forcedGender){
    if(!window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      if(window.speechSynthesis.paused) window.speechSynthesis.resume();
      const clean = (typeof message === "string" ? message : (message?.text || "")).replace(/[*_#`~]/g, "").trim();
      if(!clean) return;
      const utterance = new SpeechSynthesisUtterance(clean);
      const isHindi = message?.language === "hindi" || message?.language === "hinglish" || /[\u0900-\u097F]/.test(clean);
      utterance.lang = isHindi ? "hi-IN" : "en-IN";
      const gender = forcedGender || voiceGenderRef.current;
      utterance.rate = 0.96;
      utterance.pitch = gender === "female" ? 1.08 : 0.95;
      const voices = window.speechSynthesis.getVoices() || [];
      const langOk = v => isHindi ? (v.lang.startsWith("hi") || v.lang.includes("Hindi")) : (v.lang === "en-IN" || v.lang.startsWith("en"));
      const named = gender === "female"
        ? /(heera|neerja|swara|zira|jenny|hazel|samantha|female|kavya|kalpana|priya|aria|sonia|ayushi|veena|lekha)/i
        : /(ravi|david|mark|george|male|madhav|hemant|prabhat|rishi)/i;
      const match = voices.find(v => langOk(v) && named.test(v.name)) || voices.find(v => named.test(v.name)) || voices.find(langOk);
      if(match) utterance.voice = match;
      window.speechSynthesis.speak(utterance);
    } catch {}
  }

  async function sendVoiceNote(audio){
    if(audio.size > 5*1024*1024){ toast("Voice note is too large. Please keep it under 5 MB.","error"); return; }
    setMessages(m=>[...m,{from:"user",text:"🎙️ Voice note: transcribing…"}]); setSending(true);
    try {
      const headers = {"Content-Type":audio.type||"audio/webm","X-Voice-Consent":"yes"};
      if(AUTH_TOKEN) headers.Authorization = "Bearer "+AUTH_TOKEN;
      const response = await fetch("/api/voice",{method:"POST",headers,body:audio});
      const payload = await response.json(); if(!response.ok) throw new Error(payload.detail||"Voice transcription failed");
      setMessages(m=>[...m.slice(0,-1),
        {from:"user",text:"🎙️ "+payload.transcript,voice:{by:payload.transcribed_by,acoustic:payload.acoustic||{}}},
        {from:"bot",text:payload.assistant,messageId:payload.message_id,language:payload.language}]);
      applyAssessment(payload.assessment);
      if(autoVoiceRef.current && payload.assistant) speak({text:payload.assistant, language:payload.language});
      if(payload.urgent){ setEmergency(true); toast("Urgent support guidance is displayed below.","error"); }
    } catch(error) { setMessages(m=>m.map((item,i)=>i===m.length-1? {...item,text:"Voice note could not be transcribed. Please type your message."}:item)); }
    finally { setSending(false); }
  }

  async function startRecording(){
    if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){ toast("Voice notes are not supported by this browser.","error"); return; }
    if(!window.confirm("Your voice note is transcribed on Raahat's own server. Only if that is unavailable is it sent to Gemini instead. The recording is not stored; its transcript is saved in this chat.")) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      const mimeType = ["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(MediaRecorder.isTypeSupported);
      const chunks = [], recorder = mimeType ? new MediaRecorder(stream,{mimeType}) : new MediaRecorder(stream);
      streamRef.current=stream; recorderRef.current=recorder;
      recorder.ondataavailable=e=>{if(e.data.size) chunks.push(e.data);};
      recorder.onstop=()=>{ clearTimeout(recordingTimer.current); stream.getTracks().forEach(track=>track.stop()); setRecording(false); sendVoiceNote(new Blob(chunks,{type:recorder.mimeType||"audio/webm"})); };
      recorder.start(); setRecording(true);
      recordingTimer.current=setTimeout(()=>{if(recorder.state==="recording") recorder.stop();},45000);
    } catch { toast("Microphone access could not be started.","error"); }
  }

  function toggleRecording(){
    if(recording){ clearTimeout(recordingTimer.current); recorderRef.current?.stop(); }
    else startRecording();
  }

  async function send(text){
    if(!text.trim() || sending) return;
    setMessages(m=>[...m,{from:"user",text}]);
    setInput("");
    setSending(true);
    try {
      const headers = {"Content-Type":"application/json"};
      if(AUTH_TOKEN) headers.Authorization = "Bearer "+AUTH_TOKEN;
      const response = await fetch("/api/chat/stream", {method:"POST", headers, body:JSON.stringify({message:text})});
      if(!response.ok || !response.body) throw new Error("Streaming request failed");
      setMessages(m=>[...m,{from:"bot",text:"",streaming:true}]);
      const reader = response.body.getReader(), decoder = new TextDecoder();
      let buffer = "", fullText = "";
      while(true){
        const {done,value} = await reader.read();
        if(done) break;
        buffer += decoder.decode(value,{stream:true});
        const frames = buffer.split("\n\n"); buffer = frames.pop();
        frames.forEach(frame=>{
          const event = (frame.match(/^event: (.+)$/m)||[,"message"])[1];
          const data = (frame.match(/^data: (.+)$/m)||[,""])[1];
          if(!data) return;
          const payload = JSON.parse(data);
          if(event==="meta"){
            setMessages(m=>m.map((item,i)=>i===m.length-1? {...item,streaming:false,messageId:payload.message_id,language:payload.language}:item));
            applyAssessment(payload.assessment);
            if(payload.urgent){ setEmergency(true); toast("Urgent support guidance is displayed below.","error"); }
          } else if(payload.delta){
            fullText += payload.delta;
            setMessages(m=>m.map((item,i)=>i===m.length-1? {...item,text:fullText}:item));
          }
        });
      }
      if(autoVoiceRef.current && fullText) speak({text:fullText});
    } catch { setMessages(m=>[...m,{from:"bot",text:"I could not reach the support service. If you are in immediate danger, contact local emergency services now."}]); }
    finally { setSending(false); }
  }

  return (
    <>
      <button onClick={()=>setOpen(o=>!o)} className="fixed bottom-6 right-6 z-[120] w-16 h-16 rounded-full text-white shadow-2xl flex items-center justify-center pulse focus-ring" style={{background:"var(--v-green)"}} aria-label="Open support assistant">
        {open? <Icon name="x" size={24}/> : <Icon name="message" size={24}/>}
      </button>
      {open && (
        <div className="fixed bottom-28 right-6 z-[119] w-[380px] max-w-[92vw] h-[560px] max-h-[75vh] bg-white rounded-2xl shadow-2xl border border-black/5 flex flex-col slide-in-right overflow-hidden">
          <div className="px-4 py-3 text-white flex items-center justify-between gap-2" style={{background:"var(--v-green)"}}>
            <div className="flex items-center gap-2.5 min-w-0">
              <Logo size={34}/>
              <div className="truncate">
                <div className="font-semibold text-sm leading-tight">Raahat Assistant</div>
                <div className="text-[11px] text-white/80 leading-tight">Care-team monitored</div>
              </div>
            </div>
            <div className="flex items-center gap-1.5 shrink-0">
              <button onClick={()=>{
                  const next = voiceGender === "female" ? "male" : "female";
                  setVoiceGender(next); voiceGenderRef.current = next;
                  toast(next === "female" ? "Female voice selected" : "Male voice selected");
                  if(autoVoiceRef.current) speak({text:`${next} voice`}, next);
                }}
                title="Switch between a female and a male reading voice"
                className="px-2 py-1 rounded-full text-xs bg-white/20 hover:bg-white/30 border border-white/10 font-medium transition">
                {voiceGender === "female" ? "👩 Female" : "👨 Male"}
              </button>
              <button onClick={()=>{
                  const next = !autoVoice;
                  setAutoVoice(next); autoVoiceRef.current = next;
                  if(!next && window.speechSynthesis) window.speechSynthesis.cancel();
                  toast(next ? "Replies will be read aloud" : "Read-aloud off");
                }}
                aria-pressed={autoVoice}
                title={autoVoice ? "Replies are read aloud. Click to turn off." : "Read replies aloud. Check no one can overhear first."}
                className={`px-2 py-1 rounded-full text-xs flex items-center gap-1 transition ${autoVoice ? "bg-white text-emerald-800 font-semibold shadow-sm" : "bg-white/20 text-white/85 hover:bg-white/30"}`}>
                <Icon name={autoVoice ? "volume" : "mute"} size={13}/> {autoVoice ? "Aloud" : "Silent"}
              </button>
            </div>
          </div>
          {(emergency || distressScore >= 60) && !calmBannerDismissed && (
            <div className="bg-emerald-50 border-b border-emerald-200 px-3 py-2 flex items-center justify-between gap-2 shrink-0 fade-in">
              <div className="text-[11px] text-emerald-950 truncate">🌿 <span className="font-bold">Things feel heavy right now.</span> A one-minute calm space is here.</div>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={()=>setShowCalm(true)} className="px-2.5 py-1 rounded-md bg-emerald-700 hover:bg-emerald-800 text-white text-[11px] font-semibold transition">Open</button>
                <button onClick={()=>setCalmBannerDismissed(true)} aria-label="Dismiss" className="text-emerald-800 px-1 text-xs">✕</button>
              </div>
            </div>
          )}
          <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-4 space-y-3 bg-[#FAF6EF]">
            {messages.map((m,i)=>(
              <div key={m.id ?? `msg-${i}`} className={`flex flex-col ${m.from==="user"?"items-end":"items-start"}`}>
                <div className={`max-w-[80%] px-3.5 py-2.5 rounded-2xl text-sm leading-relaxed ${m.from==="user"? "bg-slate-800 text-white rounded-br-sm":"bg-white border border-black/5 text-black/70 rounded-bl-sm"}`}>{m.text}{m.streaming && <span className="animate-pulse">|</span>}</div>
                {m.voice && (
                  <div className="mt-1 max-w-[80%] text-[10px] text-black/45 text-right leading-snug">
                    {m.voice.by === "local" ? "Transcribed on Raahat's server" : "Transcribed by Gemini"}
                    {(m.voice.acoustic.indicators||[]).length > 0 && <> · Voice signals (experimental, not scored): {m.voice.acoustic.indicators.join(", ").toLowerCase()}</>}
                  </div>
                )}
                {m.from==="bot" && m.messageId && !m.streaming && <div className="flex gap-1 mt-1">
                  <button onClick={()=>speak(m)} aria-label="Listen to reply" title="Listen to reply" className="text-xs px-1.5 py-0.5 rounded hover:bg-black/5"><Icon name="volume" size={13}/></button>
                  <button onClick={()=>rateMessage(m.messageId,"helpful")} aria-label="Helpful" title="Helpful" className={`text-xs px-1.5 py-0.5 rounded ${m.feedback==="helpful"?"bg-emerald-100":"hover:bg-black/5"}`}>👍</button>
                  <button onClick={()=>rateMessage(m.messageId,"not_helpful")} aria-label="Not helpful" title="Not helpful" className={`text-xs px-1.5 py-0.5 rounded ${m.feedback==="not_helpful"?"bg-rose-100":"hover:bg-black/5"}`}>👎</button>
                </div>}
              </div>
            ))}
            {emergency && <EmergencyCard onOpenCalm={()=>setShowCalm(true)}/>}
          </div>
          {!emergency && (
            <div className="border-t border-black/5 px-3 py-2.5 bg-white">
              <div className="chip-row mb-2.5">
                {quick.map(([label,text])=>(<button key={label} disabled={sending} onClick={()=>send(text)} className="chip focus-ring" title={text}>{label}</button>))}
              </div>
              <div className="flex items-center gap-2">
                <input disabled={sending} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") send(input);}} placeholder="You can type here…" className="flex-1 px-3.5 py-2 rounded-full border border-black/10 text-sm focus-ring"/>
                <button onClick={()=>setShowCalm(true)} aria-label="Open calm space" title="Calm space: breathing, words of comfort, bubble popper" className="w-9 h-9 rounded-full flex items-center justify-center shrink-0 border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 transition"><span className="text-sm">🌿</span></button>
                <button disabled={sending} onClick={toggleRecording} aria-label={recording?"Stop voice note":"Record voice note"} title={recording?"Stop voice note":"Record voice note"} className={`w-9 h-9 rounded-full flex items-center justify-center shrink-0 border border-black/10 ${recording?"text-white bg-red-600":"text-black/60"}`}><Icon name={recording?"x":"mic"} size={15}/></button>
                <button disabled={sending} onClick={()=>send(input)} className="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-white disabled:opacity-40" style={{background:"var(--v-green)"}}><Icon name="send" size={15}/></button>
              </div>
            </div>
          )}
        </div>
      )}
      {showCalm && <CalmOasisModal onClose={()=>setShowCalm(false)} speak={speak}/>}
    </>
  );
}

  return (
    <div className="bg-white border-2 rounded-2xl p-4 fade-in" style={{borderColor:"var(--high)"}}>
      <div className="flex items-center gap-2 mb-2" style={{color:"var(--high)"}}><Icon name="alert" size={18}/><span className="font-semibold text-sm">Your message indicates that you may need immediate support.</span></div>
      <p className="text-xs text-black/55 mb-3">This demo cannot call or notify anyone. Use local emergency services or a trusted person if immediate help is needed.</p>
      <div className="grid grid-cols-2 gap-2 mb-2.5">
        <button onClick={()=>toast("Contact your assigned counsellor through the official channel.")} className="text-xs font-semibold py-2 rounded-lg text-white" style={{background:"var(--v-green)"}}>Counsellor guidance</button>
        <button onClick={()=>toast("Contact local emergency services if there is immediate danger.","error")} className="text-xs font-semibold py-2 rounded-lg text-white" style={{background:"var(--high)"}}>Emergency guidance</button>
        <button onClick={()=>toast("Ask an authorised officer about a protection request.")} className="text-xs font-semibold py-2 rounded-lg border border-black/10 text-black/60">Protection guidance</button>
        <button onClick={()=>toast("Contact a trusted person directly if it is safe to do so.")} className="text-xs font-semibold py-2 rounded-lg border border-black/10 text-black/60">Trusted-person guidance</button>
      </div>
      <button onClick={onOpenCalm} className="w-full text-xs font-semibold py-2.5 rounded-xl text-white bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 flex items-center justify-center gap-1.5 shadow-sm transition">
        🌿 Open calm space (breathing, words of comfort, bubble popper)
      </button>
    </div>
  );
}

      trans: "Elevate yourself through the power of your own mind; do not let your spirit sink. For the mind can be your greatest friend and sanctuary.",

    },
    {
      source: "Bhagavad Gita 2.70",
      verse: "आपूर्यमाणमचलप्रतिष्ठं समुद्रमापः प्रविशन्ति यद्वत्। तद्वत्कामा यं प्रविशन्ति सर्वे स शान्तिमाप्नोति न कामकामी॥",
      trans: "Just as the ocean remains deep, vast, and undisturbed though rivers rush into it, one who remains anchored within achieves true tranquility.",
      insight: "You do not have to fight the waves. Ground yourself in the present; peace will settle in.",

      trans: "You have power over your actions in this exact moment, never over external outcomes. Release future worries; take just this one safe breath right now.",

  // 4-7-8 Breathing Loop
  useEffect(()=>{

  function playPopSound(){
    try {

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(540, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.14);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch(e){}
  }

          <button onClick={()=>setTab("breathe")} className={`pb-2.5 px-3 border-b-2 flex items-center gap-1.5 shrink-0 transition ${tab==="breathe"?"border-emerald-700 text-emerald-800 font-bold":"border-transparent text-slate-500 hover:text-slate-800"}`}>
            <span>🫁</span><span>4-7-8 Breathing</span>
          </button>
          <button onClick={()=>setTab("wisdom")} className={`pb-2.5 px-3 border-b-2 flex items-center gap-1.5 shrink-0 transition ${tab==="wisdom"?"border-emerald-700 text-emerald-800 font-bold":"border-transparent text-slate-500 hover:text-slate-800"}`}>
            <span>🪷</span><span>Gita & Universal Wisdom</span>
          </button>
          <button onClick={()=>setTab("zen")} className={`pb-2.5 px-3 border-b-2 flex items-center gap-1.5 shrink-0 transition ${tab==="zen"?"border-emerald-700 text-emerald-800 font-bold":"border-transparent text-slate-500 hover:text-slate-800"}`}>
            <span>🫧</span><span>Zen Bubble Popper</span>
          </button>
        </div>

        {/* Content Body */}
        <div className="flex-1 overflow-y-auto p-4 sm:p-5 bg-[#FAF6EF]">
          {tab === "breathe" && (
            <div className="flex flex-col items-center justify-center py-2 text-center">
              <span className="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 mb-1.5">
                Slow-breathing exercise
              </span>
              <h4 className="text-base sm:text-lg font-bold text-slate-800">4-7-8 Breath Pacer</h4>
              <p className="text-xs text-slate-600 max-w-sm mb-4">

                    {breathePhase === "Inhale" ? "Breathe in peace" : breathePhase === "Hold" ? "Rest in stillness" : "Release tension"}

                </div>
              </div>

              <div className="mt-4 flex items-center gap-3">
                <span className="text-xs font-medium text-slate-600">

                </span>
                <button
                  onClick={()=>setBreatheActive(a=>!a)}
                  className="px-3 py-1 rounded-full text-xs font-semibold border border-slate-300 text-slate-700 hover:bg-white transition"
                >
                  {breatheActive ? "⏸ Pause Pacer" : "▶ Resume Pacer"}
                </button>
              </div>
            </div>
          )}

          {tab === "wisdom" && (
            <div className="flex flex-col items-center justify-center py-1 text-center max-w-lg mx-auto">
              <span className="text-xs font-semibold px-3 py-1 rounded-full bg-amber-100 text-amber-800 mb-2">
                {currentQuote.source}

/* ============================== PULSE SENSOR ============================== */
// Camera photoplethysmography: every heartbeat pushes a little more blood into the skin,
// which changes how much light it reflects. A fingertip held over the camera turns the frame
// red and the red channel rises and falls with the pulse; a face in front of a webcam shows
// the same thing far more faintly in the green channel. Frames are reduced to one number
// each, in the page — no image ever leaves the device.
//
// The rate is read from the frequency spectrum of the last ~10 s of that signal. How much
// of the power sits on that one rhythm doubles as a quality score, so a covered lens, a
// moving hand or a dark room reads as "no steady signal" rather than as a confident wrong
// number. This is a wellness estimate, never a medical reading.
const PULSE_FS = 30;
const PULSE_WINDOW_MS = 10000;
const PULSE_MIN_QUALITY = 0.3;
const PULSE_MAX_RMS = 6;

function estimatePulse(samples){
  if(samples.length < 60) return null;
  const t0 = samples[0].t, t1 = samples[samples.length-1].t;
  if(t1 - t0 < 6000) return null;
  // Frames arrive unevenly, so resample onto a fixed 30 Hz grid first.
  const n = Math.floor((t1 - t0) / 1000 * PULSE_FS);
  const u = new Float64Array(n);
  let j = 0;
  for(let i=0; i<n; i++){
    const t = t0 + i * 1000 / PULSE_FS;
    while(j < samples.length - 2 && samples[j+1].t < t) j++;
    const a = samples[j], b = samples[j+1];
    const f = b.t === a.t ? 0 : clamp((t - a.t) / (b.t - a.t), 0, 1);
    u[i] = a.v + (b.v - a.v) * f;
  }
  // Remove slow drift (lighting, pressure of the finger): subtract a 1-second moving average.
  const trend = new Float64Array(n);
  for(let i=0; i<n; i++){
    let sum = 0, count = 0;
    for(let k=Math.max(0, i-15); k<=Math.min(n-1, i+15); k++){ sum += u[k]; count++; }
    trend[i] = sum / count;
  }
  const x = u.map((v,i)=>v - trend[i]);
  let mean = 0; for(const v of x) mean += v; mean /= n;
  let energy = 0; for(let i=0; i<n; i++){ x[i] -= mean; energy += x[i]*x[i]; }
  // Blood volume moves skin colour by a few levels out of 255 at most. A swing far larger
  // than that is the hand moving, the scene changing or a flickering screen — periodic
  // enough to look like a rhythm, but not a pulse.
  const rms = Math.sqrt(energy / n);
  if(rms < 0.02 || rms > PULSE_MAX_RMS) return null;
  // Power spectrum on a 0.5 bpm grid (a direct DFT: ~300 samples, cheap at 2 Hz).
  const windowed = x.map((v,i)=>v * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1))));
  const power = {};
  const powerAt = bpm => {
    if(power[bpm] !== undefined) return power[bpm];
    const w = 2 * Math.PI * bpm / 60 / PULSE_FS;
    let re = 0, im = 0;
    for(let i=0; i<n; i++){ re += windowed[i] * Math.cos(w * i); im += windowed[i] * Math.sin(w * i); }
    return power[bpm] = re*re + im*im;
  };
  // Harmonic sum: a pulse wave has energy at its rate and at twice it. Scoring each candidate
  // by both picks the true rate rather than half or double it — the classic failure of a plain
  // peak search, and one that would hide exactly the fast, stressed heart rates that matter.
  let bestBpm = 0, bestScore = -1;
  const score = bpm => powerAt(bpm) + 0.5 * powerAt(bpm * 2);
  for(let bpm=42; bpm<=180; bpm+=0.5){
    const sc = score(bpm);
    if(sc > bestScore){ bestScore = sc; bestBpm = bpm; }
  }
  if(!bestBpm) return null;
  const a = score(bestBpm - 0.5), b = bestScore, c = score(bestBpm + 0.5);
  const denom = a - 2*b + c;
  const refined = denom ? bestBpm + 0.25 * (a - c) / denom : bestBpm;
  // Quality: the share of in-band power that sits on that rate and its harmonic. Noise spreads
  // evenly and scores low; a clean pulse concentrates almost everything there.
  let band = 0, onPulse = 0;
  for(let bpm=36; bpm<=360; bpm+=0.5){
    const pw = powerAt(bpm); band += pw;
    if(Math.abs(bpm - bestBpm) <= 4 || Math.abs(bpm - 2 * bestBpm) <= 4) onPulse += pw;
  }
  const quality = band ? onPulse / band : 0;
  const tail = Array.from(x.slice(-PULSE_FS * 4));
  const peak = Math.max(...tail.map(Math.abs)) || 1;
  return {bpm: refined, quality: clamp(quality, 0, 1), wave: tail.map(v=>v/peak)};
}

// mode: "camera" reads the real camera; "simulated" produces a clearly labelled synthetic
// pulse that follows the rehearsal's intensity, for a demo machine without a usable camera.
// The simulation never claims to be a measurement: the UI badges it and the saved session
// records sensor="simulated".
function usePulseSensor(){
  const [reading,setReading] = useState({status:"off", bpm:null, quality:0, wave:[], source:null, error:""});
  const latest = useRef(reading);
  const stream = useRef(null), frame = useRef(0), timer = useRef(0), samples = useRef([]);
  const sim = useRef({load:0, bpm:72, phase:0});
  const smoothed = useRef(null);

  function publish(next){ latest.current = next; setReading(next); }

  function stop(){
    cancelAnimationFrame(frame.current); clearInterval(timer.current);
    if(stream.current){ stream.current.getTracks().forEach(t=>t.stop()); stream.current = null; }
    samples.current = []; smoothed.current = null;
    publish({status:"off", bpm:null, quality:0, wave:[], source:null, error:""});
  }

  function smooth(bpm){
    smoothed.current = smoothed.current == null ? bpm : smoothed.current * 0.7 + bpm * 0.3;
    return Math.round(smoothed.current);
  }

  function startSimulated(){
    stop();
    publish({status:"measuring", bpm:null, quality:0, wave:[], source:"simulated", error:""});
    let warm = 0;
    timer.current = setInterval(()=>{
      const s = sim.current;
      // Load: 0 resting … 4 hardest questions; -1 means a grounding exercise is running.
      const target = s.load < 0 ? 70 : 72 + s.load * 6 + (s.load >= 3 && Math.random() < 0.18 ? 24 : 0);
      s.bpm += (target - s.bpm) * 0.18 + (Math.random() - 0.5) * 1.6;
      const wave = Array.from({length:120}, (_,i)=>{
        const p = ((s.phase + i / PULSE_FS) * s.bpm / 60) % 1;
        return Math.exp(-Math.pow((p - 0.2) / 0.06, 2)) - 0.35 * Math.exp(-Math.pow((p - 0.45) / 0.1, 2));
      });
      s.phase += 0.5;
      warm += 1;
      publish({status:"measuring", bpm: warm < 6 ? null : Math.round(s.bpm), quality: warm < 6 ? 0 : 0.8, wave, source:"simulated", error:""});
    }, 500);
  }

  async function startCamera(){
    stop();
    if(!navigator.mediaDevices?.getUserMedia){
      publish({status:"error", bpm:null, quality:0, wave:[], source:"camera", error:"This browser cannot open the camera."});
      return false;
    }
    publish({status:"starting", bpm:null, quality:0, wave:[], source:"camera", error:""});
    try {
      const media = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:320}, height:{ideal:240}, frameRate:{ideal:30}}});
      stream.current = media;
      const track = media.getVideoTracks()[0];
      // Phones with a flash give a far stronger fingertip signal with the torch on.
      try { if(track.getCapabilities?.().torch) await track.applyConstraints({advanced:[{torch:true}]}); } catch {}
      const video = document.createElement("video");
      video.muted = true; video.playsInline = true; video.srcObject = media;
      await video.play();
      const canvas = document.createElement("canvas"); canvas.width = 40; canvas.height = 30;
      const ctx = canvas.getContext("2d", {willReadFrequently:true});
      let lastFinger = null;
      const loop = () => {
        frame.current = requestAnimationFrame(loop);
        if(video.readyState < 2) return;
        ctx.drawImage(video, 0, 0, 40, 30);
        const data = ctx.getImageData(10, 7, 20, 16).data;
        let r = 0, g = 0, b = 0;
        for(let i=0; i<data.length; i+=4){ r += data[i]; g += data[i+1]; b += data[i+2]; }
        const px = data.length / 4; r /= px; g /= px; b /= px;
        const finger = r > 40 && r > g * 2 && r > b * 2;
        if(finger !== lastFinger){ samples.current = []; smoothed.current = null; lastFinger = finger; }
        const now = performance.now();
        samples.current.push({t:now, v: finger ? r : g, finger});
        while(samples.current.length && now - samples.current[0].t > PULSE_WINDOW_MS) samples.current.shift();
      };
      loop();
      timer.current = setInterval(()=>{
        const result = estimatePulse(samples.current);
        const finger = samples.current.length ? samples.current[samples.current.length-1].finger : false;
        const source = finger ? "finger" : "face";
        if(!result || result.quality < PULSE_MIN_QUALITY){
          publish({status:"nosignal", bpm:null, quality: result?.quality || 0, wave: result?.wave || [], source, error:""});
          return;
        }
        publish({status:"measuring", bpm: smooth(result.bpm), quality: result.quality, wave: result.wave, source, error:""});
      }, 500);
      return true;
    } catch(err) {
      stop();
      const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
      publish({status:"error", bpm:null, quality:0, wave:[], source:"camera",
               error: denied ? "Camera permission was not given. You can still rehearse — you'll rate how each question felt instead." : "Could not open the camera."});
      return false;
    }
  }

  useEffect(()=>()=>{
    cancelAnimationFrame(frame.current); clearInterval(timer.current);
    if(stream.current) stream.current.getTracks().forEach(t=>t.stop());
  },[]);

  return {reading, latest, startCamera, startSimulated, stop, setLoad:(load)=>{ sim.current.load = load; }};
}

function PulseWave({wave, color="#C1694F", height=56}){
  if(!wave || wave.length < 2) return <div style={{height}} className="flex items-center justify-center text-[11px] text-black/30">waiting for signal…</div>;
  const w = 240;
  const pts = wave.map((v,i)=>`${(i/(wave.length-1))*w},${height/2 - v*(height/2 - 4)}`).join(" ");
  return <svg width="100%" viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" aria-hidden="true"><polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/></svg>;
}

function PulseMonitor({reading, baseline, compact=false}){
  const {status, bpm, wave, source} = reading;
  const elevated = baseline && bpm && bpm > baseline + Math.max(12, baseline * 0.15);
  const label = source === "simulated" ? "Simulated pulse" : source === "finger" ? "Fingertip pulse" : source === "face" ? "Face pulse" : "Pulse";
  return (
    <div className={`rounded-2xl border ${elevated ? "border-red-200 bg-red-50/60" : "border-black/5 bg-white"} ${compact ? "p-3" : "p-4"}`} aria-live="polite">
      <div className="flex items-center justify-between mb-1">
        <div className="flex items-center gap-1.5 text-xs font-semibold text-black/50"><Icon name="heart" size={13} className={bpm ? "pulse-beat" : ""}/> {label}</div>
        {source === "simulated" && <span className="text-[10px] font-bold tracking-wide px-1.5 py-0.5 rounded bg-amber-100 text-amber-800">SIMULATED</span>}
      </div>
      <div className="flex items-end gap-1.5">
        <div className={`font-extrabold tabular-nums ${compact ? "text-2xl" : "text-4xl"}`} style={{color: elevated ? "var(--high)" : "var(--v-ink)"}}>{bpm ?? "--"}</div>
        <div className="text-xs text-black/40 mb-1">bpm{baseline ? ` · resting ${baseline}` : ""}</div>
      </div>
      <PulseWave wave={wave} color={elevated ? "#DC2626" : "#C1694F"} height={compact ? 36 : 56}/>
      {status === "nosignal" && <div className="text-[11px] text-black/45 mt-1">{source === "finger" ? "Keep your fingertip still and lightly covering the lens." : "Cover the camera lens gently with a fingertip, or face the camera in good light."}</div>}
      {status === "starting" && <div className="text-[11px] text-black/45 mt-1">Opening camera…</div>}
    </div>
  );
}

// Box breathing (4-4-4-4): a dot travels round a square, one side per phase. Used here
// because it is short, needs no explanation, and slows the heart rate within a minute.
function BoxBreathing({lang}){
  const PHASES = lang === "hi" ? ["साँस लीजिए","रोकिए","साँस छोड़िए","रोकिए"] : ["Breathe in","Hold","Breathe out","Hold"];
  const CORNERS = [[0,100],[0,0],[100,0],[100,100]];
  const [step,setStep] = useState(0);
  const [left,setLeft] = useState(4);
  useEffect(()=>{
    let s = 0, remaining = 4;
    const id = setInterval(()=>{
      remaining -= 1;
      if(remaining <= 0){ s = (s + 1) % 4; remaining = 4; setStep(s); }
      setLeft(remaining);
    }, 1000);
    return ()=>clearInterval(id);
  },[]);
  const [x,y] = CORNERS[(step + 1) % 4];
  return (
    <div className="flex flex-col items-center">
      <div className="relative w-40 h-40 my-2">
        <div className="absolute inset-0 rounded-2xl border-4" style={{borderColor:"#CFE0CF"}}/>
        <div className="absolute w-5 h-5 -ml-2.5 -mt-2.5 rounded-full shadow"
             style={{left:`${x}%`, top:`${y}%`, background:"var(--v-green)", transition:"left 4s linear, top 4s linear"}}/>
        <div className="absolute inset-0 flex flex-col items-center justify-center" aria-live="polite">
          <div className="font-bold" style={{color:"var(--v-green-d)"}}>{PHASES[step]}</div>
          <div className="text-3xl font-extrabold tabular-nums" style={{color:"var(--v-ink)"}}>{left}</div>
        </div>
      </div>
    </div>
  );
}

function ReadinessRing({value, size=120}){
  const r = size/2 - 9, c = 2 * Math.PI * r;
  const color = value >= 70 ? "#4F6E53" : value >= 40 ? "#C08A1E" : "#C1694F";
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} role="img" aria-label={`Court readiness ${value} out of 100`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#EFEAE0" strokeWidth="9"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="9" strokeLinecap="round"
              strokeDasharray={c} strokeDashoffset={c * (1 - value/100)} transform={`rotate(-90 ${size/2} ${size/2})`}
              style={{transition:"stroke-dashoffset 1s ease-out"}}/>
      <text x="50%" y="50%" dy="2" textAnchor="middle" fontSize={size/4} fontWeight="800" fill="#33342E">{value}</text>
      <text x="50%" y="50%" dy={size/5.5} textAnchor="middle" fontSize="10" fill="#8A8A80">/ 100</text>
    </svg>
  );
}

function speak(text, lang){
  try {
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "hi" ? "hi-IN" : "en-IN";
    const voice = window.speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith(lang === "hi" ? "hi" : "en-in"));
    if(voice) u.voice = voice;
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  } catch {}
}

function stressThreshold(baseline){ return baseline + Math.max(12, Math.round(baseline * 0.15)); }

function VictimRehearsal(){
  const toast = useToast();
  const {refreshDashboard} = useApp();
  const pulse = usePulseSensor();
  const [phase,setPhase] = useState("intro"); // intro | setup | calibrate | levelup | question | rate | grounding | summary | urgent
  const [lang,setLang] = useState("en");
  const [answerMode,setAnswerMode] = useState("aloud");
  const [readAloud,setReadAloud] = useState(true);
  const [sensor,setSensor] = useState(null); // camera | simulated | self_report
  const [history,setHistory] = useState([]);
  const [question,setQuestion] = useState(null);
  const [typed,setTyped] = useState("");
  const [checking,setChecking] = useState(false);
  const [calibration,setCalibration] = useState({secs:0, readings:[]});
  const [grounding,setGrounding] = useState(null); // {reason, peak, secs, recoveredAt}
  const [result,setResult] = useState(null);
  const [urgentReply,setUrgentReply] = useState("");
  const [, rerender] = useState(0);
  // Mutable session state: read and written by the 1-second tick as well as by handlers, so
  // it lives in a ref rather than being split across a dozen pieces of React state.
  const S = useRef(null);
  const phaseRef = useRef(phase);
  phaseRef.current = phase;

  useEffect(()=>{ api("/api/rehearsal/sessions").then(setHistory).catch(()=>{}); },[]);
  useEffect(()=>()=>{ try { window.speechSynthesis?.cancel(); } catch {} },[]);

  function freshSession(chosen){
    return {sensor:chosen, startedAt:Date.now(), baseline:null, level:1, qIndex:0, ease:null, easeIdx:0,
            completed:[false,false,false,false,false], strained:[false,false,false,false,false],
            questions:0, spikes:0, pauses:0, peak:null, ratings:[], recoveries:[], highSecs:0,
            strainStart:null, timeline:[], lastSample:0};
  }

  async function chooseSensor(kind){
    S.current = freshSession(kind);
    setSensor(kind);
    if(kind === "self_report"){ beginLevel(1); return; }
    const ok = kind === "simulated" ? (pulse.startSimulated(), true) : await pulse.startCamera();
    if(!ok){ S.current.sensor = "self_report"; setSensor("self_report"); return; }
    pulse.setLoad(0);
    setCalibration({secs:0, readings:[]});
    setPhase("calibrate");
  }

  // One tick per second drives calibration, stress detection, grounding recovery and the
  // timeline. Reading pulse.latest (a ref) keeps it independent of render timing.
  useEffect(()=>{
    const id = setInterval(()=>{
      const s = S.current; if(!s) return;
      const p = pulse.latest.current;
      const valid = p.bpm && p.quality >= PULSE_MIN_QUALITY;
      const current = phaseRef.current;
      if(current === "calibrate"){
        setCalibration(c=>({secs:c.secs + 1, readings: valid ? [...c.readings, p.bpm] : c.readings}));
        return;
      }
      if(!["question","rate","grounding","levelup"].includes(current)) return;
      const elapsed = Math.round((Date.now() - s.startedAt) / 1000);
      if(valid) s.peak = Math.max(s.peak || 0, p.bpm);
      if(elapsed - s.lastSample >= 2){
        s.lastSample = elapsed;
        s.timeline.push({t:elapsed, bpm: valid ? p.bpm : null, level: s.level, stress: current === "grounding"});
      }
      if(current === "question" && s.baseline && valid){
        s.highSecs = p.bpm > stressThreshold(s.baseline) ? s.highSecs + 1 : 0;
        if(s.highSecs >= 4) easeOff("pulse", p.bpm);
      }
      if(current === "grounding"){
        setGrounding(g=>{
          if(!g) return g;
          const secs = g.secs + 1;
          let calmSecs = g.calmSecs || 0;
          if(s.baseline && valid) calmSecs = p.bpm <= s.baseline + 6 ? calmSecs + 1 : 0;
          const settled = s.baseline ? calmSecs >= 5 : secs >= 32;
          const recoveredAt = g.recoveredAt ?? (settled ? secs : null);
          if(recoveredAt != null && g.recoveredAt == null && s.strainStart){
            s.recoveries.push(Math.round((Date.now() - s.strainStart) / 1000));
            s.strainStart = null;
          }
          return {...g, secs, calmSecs, recoveredAt, bpm: valid ? p.bpm : g.bpm};
        });
      }
    }, 1000);
    return ()=>clearInterval(id);
  },[]);

  useEffect(()=>{
    if(phase !== "calibrate" || calibration.secs < 20) return;
    const readings = [...calibration.readings].sort((a,b)=>a-b);
    if(readings.length >= 5){
      S.current.baseline = readings[Math.floor(readings.length / 2)];
      beginLevel(1);
    }
  },[calibration, phase]);

  function currentQuestion(){
    const s = S.current;
    if(s.ease) return {...s.ease, speaker: REHEARSAL_LEVELS[s.ease.level-1].speaker, eased:true};
    const lvl = REHEARSAL_LEVELS[s.level-1];
    return {...lvl.questions[s.qIndex], level:s.level, speaker:lvl.speaker, eased:false};
  }

  function ask(){
    const q = currentQuestion();
    setQuestion(q); setTyped("");
    S.current.highSecs = 0;
    pulse.setLoad(q.level);
    setPhase("question");
    if(readAloud) speak(q[lang], lang);
  }

  function beginLevel(level){
    const s = S.current;
    s.level = level; s.qIndex = 0;
    pulse.setLoad(Math.max(0, level - 1));
    setPhase("levelup");
  }

  function easeOff(reason, bpm, strainedLevel){
    const s = S.current;
    if(phaseRef.current === "grounding") return;
    s.strained[strainedLevel ?? s.level] = true;
    if(reason === "pause") s.pauses += 1; else s.spikes += 1;
    s.strainStart = Date.now();
    // After the break, one easier question from the level below before returning to this one.
    if(!s.ease && s.level > 1){
      const easier = REHEARSAL_LEVELS[s.level - 2];
      s.ease = {...easier.questions[s.easeIdx % easier.questions.length], level: easier.level};
      s.easeIdx += 1;
    }
    try { window.speechSynthesis?.cancel(); } catch {}
    pulse.setLoad(-1);
    setGrounding({reason, peak: bpm || null, secs:0, calmSecs:0, recoveredAt:null, bpm: bpm || null});
    setPhase("grounding");
  }

  function finishGrounding(){
    const s = S.current;
    if(s.strainStart){ s.recoveries.push(Math.round((Date.now() - s.strainStart) / 1000)); s.strainStart = null; }
    // A spike mid-question returns to that question (it was never answered); a hard rating
    // arrives after an answer, so the rehearsal moves on from it instead of repeating it.
    const next = s.afterGrounding || "ask";
    s.afterGrounding = null;
    setGrounding(null);
    proceed(next);
  }

  // Records the question on screen as answered and moves the pointer; returns what follows.
  function stepPointer(){
    const s = S.current;
    s.questions += 1;
    if(s.ease){ s.ease = null; return "ask"; }
    s.qIndex += 1;
    if(s.qIndex < REHEARSAL_LEVELS[s.level-1].questions.length) return "ask";
    s.completed[s.level] = true;
    if(s.level >= REHEARSAL_LEVELS.length) return "finish";
    s.level += 1; s.qIndex = 0;
    return "levelup";
  }

  function proceed(next){
    if(next === "finish") finish();
    else if(next === "levelup") beginLevel(S.current.level);
    else ask();
  }

  function advance(){ proceed(stepPointer()); }

  async function answered(){
    if(answerMode === "type"){
      if(!typed.trim()) return;
      setChecking(true);
      try {
        const verdict = await api("/api/rehearsal/check", {text: typed.trim()});
        if(verdict.urgent){
          pulse.stop();
          try { window.speechSynthesis?.cancel(); } catch {}
          setUrgentReply(verdict.reply || "");
          setPhase("urgent");
          refreshDashboard();
          return;
        }
      } catch(err) {
        toast(err.message || "Could not check that answer. Please try again.", "error");
        return;
      } finally { setChecking(false); }
    }
    if(S.current.sensor === "self_report"){ setPhase("rate"); return; }
    advance();
  }

  function rate(value){
    const s = S.current;
    s.ratings.push(value);
    if(value < 4){ advance(); return; }
    const strainedLevel = s.level;
    s.afterGrounding = stepPointer();
    easeOff("rating", null, strainedLevel);
  }

  async function finish(){
    const s = S.current;
    pulse.stop();
    try { window.speechSynthesis?.cancel(); } catch {}
    const levelsCompleted = [1,2,3,4].filter(l=>s.completed[l]).reduce((m,l)=>Math.max(m,l), 0);
    const calmLevel = [1,2,3,4].filter(l=>s.completed[l] && !s.strained[l]).reduce((m,l)=>Math.max(m,l), 0);
    let timeline = s.timeline;
    if(timeline.length > 400){ const k = Math.ceil(timeline.length / 400); timeline = timeline.filter((_,i)=>i % k === 0); }
    const payload = {
      sensor: s.sensor, duration_seconds: Math.min(7200, Math.round((Date.now() - s.startedAt) / 1000)),
      questions_answered: s.questions, levels_completed: levelsCompleted, calm_level: calmLevel,
      baseline_bpm: s.baseline, peak_bpm: s.peak, spikes: s.spikes, pauses: s.pauses,
      recovery_seconds: s.recoveries.length ? Math.round(s.recoveries.reduce((a,b)=>a+b,0) / s.recoveries.length) : null,
      self_rating_avg: s.ratings.length ? Math.round(s.ratings.reduce((a,b)=>a+b,0) / s.ratings.length * 10) / 10 : null,
      timeline,
    };
    setPhase("summary");
    try {
      const saved = await api("/api/rehearsal/sessions", payload);
      setResult(saved);
      setHistory(h=>[...h, saved]);
    } catch(err) {
      setResult({...payload, readiness:null});
      toast(err.message || "Could not save this session.", "error");
    }
  }

  function restart(){
    S.current = null; setSensor(null); setResult(null); setQuestion(null); setGrounding(null);
    setPhase("setup");
  }

  const s = S.current;
  const reading = pulse.reading;
  const level = s ? REHEARSAL_LEVELS[s.level-1] : null;
  const usesPulse = sensor === "camera" || sensor === "simulated";
  const progress = s ? Math.round(((s.level - 1) * 3 + s.qIndex) / 12 * 100) : 0;

  return (
    <div className="fade-in max-w-4xl">
      <div className="flex items-start justify-between gap-3 mb-5 flex-wrap">
        <div>
          <h1 className="text-2xl font-bold" style={{color:"var(--v-ink)"}}>Courtroom Rehearsal</h1>
          <p className="text-black/50 mt-1">Practise giving evidence, at your pace. It eases off whenever you need it to.</p>
        </div>
        <div className="flex rounded-xl overflow-hidden border border-black/10 text-xs font-semibold" role="group" aria-label="Question language">
          {[["en","English"],["hi","हिंदी"]].map(([k,label])=>(
            <button key={k} onClick={()=>setLang(k)} aria-pressed={lang===k} className={`px-3 py-1.5 ${lang===k ? "text-white" : "text-black/55 bg-white"}`} style={lang===k?{background:"var(--v-green)"}:{}}>{label}</button>
          ))}
        </div>
      </div>

      {phase==="intro" && (
        <div className="space-y-5">
          <Card className="p-5">
            <div className="text-sm font-semibold text-black/60 mb-3">Step 1 · Know the room</div>
            <CourtroomMap/>
          </Card>
          <Card className="p-5">
            <div className="text-sm font-semibold text-black/60 mb-2">How the rehearsal works</div>
            <div className="grid sm:grid-cols-3 gap-3 text-sm">
              {[["leaf","Starts gentle","Four rounds, from a warm-up to the kind of pressure a defence lawyer can apply."],
                ["heart","Watches your stress","Your pulse through the camera, or your own rating after each question."],
                ["shield","Backs off for you","If stress spikes, it pauses for a breathing exercise and an easier question."]].map(([icon,title,body])=>(
                <div key={title} className="rounded-xl p-3.5" style={{background:"#F6F2EA"}}>
                  <div className="flex items-center gap-2 font-semibold mb-1" style={{color:"var(--v-green-d)"}}><Icon name={icon} size={15}/> {title}</div>
                  <div className="text-xs text-black/55 leading-relaxed">{body}</div>
                </div>
              ))}
            </div>
            <p className="text-xs text-black/45 mt-3">Nothing you say while practising is recorded or stored. Only your practice scores are saved, so you and your counsellor can see progress.</p>
            <button onClick={()=>setPhase("setup")} className="mt-4 px-5 py-2.5 rounded-xl text-white font-semibold" style={{background:"var(--v-green)"}}>Start practising</button>
          </Card>
          <RehearsalProgress history={history}/>
        </div>
      )}

      {phase==="setup" && (
        <Card className="p-5">
          <div className="text-sm font-semibold text-black/60 mb-1">Step 2 · How should we notice stress?</div>
          <p className="text-xs text-black/45 mb-4">The camera only measures colour changes in your fingertip or face. No picture or video is saved or sent anywhere.</p>
          <div className="grid sm:grid-cols-3 gap-3">
            <button onClick={()=>chooseSensor("camera")} className="text-left rounded-xl border border-black/10 p-4 hover:border-[--v-green] hover:bg-[#F6F2EA] transition">
              <div className="flex items-center gap-2 font-semibold mb-1" style={{color:"var(--v-ink)"}}><Icon name="heart" size={16}/> Pulse via camera</div>
              <div className="text-xs text-black/50 leading-relaxed">Rest a fingertip lightly over the camera lens (or face a webcam in good light).</div>
            </button>
            <button onClick={()=>chooseSensor("self_report")} className="text-left rounded-xl border border-black/10 p-4 hover:border-[--v-green] hover:bg-[#F6F2EA] transition">
              <div className="flex items-center gap-2 font-semibold mb-1" style={{color:"var(--v-ink)"}}><Icon name="smile" size={16}/> I'll rate it myself</div>
              <div className="text-xs text-black/50 leading-relaxed">No camera. After each question, tap how it felt.</div>
            </button>
            <button onClick={()=>chooseSensor("simulated")} className="text-left rounded-xl border border-dashed border-black/15 p-4 hover:bg-[#F6F2EA] transition">
              <div className="flex items-center gap-2 font-semibold mb-1 text-black/60"><Icon name="sparkle" size={16}/> Demo mode</div>
              <div className="text-xs text-black/45 leading-relaxed">A simulated pulse, clearly labelled, for presenting without a camera.</div>
            </button>
          </div>
          {reading.status==="error" && <div className="mt-3 text-xs rounded-lg px-3 py-2 bg-amber-50 text-amber-800">{reading.error}</div>}
          {sensor==="self_report" && reading.status==="error" && (
            <button onClick={()=>beginLevel(1)} className="mt-3 px-5 py-2.5 rounded-xl text-white font-semibold" style={{background:"var(--v-green)"}}>Continue without the camera</button>
          )}
          <div className="flex flex-wrap gap-4 mt-5 text-sm text-black/60">
            <label className="flex items-center gap-2"><input type="checkbox" checked={readAloud} onChange={e=>setReadAloud(e.target.checked)}/> Read questions aloud</label>
            <label className="flex items-center gap-2"><input type="radio" name="answer-mode" checked={answerMode==="aloud"} onChange={()=>setAnswerMode("aloud")}/> I'll answer out loud</label>
            <label className="flex items-center gap-2"><input type="radio" name="answer-mode" checked={answerMode==="type"} onChange={()=>setAnswerMode("type")}/> I'll type my answers</label>
          </div>
        </Card>
      )}

      {phase==="calibrate" && (
        <div className="grid md:grid-cols-[1fr_280px] gap-5">
          <Card className="p-6 text-center">
            <div className="text-sm font-semibold text-black/60 mb-1">Step 3 · Your resting pulse</div>
            <p className="text-sm text-black/50 mb-4">Sit comfortably and breathe normally for 20 seconds. This is your calm baseline — everything after is compared to it.</p>
            <div className="text-5xl font-extrabold tabular-nums mb-2" style={{color:"var(--v-ink)"}}>{Math.max(0, 20 - calibration.secs)}</div>
            <div className="h-2 rounded-full bg-black/5 overflow-hidden max-w-xs mx-auto"><div className="h-full rounded-full transition-all" style={{width:`${Math.min(100, calibration.secs/20*100)}%`, background:"var(--v-green)"}}/></div>
            <div className="text-xs text-black/40 mt-2">{calibration.readings.length} steady readings so far</div>
            {calibration.secs >= 20 && calibration.readings.length < 5 && (
              <div className="mt-4 text-sm">
                <p className="text-black/55 mb-3">We couldn't get a steady reading. Try covering the lens completely with a still fingertip, or rehearse without the camera.</p>
                <div className="flex gap-2 justify-center">
                  <button onClick={()=>setCalibration({secs:0, readings:[]})} className="px-4 py-2 rounded-xl border border-black/10 font-semibold text-black/60">Try again</button>
                  <button onClick={()=>{ pulse.stop(); S.current.sensor = "self_report"; setSensor("self_report"); beginLevel(1); }} className="px-4 py-2 rounded-xl text-white font-semibold" style={{background:"var(--v-green)"}}>Continue without camera</button>
                </div>
              </div>
            )}
          </Card>
          <PulseMonitor reading={reading}/>
        </div>
      )}

      {s && ["levelup","question","rate","grounding"].includes(phase) && (
        <div className="grid md:grid-cols-[1fr_260px] gap-5 items-start">
          <div>
            <div className="flex items-center justify-between text-xs text-black/45 mb-1.5">
              <span>Round {s.level} of 4 · {level.name[lang]}</span>
              <button onClick={finish} className="font-semibold hover:text-black/70">End session</button>
            </div>
            <div className="h-1.5 rounded-full bg-black/5 overflow-hidden mb-4"><div className="h-full rounded-full transition-all duration-500" style={{width:`${progress}%`, background:"var(--v-green)"}}/></div>

function RehearsalSummary({result, history, onAgain}){
  if(!result) return <Card className="p-6 text-sm text-black/50">Saving your session…</Card>;
  const first = history.find(h=>h.peak_bpm) || null;
  const recovery = result.recovery_seconds;
  const stats = [
    ["Rounds completed", `${result.levels_completed} / 4`],
    ["Calm up to round", result.calm_level ? `${result.calm_level}` : "—"],
    ["Questions answered", result.questions_answered],
    ["Resting pulse", result.baseline_bpm ? `${result.baseline_bpm} bpm` : "—"],
    ["Highest pulse", result.peak_bpm ? `${result.peak_bpm} bpm` : "—"],
    ["Time to settle", recovery != null ? `${recovery}s` : result.spikes || result.pauses ? "—" : "Never needed"],
  ];
  const message = result.readiness == null ? "Your session finished but could not be saved."
    : result.readiness >= 70 ? "You handled firm questioning and stayed steady. That's real preparation."
    : result.readiness >= 40 ? "Good progress. The harder rounds are where practice helps most — try them again in a day or two."
    : "Every practice counts. Hard questions feel easier each time you meet them somewhere safe first.";
  return (
    <div className="space-y-5 fade-in">
      <Card className="p-6">
        <div className="grid sm:grid-cols-[auto_1fr] gap-6 items-center">
          <div className="flex flex-col items-center">
            {result.readiness != null && <ReadinessRing value={result.readiness}/>}
            <div className="text-xs font-semibold text-black/45 mt-1">Court readiness</div>
          </div>
          <div>
            <div className="text-lg font-bold mb-1" style={{color:"var(--v-ink)"}}>Session complete</div>
            <p className="text-sm text-black/55 mb-4">{message}</p>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
              {stats.map(([k,v])=>(
                <div key={k} className="rounded-xl px-3 py-2.5" style={{background:"#F6F2EA"}}>
                  <div className="text-[11px] text-black/45">{k}</div>
                  <div className="font-bold text-sm" style={{color:"var(--v-ink)"}}>{v}</div>
                </div>
              ))}
            </div>
            {first && result.peak_bpm && first.id !== result.id && (
              <div className="mt-3 text-sm font-semibold" style={{color:"var(--v-green-d)"}}>
                First session peak: {first.peak_bpm} bpm → today: {result.peak_bpm} bpm
              </div>
            )}
          </div>
        </div>
      </Card>
      {result.timeline?.some(p=>p.bpm) && (
        <Card className="p-5">
          <div className="text-sm font-semibold text-black/60 mb-2">Your pulse through the session</div>
          <SessionPulseChart timeline={result.timeline} baseline={result.baseline_bpm}/>
        </Card>
      )}
      <RehearsalProgress history={history}/>
      <button onClick={onAgain} className="px-5 py-2.5 rounded-xl text-white font-semibold" style={{background:"var(--v-green)"}}>Practise again</button>
    </div>
  );
}

// Pulse over one session, with each round shaded and the breathing breaks marked, so the
// moment a question landed hard — and how quickly it passed — is visible at a glance.
function SessionPulseChart({timeline, baseline, height=170}){
  const pts = timeline.filter(p=>p.bpm);
  if(pts.length < 2) return <ChartEmptyState height={height} label="Not enough pulse readings to chart."/>;
  const width = 640, pad = {l:34, r:12, t:12, b:22};
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const tMin = Math.min(...timeline.map(p=>p.t)), tMax = Math.max(tMin + 1, ...timeline.map(p=>p.t));
  const lo = Math.min(...pts.map(p=>p.bpm), baseline || 999) - 8, hi = Math.max(...pts.map(p=>p.bpm)) + 8;
  const X = t => pad.l + (t - tMin) / (tMax - tMin) * w, Y = v => pad.t + h - (v - lo) / (hi - lo) * h;
  const LEVEL_FILL = ["#F3F7F2","#F8F5EC","#F6EEF3","#F7ECEC"];
  const bands = [];
  timeline.forEach((p,i)=>{
    const last = bands[bands.length-1];
    if(!last || last.level !== p.level) bands.push({level:p.level, from:p.t, to:p.t});
    else last.to = p.t;
    if(i < timeline.length - 1) bands[bands.length-1].to = timeline[i+1].t;
  });
  const path = pts.map((p,i)=>`${i ? "L" : "M"} ${X(p.t)},${Y(p.bpm)}`).join(" ");
  return (
    <svg width="100%" viewBox={`0 0 ${width} ${height}`} role="img" aria-label="Pulse during the rehearsal session">
      {bands.map((b,i)=>(<rect key={i} x={X(b.from)} y={pad.t} width={Math.max(1, X(b.to) - X(b.from))} height={h} fill={LEVEL_FILL[(b.level||1)-1]}/>))}
      {timeline.filter(p=>p.stress).map((p,i)=>(<rect key={"s"+i} x={X(p.t) - 2} y={pad.t} width="4" height={h} fill="#CFE0CF"/>))}
      {baseline && <line x1={pad.l} x2={pad.l + w} y1={Y(baseline)} y2={Y(baseline)} stroke="#6E8F71" strokeDasharray="4 4"/>}
      {baseline && <text x={pad.l + w} y={Y(baseline) - 4} fontSize="9.5" textAnchor="end" fill="#4F6E53">resting {baseline}</text>}
      {[lo + 8, Math.round((lo + hi) / 2), hi - 8].map(v=>(<text key={v} x={pad.l - 6} y={Y(v) + 3} fontSize="9.5" textAnchor="end" fill="#8A93A3">{Math.round(v)}</text>))}
      <path d={path} fill="none" stroke="#C1694F" strokeWidth="2.2" strokeLinejoin="round" strokeLinecap="round"/>
      {bands.map((b,i)=>(<text key={"l"+i} x={(X(b.from) + X(b.to)) / 2} y={height - 6} fontSize="9.5" textAnchor="middle" fill="#8A93A3">R{b.level}</text>))}
    </svg>
  );
}

function RehearsalProgress({history, tone="victim"}){
  if(!history || history.length === 0) return null;
  const recent = history.slice(-8);
  const latest = history[history.length-1];
  const firstPeak = history.find(h=>h.peak_bpm);
  const latestPeak = [...history].reverse().find(h=>h.peak_bpm);
  const Wrapper = tone === "victim" ? Card : ({children,className})=><div className={`rounded-2xl border border-slate-200 bg-white ${className}`}>{children}</div>;
  return (
    <Wrapper className="p-5">
      <div className="flex items-center justify-between mb-1">
        <div className="text-sm font-semibold text-black/60">Readiness across sessions</div>
        <div className="text-xs text-black/40">{history.length} session{history.length===1?"":"s"}</div>
      </div>
      {history.length >= 2
        ? <LineTrendMini data={recent.map((h,i)=>({label:`S${history.length - recent.length + i + 1}`, value:h.readiness}))} color="#4F6E53" height={150}/>
        : <div className="text-xs text-black/40 py-2">Your progress chart appears after your second session.</div>}
      <div className="grid grid-cols-3 gap-2 mt-2 text-xs">
        <div className="rounded-lg px-3 py-2" style={{background:"#F6F2EA"}}><div className="text-black/45">Latest readiness</div><div className="font-bold text-sm">{latest.readiness}</div></div>
        <div className="rounded-lg px-3 py-2" style={{background:"#F6F2EA"}}><div className="text-black/45">Peak pulse</div><div className="font-bold text-sm">{firstPeak && latestPeak && firstPeak.id !== latestPeak.id ? `${firstPeak.peak_bpm} → ${latestPeak.peak_bpm}` : latestPeak?.peak_bpm ?? "—"}</div></div>
        <div className="rounded-lg px-3 py-2" style={{background:"#F6F2EA"}}><div className="text-black/45">Hardest round done</div><div className="font-bold text-sm">{Math.max(...history.map(h=>h.levels_completed))} / 4</div></div>
      </div>
    </Wrapper>
  );
}

// Counsellor view of the same sessions: whether this witness is getting more comfortable
// with questioning ahead of a hearing, and where they still struggle. Only measurements —
// rehearsal answers are never stored, so there is nothing else to show.
function CourtReadinessPanel({caseId}){
  const [sessions,setSessions] = useState(null);
  const [error,setError] = useState("");
  useEffect(()=>{
    let cancelled = false;
    setSessions(null); setError("");
    api(`/api/cases/${caseId}/rehearsals`).then(r=>{ if(!cancelled) setSessions(r); }).catch(err=>{ if(!cancelled) setError(err.message || "Could not load rehearsal sessions."); });
    return ()=>{ cancelled = true; };
  },[caseId]);
  if(error) return <div className="text-sm text-red-600">{error}</div>;
  if(!sessions) return <div className="text-sm text-slate-400">Loading…</div>;
  if(sessions.length === 0) return (
    <div className="text-sm text-slate-400 py-8 text-center max-w-md mx-auto">
      No courtroom rehearsals yet. Participants can practise giving evidence from the “Court Rehearsal” page of their app; their readiness and stress response will appear here.
    </div>
  );
  const latest = sessions[sessions.length-1];
  const struggle = [1,2,3,4].find(l=>l > latest.calm_level && l <= Math.max(latest.levels_completed + 1, 1));
  return (
    <div className="space-y-5">
      <div className="grid grid-cols-2 gap-3">
        <MetricMini value={latest.readiness} label="Latest readiness" sub="out of 100" color="#047857" icon="shield"/>
        <MetricMini value={`${latest.levels_completed}/4`} label="Rounds completed" sub={`calm up to round ${latest.calm_level || "—"}`} color="#1E4B8F" icon="layers"/>
        <MetricMini value={latest.peak_bpm ? `${latest.peak_bpm}` : "—"} label="Peak pulse" sub={latest.baseline_bpm ? `resting ${latest.baseline_bpm} bpm` : latest.sensor === "self_report" ? "self-rated session" : ""} color="#B45309" icon="heart"/>
        <MetricMini value={latest.recovery_seconds != null ? `${latest.recovery_seconds}s` : "—"} label="Time to settle" sub={`${latest.spikes} spike${latest.spikes===1?"":"s"}, ${latest.pauses} pause${latest.pauses===1?"":"s"}`} color="#7C3AED" icon="clock"/>
      </div>
      {struggle && (
        <div className="text-sm bg-amber-50 border border-amber-100 text-amber-900 rounded-xl px-4 py-3">
          Struggles from round {struggle} ({REHEARSAL_LEVELS[struggle-1].name.en.toLowerCase()}). Consider going over these question types in session before the hearing.
        </div>
      )}
      <div className="space-y-5">
        <RehearsalProgress history={sessions} tone="staff"/>
        <div className="rounded-2xl border border-slate-200 p-5">
          <div className="text-sm font-semibold text-slate-700 mb-2">Latest session pulse</div>
          {latest.timeline?.some(p=>p.bpm) ? <SessionPulseChart timeline={latest.timeline} baseline={latest.baseline_bpm}/> : <ChartEmptyState height={170} label="Self-rated session — no pulse recorded."/>}
        </div>
      </div>
      <table className="w-full text-sm">
        <thead><tr className="text-left text-xs text-slate-400 border-b border-slate-100">
          <th className="py-2 font-medium">When</th><th className="font-medium">Sensor</th><th className="font-medium">Readiness</th><th className="font-medium">Rounds</th><th className="font-medium">Peak</th><th className="font-medium">Spikes / pauses</th>
        </tr></thead>
        <tbody>
          {[...sessions].reverse().map(r=>(
            <tr key={r.id} className="border-b border-slate-50 text-slate-600">
              <td className="py-2">{relativeTime(r.created_at)}</td>
              <td>{r.sensor === "camera" ? "Camera pulse" : r.sensor === "simulated" ? "Simulated (demo)" : "Self-rated"}</td>
              <td className="font-semibold">{r.readiness}</td>
              <td>{r.levels_completed}/4</td>
              <td>{r.peak_bpm ?? "—"}</td>
              <td>{r.spikes} / {r.pauses}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

                <div className="font-semibold text-slate-800">{navSel==="priority"? "Priority cases (High/Moderate)":"Priority cases"}</div>

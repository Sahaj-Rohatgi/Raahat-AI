                  <button onClick={()=>setNewCaseOpen(true)} className="text-xs font-semibold text-emerald-700 flex items-center gap-1"><Icon name="plus" size={12}/> New case</button>
                  <button onClick={()=>setNavSel("all")} className="text-xs font-semibold text-blue-700">View all</button>
                </div>
              </div>
              <NewCaseModal open={newCaseOpen} onClose={()=>setNewCaseOpen(false)} onCreated={(created)=>{setSelected(created.id); setTab("overview");}}/>
              <div className="space-y-1">
                {(navSel==="priority"? priorityCases.filter(c=>c.risk==="High"||c.risk==="Moderate") : priorityCases).map(c=>(
                  <button key={c.id} onClick={()=>{setSelected(c.id); setTab("overview");}} className={`w-full text-left px-3 py-3 rounded-xl border transition ${selected===c.id? "border-transparent bg-slate-900 text-white":"border-transparent hover:bg-slate-50"}`}>
                    <div className="flex items-center justify-between">
                      <span className={`font-semibold text-sm ${selected===c.id?"text-white":"text-slate-800"}`}>{c.name}</span>
                      <span className={`text-[11px] ${selected===c.id?"text-white/60":"text-slate-400"}`}>{c.time}</span>
                    </div>
                    <div className={`text-xs mt-0.5 flex items-center gap-1.5 ${selected===c.id?"text-white/80":c.risk==="High"?"text-red-600":"text-amber-600"}`}>
                      <span className="w-1.5 h-1.5 rounded-full" style={{background:c.risk==="High"?"var(--high)":"var(--moderate)"}}></span>
                      {c.risk} risk · {c.reason}
                    </div>
                  </button>
                ))}
              </div>
            </div>

            <CaseDetailPanel caseId={selected} tab={tab} setTab={setTab}/>
          </div>
          </>)}

          {navSel==="all" && (
            <CounsellorAllCases
              dashboardData={dashboardData}
              onOpen={(id)=>{setSelected(id); setTab("overview"); setNavSel("dashboard");}}
            />
          )}
          {navSel==="interventions" && <CounsellorInterventions dashboardData={dashboardData}/>} 
          {navSel==="handoffs" && <HandoffQueue dashboardData={dashboardData}/>} 
          {navSel==="quality" && <FeedbackAnalytics feedback={dashboardData.feedback}/>} 
          {navSel==="reports" && <ReportsPage/>}
          {navSel==="messages" && <PlaceholderPage title="Messages" body="Direct messaging between counsellors and cases is not available in this demo."/>}
          {navSel==="resources" && <PlaceholderPage title="Resources" body="A shared library of coping tools, legal guides and referral contacts for counsellors."/>}
          {navSel==="settings" && <PlaceholderPage title="Settings" body="Manage your notification preferences and profile details."/>}
        </div>
      </main>
    </div>
  );
}

function HandoffQueue({dashboardData}){
  const cases = Object.fromEntries((dashboardData.cases||[]).map(c=>[c.id,c]));
  const alerts = (dashboardData.alerts||[]).filter(a=>a.status!=="Resolved");
  const followups = dashboardData.followups||[];
  return <div className="fade-in max-w-4xl"><h1 className="text-2xl font-bold text-slate-900 mb-1">Handoff queue</h1><p className="text-slate-500 mb-5">Open safety escalations and scheduled care-team follow-ups.</p><div className="space-y-3">
    {alerts.length===0 && followups.length===0 && <div className="text-sm text-slate-400 py-8 text-center">No active handoffs.</div>}
    {alerts.map(a=><div key={"alert"+a.id} className="bg-white border-l-4 border-red-500 p-4 rounded-lg"><div className="flex justify-between"><span className="font-semibold text-slate-800">{(cases[a.case_id]||{}).name||"Case #"+a.case_id}</span><StatusPill status={a.status==="Unresolved"?"Open":a.status}/></div><div className="text-sm text-slate-500 mt-1">{a.reason}</div><div className="text-xs text-slate-400 mt-2">{a.severity} · {a.assigned_to||"Unassigned"}</div></div>)}
    {followups.map(f=><div key={"follow"+f.id} className="bg-white border border-slate-200 p-4 rounded-lg"><div className="flex justify-between"><span className="font-semibold text-slate-800">{f.title}</span><StatusPill status={f.status}/></div><div className="text-sm text-slate-500 mt-1">Case #{f.case_id} · Assigned to {f.assigned_to||"Care team"}</div><div className="text-xs text-slate-400 mt-2">Due {f.due_at}</div></div>)}
  </div></div>;
}

function FeedbackAnalytics({feedback}){
  const data = feedback||{total:0,helpful:0,not_helpful:0,helpful_rate:0,by_intent:[]};
  return <div className="fade-in max-w-4xl"><h1 className="text-2xl font-bold text-slate-900 mb-1">Chat quality</h1><p className="text-slate-500 mb-5">Participant feedback collected for future human review and RLHF dataset curation.</p><div className="grid sm:grid-cols-3 gap-4 mb-6">{[[data.total,"Ratings"],[data.helpful_rate+"%","Helpful rate"],[data.not_helpful,"Needs review"]].map(([value,label])=><MetricMini key={label} value={String(value)} label={label} sub="Chat feedback" color="#1E4B8F" icon="chart"/>)}</div><div className="bg-white rounded-xl border border-slate-200 p-5"><div className="font-semibold text-slate-800 mb-3">Feedback by intent</div>{data.by_intent.length===0?<div className="text-sm text-slate-400">No feedback collected yet.</div>:<div className="space-y-2">{data.by_intent.map((r,i)=><div key={i} className="flex justify-between text-sm border-b border-slate-50 pb-2"><span className="text-slate-600 capitalize">{r.topic||"general"} · {r.rating.replace("_"," ")}</span><span className="font-semibold text-slate-800">{r.count}</span></div>)}</div>}</div></div>;
}

function CounsellorAllCases({dashboardData,onOpen}){
  const live = (dashboardData.cases||[]).map(c=>({id:c.id, name:c.name, risk:shortRisk(c.risk_band,c.score), score:c.score, district:c.district, updated:relativeTime(c.updated_at)}));
  const rows = live;
  return (
    <div className="fade-in">
      <h1 className="text-2xl font-bold text-slate-900 mb-1">All cases</h1>
      <p className="text-slate-500 mb-5">Every case currently assigned to your caseload.</p>
      <div className="bg-white rounded-2xl border border-slate-200 p-5 overflow-x-auto">
        <table className="w-full text-sm min-w-[560px]">
          <thead><tr className="text-left text-xs text-slate-400 border-b border-slate-100">{["Case","District","Risk","Score","Updated",""].map(h=>(<th key={h} className="pb-2.5 font-medium pr-4">{h}</th>))}</tr></thead>
          <tbody>
            {rows.map(c=>(
              <tr key={c.id} className="border-b border-slate-50 hover:bg-slate-50/70">
                <td className="py-2.5 pr-4 font-medium text-slate-700">{c.name}</td>
                <td className="py-2.5 pr-4 text-slate-500">{c.district}</td>
                <td className="py-2.5 pr-4"><RiskBadge level={c.risk}/></td>
                <td className="py-2.5 pr-4 text-slate-500">{c.score}</td>
                <td className="py-2.5 pr-4 text-slate-400">{c.updated}</td>
                <td className="py-2.5 pr-4"><button onClick={()=>onOpen(c.id)} className="text-blue-700 font-semibold text-xs">Open</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function CounsellorInterventions({dashboardData}){
  const casesById = Object.fromEntries((dashboardData.cases||[]).map(c=>[c.id,c]));
  const rows = (dashboardData.interventions||[]).map(i=>({...i, caseName:(casesById[i.case_id]||{}).name || "Case #"+i.case_id}));
  return (
    <div className="fade-in max-w-4xl">
      <h1 className="text-2xl font-bold text-slate-900 mb-1">Interventions</h1>
      <p className="text-slate-500 mb-5">Every intervention recommended or recorded across your caseload.</p>
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        {rows.length===0 && <div className="text-sm text-slate-400 py-8 text-center">No interventions recorded yet.</div>}
        <div className="space-y-2">
          {rows.map(i=>(
            <div key={i.id} className="flex items-center justify-between px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-100 text-sm">
              <span className="font-medium text-slate-700">{i.title} <span className="text-slate-400 font-normal">· {i.caseName}</span></span>
              <span className="flex items-center gap-3"><span className="text-xs text-slate-400">{relativeTime(i.created_at)}</span><StatusPill status={i.status==="Completed"?"Resolved":i.status==="Active"?"In Progress":"Monitoring"}/></span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function MetricMini({value,label,sub,color,icon}){
  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-4 flex items-center justify-between hover:shadow-md transition">
      <div>
        <div className="text-2xl font-bold" style={{color}}>{value}</div>
        <div className="text-sm font-medium text-slate-700">{label}</div>
        <div className="text-xs text-slate-400">{sub}</div>
      </div>
      <div className="w-10 h-10 rounded-full flex items-center justify-center" style={{background:color+"22", color}}><Icon name={icon} size={17}/></div>
    </div>
  );
}

function CaseDetailPanel({caseId,tab,setTab}){
  const {distressScore,weekLabels,interventionLog,setInterventionLog,checkins,dashboardData,refreshDashboard,addNote} = useApp();
  const toast = useToast();
  const liveCase = (dashboardData.cases||[]).find(c=>c.id===caseId);
  // Every field comes from the backend row. Anything the schema does not store (age, gender,
  // assigned counsellor) reads as unknown instead of being filled in with plausible fiction.
  const info = liveCase? {
    id:liveCase.id, name:liveCase.name, age:liveCase.age ?? "—", gender:liveCase.gender ?? "—",
    district:liveCase.district, state:liveCase.state, category:liveCase.category||"Other",
    registered: liveCase.created_at? new Date(liveCase.created_at).toLocaleDateString():"—", counsellor:"Unassigned",
  } : {id:caseId,name:"Case #"+caseId,age:"—",gender:"—",district:"—",state:"—",category:"—",registered:"—",counsellor:"—"};
  const score = liveCase? liveCase.score : 0;
  const risk = riskFromScore(score);
  const caseEvents = (dashboardData.events||[]).filter(e=>e.case_id===caseId);
  const eventScores = [...caseEvents].reverse().map(e=>e.assessment.score);
  // History is always derived from real backend events (for any live case, Asha included) — never a
  // client-side accumulator, so a page reload shows the server's actual record, not a stale guess.
  // A case with no recorded events gets an empty chart with an honest empty state, not an
  // invented downward trend.
  const caseHistory = eventScores.length>=2 ? eventScores : eventScores.length===1 ? [eventScores[0],eventScores[0]] : [];
  const backendInterventions = (dashboardData.interventions||[]).filter(i=>i.case_id===caseId).map(i=>({id:"int-"+i.id,title:i.title,status:i.status,date:relativeTime(i.created_at)}));
  const localInterventions = interventionLog.filter(i=>i.forCase===info.id);
  const displayedInterventions = liveCase? [...localInterventions.filter(i=>i.forCase===info.id), ...backendInterventions] : localInterventions;
  const displayedNotes = (dashboardData.notes||[]).filter(n=>n.case_id===info.id);
  const displayedCheckins = checkins.filter(c=>c.caseId===info.id);
  const [filter,setFilter] = useState("30D");
  // The forecast is recomputed server-side per case, and refreshed whenever this case's stored
  // assessments change (an override or a new check-in moves dashboardData.events), so the
  // projection a counsellor reads is never stale relative to the trend chart beside it.
  const [forecast,setForecast] = useState(null);
  const [forecastLoading,setForecastLoading] = useState(false);
  const [forecastError,setForecastError] = useState("");
  useEffect(()=>{
    if(!liveCase){ setForecast(null); setForecastError(""); return; }
    let cancelled = false;
    setForecastLoading(true); setForecastError("");
    api(`/api/cases/${info.id}/forecast`)
      .then(result=>{ if(!cancelled) setForecast(result); })
      .catch(err=>{ if(!cancelled){ setForecast(null); setForecastError(err.message || "please try again."); } })
      .finally(()=>{ if(!cancelled) setForecastLoading(false); });
    return ()=>{ cancelled = true; };
  },[info.id, liveCase? caseEvents.length : 0, score]);
  const [modal,setModal] = useState(null);
  const [note,setNote] = useState("");
  const [shareNote,setShareNote] = useState(false);
  const [noteSaving,setNoteSaving] = useState(false);
  const [overrideOpen,setOverrideOpen] = useState(false);
  const [overrideForm,setOverrideForm] = useState({score,risk_band:risk.label.replace(" Risk",""),note:""});
  const [overrideSaving,setOverrideSaving] = useState(false);

  async function submitNote(){
    if(!note.trim()) return;
    setNoteSaving(true);
    try {
      await addNote(info.id, note.trim(), undefined, shareNote);
      setNote(""); setShareNote(false);
      toast(shareNote ? "Note shared with the participant." : "Case note added.","success");
    } catch { toast("Could not save the note. Please try again.","error"); }
    finally { setNoteSaving(false); }
  }

  async function submitOverride(){
    setOverrideSaving(true);
    try {
      await api(`/api/cases/${info.id}/override`, {score:Number(overrideForm.score), risk_band:overrideForm.risk_band, note:overrideForm.note}, "PATCH");
      toast("Assessment overridden and logged for this case.","success");
      setOverrideOpen(false);
      await refreshDashboard();
    } catch { toast("Could not save the override. Please try again.","error"); }
    finally { setOverrideSaving(false); }
  }

  async function createFollowup(){
    try {
      await api(`/api/cases/${info.id}/followups`, {title:"Counsellor follow-up", due_at:new Date(Date.now()+86400000).toISOString(), assigned_to:info.counsellor||"Care team"});
      await refreshDashboard(); toast("Follow-up task added to the handoff queue.","success");
    } catch { toast("Could not create the follow-up task.","error"); }
  }

  // These used to be a fixed array ("Voice Stress: Elevated", "Threat Indicator: Reported")
  // rendered identically for every case, including one with no assessment at all — signals the
  // system never computes, presented to a counsellor as if measured. They are now read from
  // this case's most recent assessment factors, and absent when there is no assessment.
  // Real per-assessment explanation: pulled from the latest backend event for this case, not a
  // fixed illustrative array — a case with no events yet (a brand-new case) shows an empty state
  // instead of numbers that were never actually computed for it.
  const latestAssessment = caseEvents.length ? caseEvents[0].assessment : null;
  const factors = (latestAssessment?.factors || []).map(f=>({label:f.label, val:f.weight, suffix:"% relative weight"}));
  const confidence = latestAssessment?.confidence;
  const INDICATOR_SCALES = {mood:3, sleep:3, safety:2, anxiety:2, case_pressure:3, missed_checkins:10, engagement:4, text_risk:4};
  const indicators = (latestAssessment?.factors || []).map(f=>{
    const max = INDICATOR_SCALES[f.key] || 1;
    // engagement is protective: a high raw value is a good sign, every other factor is the reverse
    const severe = f.key === "engagement" ? f.value <= max/2 : f.value >= max/2;
    return {k:f.label, v:`${f.value} / ${max}`, up:severe};
  });

  function runIntervention(title){
    setModal(title);
  }
  function confirmIntervention(){
    setInterventionLog(l=>[{id:Date.now(), title:modal, status:"Scheduled", date:"Today", forCase:info.id},...l]);
    toast(`${modal} — action completed successfully.`,"success");
    setModal(null);
  }

  return (
    <div className="bg-white rounded-2xl border border-slate-200 p-5">
      <div className="flex items-start justify-between mb-4">
        <div className="flex items-center gap-3">
          <div className="w-14 h-14 rounded-full bg-slate-200"></div>
          <div>
            <div className="flex items-center gap-2"><span className="font-bold text-lg text-slate-900">{info.name}</span><RiskBadge level={risk.label}/></div>
            <div className="text-xs text-slate-400">Case ID #{info.id} · {info.gender!=="—"? (info.age+" yrs"):"—"} · {info.district}, {info.state}</div>
          </div>
        </div>
        <div className="text-right">
          <div className="text-xs text-slate-400">
            Last update<br/><span className="text-slate-600 font-medium">{liveCase? relativeTime(liveCase.updated_at) : "2h ago"}</span>
            {liveCase && <><br/>Last check-in<br/><span className="text-slate-600 font-medium">{liveCase.last_checkin_at? relativeTime(liveCase.last_checkin_at) : "No check-in yet"}</span></>}
          </div>
          {liveCase && <button onClick={()=>exportReport(info.id)} className="mt-2 text-xs font-semibold text-blue-700 flex items-center gap-1 ml-auto"><Icon name="download" size={12}/> Export report</button>}
        </div>
      </div>

      <div className="flex gap-5 border-b border-slate-100 mb-5 text-sm font-medium overflow-x-auto">
        {["overview","notes","risk","court","interventions","history"].map(t=>(
          <button key={t} onClick={()=>setTab(t)} className={`pb-2.5 border-b-2 capitalize whitespace-nowrap ${tab===t?"border-emerald-600 text-emerald-700":"border-transparent text-slate-400 hover:text-slate-600"}`}>
            {t==="risk"?"Risk indicators":t==="court"?"Court readiness":t}
          </button>
        ))}
      </div>

      {tab==="overview" && (
        <div className="grid lg:grid-cols-[1fr_320px] gap-6">
          <div>
            <div className="text-sm font-semibold text-slate-700 mb-1.5">Current situation</div>
            <p className="text-sm text-slate-500 leading-relaxed mb-5">Latest backend assessments, check-ins and chat events are synced here for human review. Close follow-up is recommended when the score or alerts increase.</p>
            <div className="text-sm font-semibold text-slate-700 mb-2">Key indicators</div>
            <div className="grid grid-cols-2 gap-x-6 gap-y-2 mb-5">
              {indicators.length===0 && <div className="col-span-2 text-sm text-slate-400">No assessment recorded for this case yet.</div>}
              {indicators.map(k=>(
                <div key={k.k} className="flex items-center justify-between text-sm py-1 border-b border-slate-50">
                  <span className="text-slate-500">{k.k}</span>
                  <span className={`font-medium flex items-center gap-1 ${k.up?"text-red-600":"text-amber-600"}`}>{k.v} <Icon name="trend" size={13}/></span>
                </div>
              ))}
            </div>
            <ExplainableAICard score={score} factors={factors} confidence={confidence}/>
          </div>
          <div>
            <div className="flex items-center justify-between mb-2">
              <div className="text-sm font-semibold text-slate-700">Distress trend</div>
              <select value={filter} onChange={e=>setFilter(e.target.value)} className="text-xs border border-slate-200 rounded-lg px-2 py-1 text-slate-500">
                <option>30D</option><option>3M</option><option>6M</option><option>Entire Case</option>
              </select>
            </div>
            <DistressLineChart data={caseHistory} weekLabels={weekLabels.slice(-caseHistory.length)} height={190}/>
            <div className="mt-4">
              <ForecastCard forecast={forecast} loading={forecastLoading} error={forecastError}/>
            </div>
            <div className="mt-4 space-y-2">
              <button onClick={createFollowup} className="w-full py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold flex items-center justify-center gap-2"><Icon name="phone" size={14}/> Prepare follow-up</button>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={()=>runIntervention("Schedule Counselling")} className="py-2 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 flex items-center justify-center gap-1"><Icon name="calendar" size={13}/> Schedule check-in</button>
                <button onClick={()=>runIntervention("Add Case Note")} className="py-2 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 flex items-center justify-center gap-1"><Icon name="file" size={13}/> Add case note</button>
              </div>
              {liveCase && (
                <button onClick={()=>{setOverrideForm({score,risk_band:risk.label.replace(" Risk",""),note:""}); setOverrideOpen(true);}} className="w-full py-2 rounded-lg border border-amber-200 bg-amber-50 text-xs font-semibold text-amber-800 flex items-center justify-center gap-1"><Icon name="gear" size={13}/> Override AI assessment</button>
              )}
            </div>
            <div className="mt-3 text-xs bg-emerald-50 text-emerald-800 rounded-lg p-3">A timely conversation can change the trajectory. Thank you for being here.</div>
          </div>
        </div>
      )}

      {tab==="notes" && (
        <div>
          {liveCase ? (
            <div className="flex gap-2 mb-4">
              <input value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") submitNote();}} placeholder="Add a case note…" className="flex-1 px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm focus-ring"/>
              <button disabled={noteSaving} onClick={submitNote} className="px-4 py-2.5 rounded-lg bg-slate-900 text-white text-sm font-semibold disabled:opacity-50">{noteSaving? "Saving…":"Add"}</button>
            </div>
          ) : (
            <div className="text-xs text-slate-400 mb-4">Notes can only be added to a registered case (this demo entry has no backend record).</div>
          )}
          {liveCase && (
            <label className="flex items-center gap-2 -mt-2 mb-4 text-xs text-slate-600 select-none">
              <input type="checkbox" checked={shareNote} onChange={e=>setShareNote(e.target.checked)} className="w-4 h-4 accent-emerald-700"/>
              Share this note with the participant (shown on their home screen as a note from their care team)
            </label>
          )}
          <div className="space-y-3">
            {displayedNotes.length===0 && <div className="text-sm text-slate-400 py-6 text-center">No notes yet for this case.</div>}
            {displayedNotes.map(n=>(
              <div key={n.id} className="p-4 rounded-xl bg-slate-50 border border-slate-100">
                <div className="flex justify-between text-xs text-slate-400 mb-1"><span className="font-semibold text-slate-600">{n.author}</span><span>{relativeTime(n.created_at)}</span></div>
                <div className="text-sm text-slate-600">{n.text}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab==="risk" && (
        <div className="space-y-4 max-w-xl">
          {[
            {label:"Sentiment (text)", value:78, color:"var(--high)"}, {label:"Voice stress", value:70, color:"var(--moderate)"},
            {label:"Engagement decline", value:55, color:"var(--moderate)"}, {label:"Sleep disruption", value:64, color:"var(--moderate)"},
            {label:"Threat / safety signal", value:88, color:"var(--critical)"}, {label:"Court-related stress", value:60, color:"var(--moderate)"},
          ].map((f,i)=>(
            <div key={i}>
              <div className="flex justify-between text-sm mb-1"><span className="text-slate-600 font-medium">{f.label}</span><span className="text-slate-400">{f.value}/100</span></div>
              <div className="h-2 rounded-full bg-slate-100 overflow-hidden"><div className="h-full rounded-full" style={{width:f.value+"%", background:f.color}}></div></div>
            </div>
          ))}
        </div>
      )}

      {tab==="court" && (liveCase ? <CourtReadinessPanel caseId={info.id}/> : <div className="text-sm text-slate-400">Rehearsal data is only available for a registered case.</div>)}

      {tab==="interventions" && (
        <div>
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2.5 mb-6">
            {["Contact Victim","Schedule Counselling","Medical Referral","Notify District Authority","Request Witness Protection","Relocation Support","Financial Assistance","Legal Aid","Rehabilitation Support","Resolve Alert"].map(a=>(
              <button key={a} onClick={()=>runIntervention(a)} className="px-3 py-2.5 rounded-xl border border-slate-200 text-sm font-medium text-slate-600 hover:border-emerald-400 hover:bg-emerald-50 hover:text-emerald-800 transition text-left">{a}</button>
            ))}
          </div>
          <div className="text-sm font-semibold text-slate-700 mb-2">Intervention history</div>
          <div className="space-y-2">
            {displayedInterventions.length===0 && <div className="text-sm text-slate-400 py-6 text-center">No interventions recorded yet for this case.</div>}

// Future Distress Prediction — the counterpart to the Dynamic Distress Score. The score says
// where a case is now; this says where its own recorded trajectory is heading over the next
// check-in cycles, so a counsellor can act before the next reading rather than after it. The
// projection comes from GET /api/cases/{id}/forecast (backend/ml/forecast.py), computed from
// this case's stored assessments — a case with too little history shows why there is no
// projection instead of a made-up number.
function ForecastCard({forecast, loading, error}){
  const DIRECTION = {
    rising: {label:"Rising", tone:"text-red-600", bg:"bg-red-50", border:"border-red-100"},
    easing: {label:"Easing", tone:"text-emerald-700", bg:"bg-emerald-50", border:"border-emerald-100"},
    steady: {label:"Steady", tone:"text-slate-600", bg:"bg-slate-50", border:"border-slate-100"},
  };
  const shell = (body) => (
    <div className="rounded-xl border border-slate-200 p-4">
      <div className="font-semibold text-sm text-slate-800 flex items-center gap-2 mb-2"><Icon name="trend" size={15}/> Future distress prediction</div>
      {body}
    </div>
  );
  if(loading) return shell(<div className="text-xs text-slate-400">Projecting from this case&rsquo;s history&hellip;</div>);
  if(error) return shell(<div className="text-xs text-slate-400">Prediction unavailable right now &mdash; {error}</div>);
  if(!forecast) return shell(<div className="text-xs text-slate-400">No prediction for this case.</div>);
  if(!forecast.available) return shell(<div className="text-xs text-slate-400">{forecast.reason}</div>);

  const dir = DIRECTION[forecast.direction] || DIRECTION.steady;
  const band = riskFromScore(forecast.score);
  return shell(
    <>
      <div className="flex items-end gap-2 mb-1">
        <div className="text-3xl font-bold text-slate-900">{forecast.score}</div>
        <div className="text-sm text-slate-400 mb-1">/ 100 projected</div>
        <span className={`ml-auto mb-1 text-xs font-semibold px-2 py-0.5 rounded-full ${dir.bg} ${dir.tone} border ${dir.border}`}>
          {dir.label}{forecast.delta!==0 && <span> {forecast.delta>0?"+":""}{forecast.delta}</span>}
        </span>
      </div>
      <div className="text-xs text-slate-500 mb-3">
        {forecast.horizon_label} &middot; likely range {forecast.range[0]}&ndash;{forecast.range[1]} &middot; projected band <span className="font-semibold" style={{color:band.text}}>{band.label}</span>
      </div>
      <div className="grid grid-cols-3 gap-2 text-center mb-3">
        {[[forecast.current_score,"Now"],[(forecast.trend_per_week>0?"+":"")+forecast.trend_per_week,"Per week"],[forecast.confidence+"%","Confidence"]].map(([value,label])=>(
          <div key={label} className="rounded-lg bg-slate-50 py-2">
            <div className="text-sm font-bold text-slate-800">{value}</div>
            <div className="text-[10px] uppercase tracking-wide text-slate-400">{label}</div>
          </div>
        ))}
      </div>
      {forecast.off_trend_note && (
        <div className="text-[11px] text-amber-800 bg-amber-50 border border-amber-100 rounded-lg p-2 mb-2 leading-relaxed">{forecast.off_trend_note}</div>
      )}
      <div className="text-[11px] text-slate-400 leading-relaxed border-t border-slate-100 pt-2">
        {forecast.basis} Confidence describes how well the trend fits this case&rsquo;s {forecast.points_used} recorded assessments over {forecast.span_days} days &mdash; it is a triage prompt for human review, not a prediction about the person or an automated decision.
      </div>
    </>
  );
}

function ExplainableAICard({score,factors,confidence}){
  return (
    <div className="rounded-xl border border-slate-200 p-4">
      <div className="flex items-center justify-between mb-1">
        <div className="font-semibold text-sm text-slate-800 flex items-center gap-2"><Icon name="sparkle" size={15}/> Why is this case {riskFromScore(score).label}?</div>
        {confidence!=null && <span className="text-xs font-semibold text-slate-400">Model confidence {confidence}%</span>}
      </div>
      <div className="text-2xl font-bold text-slate-900 mb-3">{score} <span className="text-sm font-normal text-slate-400">/ 100 Dynamic Distress Score</span></div>
      {factors.length>0 ? (
        <div className="space-y-2.5 mb-3">
          {factors.map((f,i)=>(
            <div key={i}>
              <div className="flex justify-between text-xs text-slate-500 mb-1"><span>{f.label}</span><span className="font-medium text-slate-700">{f.val}{f.suffix}</span></div>
              <div className="h-1.5 rounded-full bg-slate-100"><div className="h-full rounded-full bg-blue-700" style={{width:Math.min(f.val,100)+"%"}}></div></div>
            </div>
          ))}
        </div>
      ) : (
        <div className="text-xs text-slate-400 mb-3">No assessment recorded for this case yet — factors will appear after the first check-in or chat message.</div>
      )}
      <div className="text-[11px] text-slate-400 leading-relaxed border-t border-slate-100 pt-2">Factor weights are relative to each other for this specific assessment (from the trained model's feature importances and this case's actual answers), not raw percentages. This highlights contributing signals and does not replace professional judgement.</div>
    </div>
  );
}

                      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search case or district" className="pl-8 pr-3 py-1.5 rounded-lg bg-slate-100 text-xs w-48 focus-ring"/>
                    </div>
                    <select value={riskFilter} onChange={e=>setRiskFilter(e.target.value)} className="text-xs border border-slate-200 rounded-lg px-2 py-1.5 text-slate-500">
                      {["All","High","Moderate","Low"].map(o=>(<option key={o}>{o}</option>))}
                    </select>
                    <button onClick={()=>setNewCaseOpen(true)} className="text-xs font-semibold text-emerald-700 flex items-center gap-1"><Icon name="plus" size={12}/> New case</button>
                    <button className="text-xs font-semibold text-blue-700">View all</button>
                  </div>
                </div>
                <NewCaseModal open={newCaseOpen} onClose={()=>setNewCaseOpen(false)} onCreated={()=>toast("Case added to the monitored list below.","success")}/>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm min-w-[820px]">
                    <thead>
                      <tr className="text-left text-xs text-slate-400 border-b border-slate-100">
                        {["Case ID","Age group","Gender","District","Risk level","Score","Primary concern","Last updated","Status","Actions"].map(h=>(<th key={h} className="pb-2.5 font-medium pr-4">{h}</th>))}
                      </tr>
                    </thead>
                    <tbody>
                      {filteredCases.map(c=>(
                        <tr key={c.id} className="border-b border-slate-50 hover:bg-slate-50/70">
                          <td className="py-2.5 pr-4 font-medium text-slate-700">{c.id}</td>
                          <td className="py-2.5 pr-4 text-slate-500">{c.age}</td>
                          <td className="py-2.5 pr-4 text-slate-500">{c.gender}</td>
                          <td className="py-2.5 pr-4 text-slate-500">{c.district}</td>
                          <td className="py-2.5 pr-4"><RiskBadge level={c.risk}/></td>
                          <td className="py-2.5 pr-4 text-slate-500">{c.score}</td>
                          <td className="py-2.5 pr-4 text-slate-500">{c.concern}</td>
                          <td className="py-2.5 pr-4 text-slate-400">{c.updated}</td>
                          <td className="py-2.5 pr-4"><StatusPill status={c.status}/></td>
                          <td className="py-2.5 pr-4"><button onClick={()=>toast(`Opening ${c.id}…`)} className="text-blue-700 font-semibold text-xs">View</button></td>
                        </tr>
                      ))}
                      {filteredCases.length===0 && <tr><td colSpan="10" className="py-8 text-center text-slate-400 text-sm">No cases match this filter.</td></tr>}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          )}

          {navSel==="alerts" && <AlertsPage/>}
          {navSel==="reports" && <ReportsPage/>}
          {navSel==="people" && <PeopleCasesPage cases={liveCases}/>}
          {navSel==="districts" && <DistrictsListPage states={STATES}/>}
          {navSel==="data" && <LiveDatabasePage/>}
          {navSel==="settings" && <PlaceholderPage title="Settings" body="Manage roles, permissions and notification preferences."/>}
        </div>
      </main>
    </div>
  );
}

function FilterSelect({label,value,onChange,options,display}){
  return (
    <div className="text-xs">
      <div className="text-slate-400 mb-1 font-medium">{label}</div>
      <select value={value} onChange={e=>onChange(e.target.value)} className="border border-slate-200 rounded-lg px-3 py-2 text-slate-700 text-sm bg-white min-w-[130px]">
        {options.map(o=>(<option key={o} value={o}>{display?display[o]:o}</option>))}
      </select>
    </div>
  );
}

function riskColorFor(avg){
  if(avg>=70) return "var(--high)"; if(avg>=50) return "var(--moderate)"; if(avg>=30) return "var(--low)"; return "var(--minimal)";
}

function AbstractMap({level,states,selState,stateObj,onSelectState,onSelectDistrict}){
  const [hover,setHover] = useState(null);
  if(level==="national"){
    const cols = 4;
    return (
      <div>
        <div className="grid grid-cols-4 gap-2.5">
          {states.map((s,i)=>{
            const avg = Math.round(s.districts.reduce((a,d)=>a+d.avg,0)/s.districts.length);
            return (
              <button key={s.name} onMouseEnter={()=>setHover(s)} onMouseLeave={()=>setHover(null)} onClick={()=>onSelectState(s.name)}
                className="aspect-square rounded-xl flex items-center justify-center text-center p-1.5 text-[10px] font-semibold text-white/95 hover:scale-105 transition"
                style={{background:riskColorFor(avg)}}>
                {s.name}
              </button>
            );
          })}
        </div>
        {hover && <div className="mt-3 text-xs bg-slate-50 rounded-lg p-3 border border-slate-100">
          <div className="font-semibold text-slate-700">{hover.name}</div>
          <div className="text-slate-500">Victims monitored: {hover.districts.reduce((a,d)=>a+d.total,0).toLocaleString()} · High risk: {hover.districts.reduce((a,d)=>a+d.high,0)} · Avg distress: {Math.round(hover.districts.reduce((a,d)=>a+d.avg,0)/hover.districts.length)}</div>
        </div>}
      </div>
    );
  }
  if(level==="state"){
    return (
      <div>
        <div className="grid grid-cols-3 gap-2.5">
          {stateObj.districts.map(d=>(
            <button key={d.name} onMouseEnter={()=>setHover(d)} onMouseLeave={()=>setHover(null)} onClick={()=>onSelectDistrict(d.name)}
              className="rounded-xl p-3 text-left text-white text-xs font-semibold hover:scale-105 transition h-24 flex flex-col justify-between"
              style={{background:riskColorFor(d.avg)}}>
              <span>{d.name}</span>
              <span className="text-[10px] font-normal opacity-90">Avg {d.avg} · {d.high} high risk</span>
            </button>
          ))}
        </div>
        {hover && <div className="mt-3 text-xs bg-slate-50 rounded-lg p-3 border border-slate-100">
          <div className="font-semibold text-slate-700">{hover.name}</div>
          <div className="text-slate-500">Cases: {hover.total} · High risk: {hover.high} · Open alerts: {hover.alerts} · Avg distress: {hover.avg}</div>
        </div>}
      </div>
    );
  }
  // district level: show ward-style breakdown (synthetic)
  const wards = ["Ward A","Ward B","Ward C","Ward D","Ward E","Ward F"];
  return (
    <div className="grid grid-cols-3 gap-2.5">
      {wards.map((w,i)=>(
        <div key={w} className="rounded-xl p-3 text-white text-xs font-semibold h-20 flex items-end" style={{background:riskColorFor(30+i*11)}}>{w}</div>
      ))}
    </div>
  );
}

function AlertsPage(){
  const {dashboardData,updateAlert} = useApp();
  const toast = useToast();
  const [busy,setBusy] = useState(null);
  const casesById = Object.fromEntries((dashboardData.cases||[]).map(c=>[c.id,c]));
  const live = (dashboardData.alerts||[]).map(a=>{
    const c = casesById[a.case_id] || {};
    return {
      id:a.id, real:true, caseId:"Case #"+a.case_id, name:c.name, district:c.district||"—", score:c.score ?? "—",
      reason:(a.reason||"").split("; ").filter(Boolean), severity:a.severity, status:a.status, assignedTo:a.assigned_to,
    };
  });
  const seeded = [
    {id:"s1", real:false, caseId:"DW-2026-0142", district:"South Delhi", score:86, reason:["Threat reported","Negative sentiment spike","Voice stress elevated"], severity:"Critical", status:"Unresolved"},
    {id:"s2", real:false, caseId:"DW-2026-0098", district:"Pune", score:74, reason:["Missed two check-ins","Sentiment decline"], severity:"High", status:"Unresolved"},
    {id:"s3", real:false, caseId:"DW-2026-0071", district:"Lucknow", score:66, reason:["Sleep disruption","Court hearing upcoming"], severity:"Moderate", status:"Unresolved"},
  ];
  const all = [...live, ...seeded];

  async function act(alertId, patch, label){
    setBusy(alertId);
    try { await updateAlert(alertId, patch); toast(label,"success"); }
    catch { toast("Could not update the alert. Please try again.","error"); }
    finally { setBusy(null); }
  }

  return (
    <div className="fade-in max-w-4xl">
      <h1 className="text-2xl font-bold text-slate-900 mb-1">Alerts</h1>
      <p className="text-slate-500 mb-6">Real-time escalation alerts across all monitored cases.</p>
      <div className="space-y-4">
        {all.length===0 && <div className="text-sm text-slate-400 py-8 text-center">No alerts right now.</div>}
        {all.map(a=>(
          <div key={a.id} className="bg-white rounded-2xl border-l-4 p-5" style={{borderColor: a.severity==="Critical"?"var(--critical)":a.severity==="High"?"var(--high)":"var(--moderate)"}}>
            <div className="flex items-center justify-between mb-2">
              <div className="flex items-center gap-2 font-bold text-sm" style={{color: a.severity==="Critical"?"var(--critical)":a.severity==="High"?"var(--high)":"var(--moderate)"}}>
                <Icon name="alert" size={16}/> {a.severity.toUpperCase()} {a.severity==="Critical" && "ESCALATION"}
              </div>
              <StatusPill status={a.status==="Unresolved"?"Open":a.status}/>
            </div>
            <div className="text-sm text-slate-700 font-semibold mb-1">{a.caseId}{a.name? " · "+a.name : ""} · {a.district}</div>
            <div className="text-sm text-slate-500 mb-2">Distress score: <span className="font-semibold text-slate-700">{a.score} / 100</span></div>
            {a.assignedTo && <div className="text-xs text-slate-500 mb-2">Assigned to <span className="font-semibold text-slate-700">{a.assignedTo}</span></div>}
            <ul className="text-xs text-slate-500 list-disc list-inside mb-3">{a.reason.map((r,i)=>(<li key={i}>{r}</li>))}</ul>
            <div className="flex gap-2 flex-wrap">
              {a.real ? (
                <>
                  <button disabled={busy===a.id || a.status==="Resolved"} onClick={()=>act(a.id,{status:"Resolved"},"Alert marked resolved.")} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-700 text-white disabled:opacity-40">Mark Resolved</button>
                  <button disabled={busy===a.id || a.status==="In Progress"} onClick={()=>act(a.id,{status:"In Progress"},"Alert marked in progress.")} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white disabled:opacity-40">In Progress</button>
                  <button disabled={busy===a.id} onClick={()=>act(a.id,{assigned_to:"Dr. Meera Sharma"},"Counsellor assigned.")} className="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-200 text-slate-600 disabled:opacity-40">Assign Counsellor</button>
                </>
              ) : (
                <>
                  <button onClick={()=>toast("Opening case detail…")} className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 text-white">View Case</button>
                  <button onClick={()=>toast("Counsellor assigned.","success")} className="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-200 text-slate-600">Assign Counsellor</button>
                  <button onClick={()=>toast("District authority notified.","success")} className="px-3 py-1.5 rounded-lg text-xs font-semibold border border-slate-200 text-slate-600">Notify District Authority</button>
                </>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

  const rows = [];
  states.forEach(s=>s.districts.forEach(d=>rows.push({...d, state:s.name})));
  rows.sort((a,b)=>b.avg-a.avg);
  return (
    <div className="fade-in max-w-5xl">
      <h1 className="text-2xl font-bold text-slate-900 mb-1">Districts ranked by risk</h1>
      <p className="text-slate-500 mb-6">All monitored districts, ordered by average distress score.</p>
      <div className="bg-white rounded-2xl border border-slate-200 p-5 overflow-x-auto">
        <table className="w-full text-sm min-w-[640px]">
          <thead><tr className="text-left text-xs text-slate-400 border-b border-slate-100">{["District","State","Cases","High risk","Open alerts","Avg distress"].map(h=>(<th key={h} className="pb-2.5 font-medium pr-4">{h}</th>))}</tr></thead>
          <tbody>
            {rows.map(d=>(
              <tr key={d.name} className="border-b border-slate-50">
                <td className="py-2.5 pr-4 font-medium text-slate-700">{d.name}</td>
                <td className="py-2.5 pr-4 text-slate-500">{d.state}</td>
                <td className="py-2.5 pr-4 text-slate-500">{d.total}</td>
                <td className="py-2.5 pr-4 text-slate-500">{d.high}</td>
                <td className="py-2.5 pr-4 text-slate-500">{d.alerts}</td>
                <td className="py-2.5 pr-4"><span className="font-semibold" style={{color:riskColorFor(d.avg)}}>{d.avg}</span></td>
              </tr>
            ))}

function LiveDatabasePage(){
  const [db,setDb] = useState(null);
  const [selected,setSelected] = useState("cases");
  const [loading,setLoading] = useState(false);
  const toast = useToast();

  async function load(){
    setLoading(true);
    try {
      const data = await api("/api/db");
      setDb(data);
      if(!data.tables[selected]) setSelected(Object.keys(data.tables)[0] || "cases");
    } catch {
      toast("Could not load database view.","error");
    } finally {
      setLoading(false);
    }
  }

  useEffect(()=>{ load(); },[]);
  const tables = db?.tables || {};
  const names = Object.keys(tables);
  const current = tables[selected] || {columns:[], rows:[], count:0};
  const cell = value => {
    const text = typeof value === "string" ? value : JSON.stringify(value);
    return text && text.length > 120 ? text.slice(0,117)+"..." : (text ?? "");
  };

  return (
    <div className="fade-in">
      <div className="flex items-start justify-between gap-4 mb-5">
        <div>
          <h1 className="text-2xl font-bold text-slate-900 mb-1">Live Database</h1>
          <p className="text-slate-500 text-sm">Read-only MySQL view for demo verification. Latest 50 rows per table are shown.</p>
        </div>
        <button onClick={load} disabled={loading} className="px-3 py-2 rounded-lg bg-slate-900 text-white text-xs font-semibold disabled:opacity-50">{loading?"Refreshing...":"Refresh"}</button>
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        {names.map(name=>(
          <button key={name} onClick={()=>setSelected(name)} className={`px-3 py-2 rounded-lg text-xs font-semibold border ${selected===name?"bg-blue-50 border-blue-200 text-blue-800":"bg-white border-slate-200 text-slate-500"}`}>
            {name} <span className="ml-1 text-slate-400">{tables[name].count}</span>
          </button>
        ))}
      </div>
      <div className="bg-white rounded-2xl border border-slate-200 p-5 overflow-x-auto">
        <div className="font-semibold text-slate-800 mb-3">{selected} table</div>
        <table className="w-full text-xs min-w-[760px]">
          <thead>
            <tr className="text-left text-slate-400 border-b border-slate-100">
              {current.columns.map(col=><th key={col} className="pb-2.5 pr-4 font-medium">{col}</th>)}
            </tr>
          </thead>
          <tbody>
            {current.rows.map((row,i)=>(
              <tr key={row.id ?? row.token ?? i} className="border-b border-slate-50 align-top">
                {current.columns.map(col=><td key={col} className="py-2.5 pr-4 text-slate-600 max-w-[260px]">{cell(row[col])}</td>)}
              </tr>
            ))}
            {current.rows.length===0 && <tr><td className="py-8 text-center text-slate-400" colSpan={Math.max(current.columns.length,1)}>No rows yet.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

      <h1 className="text-2xl font-bold text-slate-900 mb-1">{title}</h1>
      <p className="text-slate-500">{body}</p>
    </div>
  );
}
